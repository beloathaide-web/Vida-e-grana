<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vida &amp; Grana · jogo de finanças</title>
<meta name="description" content="Viva uma vida inteira e aprenda a investir na prática. Jogo educativo de finanças com Tesouro, ações, fundos imobiliários, simulador de carteira com a bolsa de verdade e viagem no tempo com preços históricos da B3.">
<link rel="icon" href="img/icone.png">
<meta property="og:title" content="Vida &amp; Grana">
<meta property="og:description" content="Viva uma vida inteira e aprenda a investir na prática.">
<meta property="og:image" content="img/capa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4fa;--surface:#ffffff;--surface2:#e9ecf8;--ink:#14193a;--muted:#5d6485;--line:#dde1f0;
  --brand:#2a3fd6;--brand-ink:#ffffff;--brand-soft:#e3e7ff;--gold:#f5b800;--gold-ink:#3b2b00;--gold-soft:#fff1c2;
  --good:#0f8a5f;--bad:#d33b3b;--warn-soft:#ffe3e0;--shadow:0 10px 30px rgba(20,25,58,.14);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1024;--surface:#171b3a;--surface2:#1f2448;--ink:#eceffd;--muted:#9aa2cf;--line:#2b3160;
    --brand:#7d8cff;--brand-ink:#0d1024;--brand-soft:#232a5c;--gold:#ffcc33;--gold-ink:#2c2100;--gold-soft:#3a3010;
    --good:#46d39a;--bad:#ff7a7a;--warn-soft:#3b1d27;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1024;--surface:#171b3a;--surface2:#1f2448;--ink:#eceffd;--muted:#9aa2cf;--line:#2b3160;
  --brand:#7d8cff;--brand-ink:#0d1024;--brand-soft:#232a5c;--gold:#ffcc33;--gold-ink:#2c2100;--gold-soft:#3a3010;
  --good:#46d39a;--bad:#ff7a7a;--warn-soft:#3b1d27;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.muted{color:var(--muted)}.sm{font-size:13px}.up{color:var(--good)}.dn{color:var(--bad)}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.02em}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 16px 12px;border-radius:0 0 24px 24px;box-shadow:var(--shadow)}
.top-row{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.top .muted{color:inherit;opacity:.75}
.icon{background:rgba(255,255,255,.18);border:0;border-radius:12px;width:36px;height:32px;font-size:18px;color:inherit;line-height:1}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 10px}
.stat{background:rgba(255,255,255,.14);border-radius:14px;padding:7px 10px;min-width:0}
.stat span{display:block;font-size:12px;opacity:.85;white-space:nowrap}
.stat b{font-size:16px;white-space:nowrap}
.stat.bad{background:#ffe3e0;color:#8a1d1d}
.goal small{display:block;margin-top:5px;font-size:12px;opacity:.9}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .5s}
.bar.dark{background:var(--surface2)}.bar.dark i{background:var(--brand)}

/* conteúdo */
main{padding:16px 14px 170px}
.card{background:var(--surface);border-radius:20px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{font-size:18px;margin-bottom:6px}
.card p{margin:4px 0}
.mission{background:var(--gold-soft);border-color:transparent;position:relative}
.mission .tag{font-size:12px;font-weight:600;color:var(--gold-ink);opacity:.75}
.mission h3{color:var(--gold-ink);font-size:21px;margin:2px 0 4px}
.mission p{color:var(--gold-ink)}
:root[data-theme="dark"] .mission h3,:root[data-theme="dark"] .mission p,:root[data-theme="dark"] .mission .tag{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mission h3,:root:not([data-theme="light"]) .mission p,:root:not([data-theme="light"]) .mission .tag{color:var(--gold)}}
.steps{display:flex;gap:5px;margin-top:10px}
.steps i{flex:1;height:6px;border-radius:9px;background:rgba(0,0,0,.12)}
.steps i.on{background:var(--gold-ink)}
:root[data-theme="dark"] .steps i.on{background:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .steps i.on{background:var(--gold)}}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.tip .av{font-size:26px;line-height:1}
.tip p{margin:0;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;font-weight:600;font-size:15px;text-align:left;line-height:1.2}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.center{text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.btn small{display:block;font-weight:400;opacity:.8;font-size:12px;margin-top:2px}
.btn.on{outline:2px solid var(--brand);background:var(--brand-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border:0}
.kv b{white-space:nowrap}
.log p{font-size:14px;margin:6px 0;padding-left:10px;border-left:3px solid var(--line)}
.log p small{color:var(--muted)}
.h-row{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
.h-row h2{font-size:20px}

/* investir */
.asset{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.a-top{display:flex;justify-content:space-between;gap:10px}
.a-top b{font-size:17px}
.a-right{text-align:right}
.chg{display:block;font-size:14px;font-weight:600}
.a-mid{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.risk{font-size:12px;letter-spacing:2px;color:var(--brand)}
.spark{width:84px;height:28px}
.hold{background:var(--surface2);border-radius:12px;padding:7px 10px;margin:8px 0;font-size:14px}
.a-btns{display:flex;gap:8px;margin-top:8px}
.a-btns .btn{flex:1;text-align:center}
.lock{text-align:center;padding:30px 20px}
.lock .big{font-size:44px}
.news-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.news-item:last-child{border:0}
.news-item .e{font-size:22px}
.news-item b{font-size:15px;line-height:1.25;display:block}
.lesson{display:flex;gap:12px}
.lesson .e{font-size:28px}
.lesson.locked{opacity:.55}

/* rodapé fixo */
.bar-bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:520px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(20,25,58,.1)}
.advance{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.advance .btn{text-align:center;padding:12px 8px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);margin-top:8px}
.tab{background:none;border:0;padding:6px 0 2px;font-size:11px;color:var(--muted);font-weight:600}
.tab span{display:block;font-size:20px}
.tab.on{color:var(--brand)}

/* modal */
#overlay{position:fixed;inset:0;z-index:20;background:rgba(10,12,35,.55);display:flex;align-items:flex-end;justify-content:center}
#overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.sheet h2{font-size:24px;margin-bottom:8px}
.sheet .em{font-size:40px;line-height:1;margin-bottom:6px}
.sheet p{margin:8px 0}
.stack{display:grid;gap:8px;margin-top:12px}
.warn{background:var(--warn-soft);border-radius:12px;padding:8px 10px;font-size:13px;margin-top:6px;color:var(--ink)}
.input{width:100%;font:inherit;font-size:22px;font-weight:600;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.preview{font-size:14px;color:var(--muted);margin:8px 0;min-height:42px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* início */
.hero{background:var(--brand);color:var(--brand-ink);padding:34px 20px 40px;border-radius:0 0 34px 34px}
.hero h1{font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:.95}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:14px 0 0;font-size:17px;opacity:.92;max-width:30ch}
.diffs{padding:18px 14px 30px;display:grid;gap:10px}
.diff{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.diff .e{font-size:34px}
.diff b{font-size:19px;display:block}
.diff span{font-size:14px;color:var(--muted)}
.diff.hard{background:var(--ink);color:var(--bg);border-color:transparent}
.diff.hard span{color:var(--bg);opacity:.75}
.small-print{font-size:12px;color:var(--muted);padding:0 20px 30px;text-align:center}
.rk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rk-row:last-child{border:0}
.rk-row.me{background:var(--brand-soft);border-radius:14px;padding:10px 8px;border-bottom-color:transparent}
.rk-pos{width:38px;text-align:center;font-weight:800;font-size:17px;flex:none}
.rk-name{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-time{text-align:right;font-weight:800;flex:none}
.rk-time small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.err{background:var(--warn-soft);border-radius:12px;padding:8px 10px;font-size:14px;margin-top:8px}
.qm{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--brand);background:transparent;color:var(--brand);font-weight:800;font-size:14px;line-height:1;padding:0;vertical-align:middle;margin-left:6px;flex:none}
.sec{font-size:16px;margin:16px 0 2px}
.ex{background:var(--surface2);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px;margin-top:12px}
.ex p{margin:4px 0 0}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin:14px 0 6px}
input[type=range]{width:100%;accent-color:var(--brand);height:28px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface2);border:0;border-radius:14px;padding:10px 12px;margin-top:8px}
.prow small{display:block;color:var(--muted);font-size:12px}
.field label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.field .input{font-size:18px;padding:10px 12px}
.field .hint{font-size:12px;color:var(--muted);margin-top:3px}
.goods{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.goods span{background:var(--surface2);border-radius:99px;padding:4px 10px;font-size:13px}
.sheet.noanim{animation:none}
.ob{display:flex;flex-direction:column;min-height:100vh;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--brand-ink);padding:8px 0 16px}
.ob-top{display:flex;justify-content:space-between;align-items:center;padding:4px 12px 4px 20px;font-size:15px}
.ob-skip{background:none;border:0;color:inherit;opacity:.8;font-weight:600;padding:10px 8px}
.ob-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.ob-track::-webkit-scrollbar{display:none}
.ob-slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;padding:16px 28px}
.ob-art{width:120px;height:120px;border-radius:38px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:60px;margin-bottom:28px;transform:rotate(-5deg)}
.ob-slide:nth-child(even) .ob-art{transform:rotate(4deg)}
.ob-slide h2{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ob-slide p{font-size:18px;opacity:.92;margin:14px 0 0;max-width:30ch}
.ob-dots{display:flex;gap:6px;justify-content:center;padding:12px}
.ob-dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.35);transition:width .2s}
.ob-dots i.on{width:24px;background:var(--gold)}
.ob-actions{padding:4px 16px}
.ob-actions .btn{width:100%;padding:16px;font-size:17px}
@media (prefers-reduced-motion:reduce){.ob-dots i{transition:none}}
.top-row>div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{padding:8px 14px 10px}
.stats{margin:8px 0}
.stat{padding:5px 9px;border-radius:12px}
.stat span{font-size:11px}
.stat b{font-size:15px}
main{padding:12px 12px 150px}
.mission h3{font-size:19px}
.mtip{border-top:1px dashed rgba(0,0,0,.18);margin-top:10px!important;padding-top:8px;font-size:14px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.qa .btn{text-align:center;padding:9px 4px 8px;font-size:13px;line-height:1.15}
.qa .btn span{display:block;font-size:22px;line-height:1;margin-bottom:4px}
.qa .btn small{font-size:11px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin:2px 0 10px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 2px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(20,25,58,.14)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mini span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:13px}
.arow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.arow.held{border-color:var(--brand)}
.arow .an{flex:1;min-width:0}
.arow .an b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .an small{font-size:12px;color:var(--muted)}
.arow .ap{text-align:right;flex:none;min-width:78px}
.arow .ap b{display:block;font-size:15px}
.arow .ap span{font-size:12px;font-weight:600}
.arow .spark{width:54px;height:24px;flex:none}
.ltiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ltile{display:flex;gap:8px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;font-weight:600;font-size:13px;line-height:1.2;min-height:58px}
.ltile .e{font-size:22px;flex:none}
.ltile.locked{opacity:.55}
.bq-hero{background:var(--brand);color:var(--brand-ink);border-radius:0 0 24px 24px;padding:14px 16px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bq-hero .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.bq-hero .row{display:flex;gap:8px;margin-top:8px}
.bq-hero .row div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:6px 9px;font-size:12px}
.bq-hero .row b{display:block;font-size:15px}
.bq-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;color:inherit;text-decoration:none}
.bq-row .tk{font-weight:800;min-width:64px}
.bq-row .nm{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bq-row .px{text-align:right;font-weight:600;white-space:nowrap}
.bq-row .px small{display:block;font-size:12px}
.diff.cta{background:linear-gradient(135deg,#2a3fd6,#7a2fd6);color:#fff;border:0;position:relative;box-shadow:var(--shadow)}
.diff.cta span{color:#fff;opacity:.9}
.diff.cta .badge{position:absolute;top:10px;right:12px;background:#f5b800;color:#3b2b00;font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.flow div{background:var(--surface2);border-radius:12px;padding:6px 8px}
.flow span{display:block;font-size:11px;color:var(--muted)}
.flow b{font-size:14px}

/* ===== Estilo B1 · pixel aconchegante ===== */
:root{
  --bg:#fdf3dc;--surface:#fffaf0;--surface2:#f6e7c8;--ink:#3b2414;--muted:#7a5a3e;--line:#6b4423;--hair:#e2cfa9;
  --brand:#3f7d4e;--brand-ink:#fffaf0;--brand-soft:#e3efd9;--gold:#e9a23b;--gold-ink:#3b2414;--gold-soft:#fde7b0;
  --good:#2f7d3a;--bad:#b83a26;--warn-soft:#fbdccf;--shadow:3px 3px 0 #6b4423;--brand-hi:#3f7d4e;--px:'Pixelify Sans','Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1611;--surface:#2a2018;--surface2:#382a1f;--ink:#f6e7c8;--muted:#c8ab8a;--line:#8a6a48;--hair:#4a3828;
  --brand:#3f7d4e;--brand-ink:#fffaf0;--brand-soft:#2f3d28;--brand-hi:#8fd08a;--gold:#f0b450;--gold-ink:#2a1c0c;--gold-soft:#4a3618;
  --good:#7fd38a;--bad:#ff8a70;--warn-soft:#4a2a20;--shadow:3px 3px 0 #000;
}}
:root[data-theme="dark"]{
  --bg:#1d1611;--surface:#2a2018;--surface2:#382a1f;--ink:#f6e7c8;--muted:#c8ab8a;--line:#8a6a48;--hair:#4a3828;
  --brand:#3f7d4e;--brand-ink:#fffaf0;--brand-soft:#2f3d28;--brand-hi:#8fd08a;--gold:#f0b450;--gold-ink:#2a1c0c;--gold-soft:#4a3618;
  --good:#7fd38a;--bad:#ff8a70;--warn-soft:#4a2a20;--shadow:3px 3px 0 #000;
}
h1,h2,h3,.hero h1,.ob-slide h2,.tab,.tag,.lbl span,.sec,.btn.primary,.btn.gold,.chip.on,.stat span,.top-row b,.badge{font-family:var(--px);letter-spacing:0}
h1,h2,h3{font-weight:700}
.hero h1{font-size:56px;line-height:.95}
.ob-slide h2{font-size:34px}
.card,.asset,.arow,.diff,.prow,.bq-row,.tip,.btn,.chip,.input,.hold,.warn,.ex,.stat,.tile,.lesson{border-radius:6px}

var DEEP={
 'Petróleo dispara após tensão no Oriente Médio':{why:'O Oriente Médio concentra boa parte da produção mundial de petróleo. Conflitos ameaçam a oferta e, quando o mundo teme falta, o barril sobe. A petroleira vende cada barril mais caro com o mesmo custo de extração, então o lucro cresce mais que o preço do petróleo.',ex:'Custo de US$ 40 e barril indo de US$ 80 para US$ 90 (+12,5%): a margem por barril passa de US$ 40 para US$ 50, ou seja, +25% de lucro.'},
 'Petrolão anuncia nova descoberta de petróleo':{why:'Uma descoberta aumenta as reservas, isto é, quanto petróleo a empresa poderá vender no futuro. O mercado antecipa esses lucros e o preço sobe já no anúncio, anos antes de o primeiro barril sair.',ex:'Se as reservas crescem 10% e dá para extrair com lucro, o valor da empresa tende a subir na mesma direção. Mas a extração leva anos e custa caro, por isso há quem desconfie.'},
 'Barril de petróleo despenca com excesso de oferta':{why:'Quando os países produzem mais petróleo do que o mundo consome, sobra produto e o preço cai. A petroleira continua com os mesmos custos, então a margem encolhe rápido.',ex:'Custo de US$ 40 e barril caindo de US$ 80 para US$ 64 (−20%): a margem vai de US$ 40 para US$ 24, uma queda de 40% no lucro por barril.'},
 'Petrolão enfrenta escândalo de gestão':{why:'Escândalos levantam dúvidas sobre decisões ruins, desvios e multas futuras. Os investidores passam a exigir um desconto para correr esse risco de governança, e o preço cai mesmo com o petróleo estável.',ex:'Governança é o conjunto de regras que protege o acionista. Empresas com histórico de interferência costumam valer menos que rivais parecidas, para o mesmo lucro.'},
 'China acelera compras de minério de ferro':{why:'A China é a maior produtora de aço do mundo, e o minério de ferro é a matéria-prima do aço. Quando o governo chinês estimula obras e indústria, a demanda sobe, o preço do minério sobe e as mineradoras exportadoras lucram mais.',ex:'A mineradora vende em dólar. Minério 10% mais caro e dólar 5% mais alto rendem cerca de 15% a mais de receita em reais.'},
 'China desacelera e minério de ferro desaba':{why:'Se a China desacelera, compra menos minério, os estoques se acumulam e o preço cai. Como a mineradora depende muito de um só produto e de um grande cliente, a ação sente forte.',ex:'Concentração é risco: quando um cliente responde pela maior parte da receita, um problema nele vira um problema seu.'},
 'Banco Itaúna divulga lucro acima do esperado':{why:'O preço de uma ação já reflete o lucro que o mercado espera. Quando o resultado vem acima da expectativa, os investidores refazem as contas para cima e o preço sobe. O que mexe no preço é a surpresa, não só o número.',ex:'Se o mercado esperava R$ 4 de lucro por ação e veio R$ 4,40, com P/L de 8 o preço justo vai de R$ 32 para R$ 35,20 (+10%).'},
 'Calote cresce e preocupa os grandes bancos':{why:'Quando mais clientes atrasam pagamentos, o banco precisa separar dinheiro para perdas futuras: a provisão para devedores duvidosos (PDD). Essa reserva sai do lucro antes mesmo de o calote se confirmar.',ex:'Um banco que lucraria R$ 10 bilhões e precisa provisionar R$ 1 bilhão a mais mostra lucro 10% menor.'},
 'Vendas do varejo surpreendem no Dia das Mães':{why:'Datas comemorativas concentram vendas. Se o resultado vem acima do esperado, o mercado projeta mais lucro para o ano. Como os custos fixos (aluguel, salários) já estão pagos, cada venda extra vira bastante lucro.',ex:'Com margem de 5%, vender R$ 100 milhões a mais traria R$ 5 milhões de lucro. Com os custos fixos já cobertos, o lucro desse extra pode ser bem maior.'},
 'Varejo sente o peso dos juros e as vendas caem':{why:'Boa parte das compras de eletrônicos e móveis é parcelada. Com juros altos a parcela encarece, as pessoas adiam a compra e a varejista vende menos. Além disso, a própria empresa paga mais juros sobre as dívidas dela.',ex:'Uma TV de R$ 3.000 em 12× a 2% ao mês tem parcela de R$ 284. A 4% ao mês, sobe para R$ 320, e muita gente desiste.'},
 'Reajuste de tarifa melhora o caixa das elétricas':{why:'A tarifa de energia é regulada e reajustada periodicamente. Um reajuste acima do esperado aumenta a receita de uma empresa com custos previsíveis, o que melhora o lucro e os dividendos.',ex:'Com receita de R$ 1 bilhão e reajuste de 5%, entram R$ 50 milhões a mais por ano, quase tudo virando lucro.'},
 'Seca reduz geração e pressiona as elétricas':{why:'O Brasil depende muito de hidrelétricas. Na seca, os reservatórios baixam e é preciso ligar usinas térmicas, movidas a combustível e bem mais caras. Geradoras que se comprometeram a entregar energia podem ter de comprá-la cara no mercado.',ex:'É o mesmo motivo pelo qual a bandeira da conta de luz fica vermelha: gerar energia ficou mais caro.'},
 'Grandes fundos anunciam compra de Cripto Coin':{why:'Cripto não tem lucro nem dividendos: o preço depende só de quem quer comprar e de quem quer vender. Quando grandes investidores entram, a demanda sobe de uma vez com oferta limitada, e o preço dispara. Quando saem, acontece o contrário.',ex:'Em um mercado pequeno, poucos compradores grandes mexem muito no preço. Isso explica tanto as altas de 50% quanto as quedas de 50%.'},
 'Corretora de cripto quebra e o mercado derrete':{why:'Quando uma corretora grande quebra, clientes perdem acesso ao dinheiro, a confiança no setor desaba e muita gente vende ao mesmo tempo. Não existe FGC para cripto.',ex:'Foi o que aconteceu com a FTX em 2022: uma das maiores corretoras do mundo pediu falência e o mercado cripto inteiro caiu junto.'},
 'Queda de juros anima os fundos imobiliários':{why:'FIIs competem com a renda fixa. Se o Tesouro passa a pagar menos, o aluguel mensal do FII fica relativamente mais atraente, mais gente compra cotas e o preço sobe.',ex:'Um FII que paga R$ 0,80 por mês numa cota de R$ 100 rende 9,6% ao ano. Se os juros caem e a cota sobe para R$ 110, o rendimento de quem compra agora cai para 8,7%, e quem já tinha ganhou 10%.'},
 'Vacância sobe em galpões e shoppings':{why:'Vacância é a parte dos imóveis sem inquilino. Espaço vazio não paga aluguel e ainda gera condomínio e IPTU para o fundo, então o rendimento distribuído cai, e a cota cai junto.',ex:'Se um fundo tem 10 lojas iguais e 2 ficam vazias, a receita cai 20% e os custos dessas lojas passam a ser do fundo.'},
 'Inflação desacelera e a bolsa comemora':{why:'Inflação mais baixa abre espaço para o Banco Central cortar a Selic. Juros menores barateiam o crédito, ajudam o lucro das empresas e deixam a renda fixa menos atraente, então dinheiro migra para a bolsa.',ex:'Se o Tesouro passa a pagar 9% em vez de 12% ao ano, uma ação que paga 8% em dividendos fica muito mais interessante.'},
 'Incerteza fiscal assusta os investidores':{why:'Risco fiscal é a dúvida sobre se o governo vai conseguir pagar as contas. Investidores pedem juros maiores para emprestar ao país, o dólar sobe e as empresas passam a valer menos, porque o lucro futuro é descontado a juros mais altos.',ex:'Um lucro de R$ 100 daqui a 10 anos vale hoje R$ 39 descontado a 10% ao ano, mas só R$ 32 a 12%.'}
};

 decimo:{e:'🎁',t:'13º salário',b:'O 13º não é presente: é parte do seu salário anual, paga em dezembro. Ótima hora de quitar dívidas ou reforçar os investimentos.',k:'Trabalhe até dezembro.'},

 aposta:{e:'🎰',t:'Apostas e valor esperado',b:'Valor esperado é quanto você ganha, em média, por aposta. No bolão do jogo, R$ 50 dão 1 chance em 300 de levar R$ 10 mil: em média, R$ 33 de volta. Ou seja, perde R$ 17 a cada aposta. Na Mega-Sena, uma aposta simples tem 1 chance em 50 milhões. Loterias e casas de apostas são feitas para a banca ganhar.',k:'Receba um convite para apostar.'},
 sair_casa:{e:'📦',t:'Sair de casa custa mais que o aluguel',b:'Além do aluguel, há caução (em geral 2 ou 3 aluguéis), mudança, móveis e contas que antes eram dos seus pais. Exemplo: um aluguel de R$ 1.100 pede uns R$ 2.200 de caução e R$ 800 de mudança, ou seja, R$ 3.000 antes do primeiro mês. Juntar isso antes evita começar a vida nova no cartão.',k:'Sinta a pressão para sair de casa.'},
 filhos:{e:'👶',t:'Quanto custa um filho',b:'No jogo, um filho custa R$ 800 por mês até os 6 anos e R$ 600 depois, mais R$ 1.500 se for escola particular. Do nascimento aos 18 anos: cerca de R$ 144 mil com escola pública ou R$ 360 mil com particular, em valores de hoje. Planejar transforma o sonho em algo que cabe no orçamento.',k:'Planeje um filho.'},
 carreira:{e:'🧭',t:'Escolher um caminho',b:'Cursos curtos sobem o salário rápido; graduação e pós demoram, custam mais e pagam mais no longo prazo. Exemplo: uma graduação de 36 meses a R$ 550 custa R$ 19.800. Se o salário sobe de R$ 2.600 para R$ 5.000, a diferença de R$ 2.400 por mês paga o curso em pouco mais de 8 meses.',k:'Comece um curso.'},
 nome_sujo:{e:'🔴',t:'Nome sujo',b:'Conta em atraso leva o seu nome para cadastros como o Serasa. Sem crédito, não dá para financiar nem parcelar. Além da multa, os juros continuam correndo. Quitar ou fechar um acordo limpa o nome.',k:'Deixe uma conta atrasar.'},
 renegociar:{e:'🤝',t:'Renegociar dívidas',b:'Dívida cara se resolve trocando por uma mais barata: o rotativo (~12% ao mês) vira parcelas fixas com juros menores. Exemplo: R$ 5.000 viram 24 parcelas de cerca de R$ 292 a 2,9% ao mês. E no Brasil, desde 2024, juros e encargos do rotativo e do parcelamento da fatura não podem passar de 100% do valor original da dívida: no máximo, ela dobra.',k:'Tenha uma dívida grande.'},
 humor:{e:'🫠',t:'Dinheiro e bem-estar',b:'Cortar todo o lazer para investir mais parece eficiente, mas pode sair caro: sem descanso nem conforto, a motivação acaba e uma decisão impulsiva desfaz anos de esforço. Um bom plano financeiro cabe na sua vida, não o contrário.',k:'Deixe o humor chegar a zero.'},
 financiamento:{e:'🏦',t:'SAC ou Price',b:'No financiamento você paga juros sobre o saldo devedor. No SAC a amortização é fixa: a parcela começa alta e vai caindo. No Price a parcela é fixa, mas no começo quase tudo é juros. Exemplo: R$ 200 mil a 1% ao mês por 20 anos. SAC: 1ª parcela de R$ 2.833 e R$ 241 mil de juros no total. Price: parcela de R$ 2.202 e R$ 328 mil de juros.',k:'Simule a compra de um imóvel.'},
 entrada:{e:'💰',t:'Entrada maior, juros menores',b:'Os juros incidem sobre o valor financiado, então cada real de entrada deixa de pagar juros por anos. Exemplo: imóvel de R$ 300 mil a 1% ao mês por 20 anos (Price). Com 20% de entrada, a parcela é R$ 2.643 e os juros somam R$ 394 mil. Com 50%, a parcela cai para R$ 1.652 e os juros para R$ 246 mil.',k:'Feche um financiamento.'},
 consorcio:{e:'🎲',t:'Consórcio',b:'Um grupo paga parcelas para um fundo comum e todo mês alguém é sorteado ou dá um lance para receber a carta de crédito. Não há juros, mas há taxa de administração e você não sabe quando vai receber. Exemplo: carta de R$ 300 mil com taxa de 18% em 15 anos dá parcelas de R$ 1.967 e R$ 54 mil de custo extra, bem menos que os juros de um financiamento, mas a espera pode levar anos.',k:'Entre num consórcio.'},
 amortizacao:{e:'✂️',t:'Amortizar encurta a dívida',b:'Pagar um valor extra no financiamento reduz o saldo devedor. Reduzindo o prazo, você deixa de pagar os juros dos meses cortados. Numa dívida a 1% ao mês, cada real amortizado “rende” 1% ao mês garantido, mais que quase qualquer investimento seguro.',k:'Amortize um financiamento.'},
 alugar_comprar:{e:'🔑',t:'Alugar ou comprar?',b:'O aluguel costuma custar de 0,4% a 0,5% do valor do imóvel por mês. Exemplo: um apartamento de R$ 400 mil aluga por uns R$ 1.800. Os mesmos R$ 400 mil a 10% ao ano renderiam cerca de R$ 3.300 por mês. Comprar traz estabilidade e conforto; alugar pode sair mais barato. Depende dos juros e do seu momento de vida.',k:'Veja os imóveis à venda.'},
 depreciacao:{e:'📉',t:'Bens que perdem valor',b:'Um carro novo perde de 10% a 15% do valor por ano, além de custar seguro, IPVA, combustível e manutenção. Exemplo: um carro de R$ 65 mil perdendo 12% ao ano vale cerca de R$ 34 mil depois de 5 anos.',k:'Compre um carro.'},
 conforto:{e:'🛋️',t:'Conforto não é investimento',b:'Bens deixam o dia a dia melhor e sobem o seu humor, mas não rendem nada: quebram, dão manutenção e perdem valor. Quanto mais coisas você tem, mais problemas aparecem. Vale comprar o conforto que você realmente usa, de preferência à vista.',k:'Compre um bem para casa.'},
 mesada:{e:'🍼',t:'O dia em que a mesada acaba',b:'Quem depende de ajuda precisa planejar o dia em que ela termina. O melhor uso da mesada é construir renda própria e patrimônio antes disso.',k:'Chegue ao fim da mesada.'},
 liberdade:{e:'🏝️',t:'Liberdade financeira',b:'É quando seus investimentos pagam seus gastos sem você precisar trabalhar. Conta prática: com um patrimônio de 300 vezes os gastos mensais dá para retirar uns 4% ao ano sem acabar com o dinheiro. R$ 1 milhão rende cerca de R$ 3.300 por mês nessa conta: para quem gasta R$ 3.000 já é liberdade, para quem gasta R$ 8.000 ainda falta chão.',k:'Chegue a R$ 1 milhão.'}

function propsMonth(sk){sk=sk||{};

 });

function houseQuote(c){
 var H=HOMES[c.h],V=Math.round(H.p*S.infl/1000)*1000,cost=Math.round(V*.04),q={V:V,cost:cost,rent:V*.0045},inc=income();
 if(c.mode==='vista'){q.disc=V*.05;q.up=V-q.disc+cost;q.total=q.up;q.ok=S.cash>=q.up;q.why=q.ok?'':'Faltam '+fmt(q.up-S.cash)+' no caixa para pagar à vista.';}
 else if(c.mode==='fin'){
  var ra=finRate(),rm=Math.pow(1+ra,1/12)-1,E=V*c.ent,L=V-E,n=c.prazo;
  q.ra=ra;q.rm=rm;q.E=E;q.L=L;q.n=n;
  if(c.sys==='SAC'){var a=L/n;q.first=a+L*rm;q.last=a+a*rm;q.juros=rm*L*(n+1)/2;}
  else{var pp=pmt(L,n,rm);q.first=q.last=pp;q.juros=pp*n-L;}
  q.up=E+cost;q.total=V+q.juros+cost;
  q.ok=S.cash>=q.up&&q.first<=inc*.3;
  var k1=c.sys==='SAC'?(1/n+rm):pmt(1,n,rm),eMin=Math.ceil((1-inc*.3/k1/V)*20)*5;
  q.why=S.cash<q.up?'Faltam '+fmt(q.up-S.cash)+' para a entrada e os custos de compra.':(q.first>inc*.3?'O banco recusa: a 1ª parcela passa de 30% da sua renda ('+fmt(inc*.3)+'). Para caber, a entrada precisa ser de pelo menos '+Math.min(100,Math.max(20,eMin))+'% ou a renda de '+fmt(q.first/.3)+'.'+(c.sys==='SAC'?' No Price a 1ª parcela é menor.':''):'');
 }else{
  var n2=c.cprazo,a2=n2===120?.15:.18,P=V*(1+a2)/n2;
  q.a=a2;q.n=n2;q.P=P;q.adm=V*a2;q.lanceV=V*c.lance;q.total=V*(1+a2)+cost;q.up=0;
  q.chance=.012+(c.lance>0?c.lance*.25:0);q.wait=Math.min(1/q.chance,n2);
  q.ok=P<=inc*.5;q.why=q.ok?'':'A parcela passa da metade da sua renda ('+fmt(inc*.5)+').';
 }
 if(S.neg&&c.mode!=='vista'){q.ok=false;q.why='Seu nome está negativado: sem crédito até quitar ou renegociar os atrasados.';}
 return q;
}

 else{p.owned=false;p.cons={C:q.V,a:q.a,n:q.n,left:q.n,P:q.P,paid:0,lance:c.lance};unlock('consorcio');addLog('🎲 Entrou num consórcio de '+fmt(q.V)+' para '+H.n+'.');}

function remInt(L,b,n){return L.sys==='SAC'?L.rm*b*(n+1)/2:Math.max(0,L.pmt*n-b);}
function amortCalc(L,x){
 var b2=L.bal-x;if(b2<1)return {left:0,save:remInt(L,L.bal,L.left)};
 var n2=L.sys==='SAC'?Math.ceil(b2/L.amort):Math.ceil(-Math.log(1-b2*L.rm/L.pmt)/Math.log(1+L.rm));
 return {left:n2,save:Math.max(0,remInt(L,L.bal,L.left)-remInt(L,b2,n2))};
}

function essentials(){var s=S;return livingNow()-housing()*(s.shared?.8:1)+kidsMonthly()+itemsMonthly()+s.props.reduce(function(a,p){return a+(p.owned?p.V*.0008:0);},0);}
function needBills(){var s=S;return s.inst.length>0||s.debt>0.5||(s.arrears||0)>0.5||s.props.some(function(p){return p.loan||(p.cons&&p.cons.left>0);});}
function billsTotal(){return essentials()+billsList().reduce(function(a,b){return a+b.amt;},0)+(S.debt>0.5?S.debt:0);}
function needBillsNow(){if(!needBills())return false;if(!S.autopay)return true;return S.cash+income()<billsTotal();}
function renegOpts(){
 var s=S,tot=s.debt+(s.arrears||0),capLeft=Math.max(0,(s.debtOrig||s.debt)-(s.debtChg||0));
 return [{n:12,r:.035},{n:24,r:.029},{n:36,r:.025}].map(function(o){var pp=pmt(tot,o.n,o.r),T=pp*o.n,mx=s.debt+capLeft+(s.arrears||0)*(1+o.r*o.n*.6);if(T>mx){T=mx;pp=T/o.n;}return {n:o.n,r:o.r,p:pp,T:T};});
}
function clearDebts(){var s=S;s.debt=0;s.debtOrig=0;s.debtChg=0;s.arrears=0;s.neg=false;s.capNoted=false;}

}

function tick(){

 s.whatHappened=[];
 if(s.happy<=0.5)crisis();
 if(s.job){var p=s.job.salary;if(s.job.v)p*=1+rnd(-s.job.v,s.job.v);inc+=p;s.job.months++;

 if(s.allowance>0&&s.month===s.allowMonths-6)addLog('⚠️ Faltam 6 meses para a mesada acabar.');
 if(s.allowance>0&&s.month===s.allowMonths){unlock('mesada');addLog('⚠️ A mesada acabou. Agora a renda é sua.');}
 var P=s.plan||{skip:{},card:s.autopay?'total':'none'},sk=P.skip||{};s.plan=null;
 var rp=housing()*(s.shared?.8:1);
 out+=livingNow()-rp+kidsMonthly();
 if(rp>0){
  if(sk.rent){s.arrears=(s.arrears||0)+rp*1.1;s.rentLate=(s.rentLate||0)+1;addLog('⚠️ Aluguel atrasado ('+s.rentLate+'º mês). Multa de 10%.');if(s.rentLate>=3)evict();}
  else{out+=rp;s.rentLate=0;}
 }
 s.recur=s.recur.filter(function(r){if(sk['sub:'+r.id]){if(r.id==='news')s.news=false;addLog('✂️ Cancelou: '+r.n+'.');return false;}out+=r.amt;return true;});
 s.inst.forEach(function(x,i){
  if(sk['inst:'+i]){x.late=(x.late||0)+1;s.arrears=(s.arrears||0)+x.amt*1.02;
   if(x.late>=3){s.arrears+=x.amt*(x.left-1);x.left=0;addLog('🚨 '+x.name+': 3 parcelas atrasadas. A dívida toda venceu e foi para cobrança.');}
   else addLog('⚠️ Parcela atrasada: '+x.name+'.');}
  else{out+=x.amt;x.left--;x.late=0;}
 });
 s.inst=s.inst.filter(function(x){return x.left>0;});
 var pm=propsMonth(sk);inc+=pm.inc;out+=pm.out+itemsMonthly();
 if(s.study){if(sk.study)addLog('⏸️ Curso trancado neste mês.');
  else{out+=s.study.per;s.happy-=1.5;s.study.left--;if(s.study.left<=0){s.edu.push(s.study.id);addLog('🎓 Você concluiu: '+COURSE[s.study.id].n+'. Há vagas novas à espera.');s.study=null;}}}
 (s.refunds||[]).forEach(function(r){if(s.month>=r.m&&!r.done){r.done=true;inc+=r.amt;addLog('💸 O consórcio devolveu '+fmt(r.amt)+'.');}});
 if((s.arrears||0)>0.5)s.arrears*=1.01;
 s.cash+=inc;spend(out);
 if(s.debt>0.5){var pay=P.card==='total'?s.debt:P.card==='min'?s.debt*.15:0;pay=Math.min(pay,s.cash);if(pay>0){s.cash-=pay;s.debt-=pay;}}
 if(s.debt>0.5){var ji=Math.min(s.debt*.12,Math.max(0,(s.debtOrig||s.debt)-(s.debtChg||0)));s.debt+=ji;s.debtChg=(s.debtChg||0)+ji;s.stats.interest+=ji;
  if(ji>0.5)addLog('🔥 Juros do cartão: '+fmt(ji)+'.');else if(!s.capNoted){s.capNoted=true;unlock('renegociar');addLog('🛑 A dívida do cartão bateu o teto legal: juros e encargos já somam 100% do valor original.');}}
 if(s.debt<=0.5){s.debt=0;s.debtOrig=0;s.debtChg=0;s.capNoted=false;}
 s.neg=(s.arrears||0)>0.5;if(s.neg)unlock('nome_sujo');
 s.lastMonth={inc:inc,out:out};
 s.happy=clamp(s.happy+(happyTarget()-s.happy)*.06+LS[s.life].h+(s.job?0:-1.2),0,100);
 market();

function market(){
 var s=S,L=[];
 if(chance(.06))s.regime=pickW([[0,.2],[1,.58],[2,.22]]);
 var M=REG[s.regime].mu+.03*gauss(),sh={};
 s.nextNews.forEach(function(n){
  if(n.real){if(n.sector==='macro')M+=n.dir*n.mag;else sh[n.sector]=(sh[n.sector]||0)+n.dir*n.mag;s.whatHappened.push('✅ Confirmou: '+n.text);}
  else{s.whatHappened.push('❌ Era boato: '+n.text);if(s.news)unlock('noticias');}
 });
 if(chance(.12))s.selic=clamp(s.selic+pick([-.005,-.0025,.0025,.005]),.06,.15);
 var sm=Math.pow(1+s.selic,1/12)-1,moves=[];
 ASSETS.forEach(function(a){
  var r;
  if(a.id==='selic')r=sm;else if(a.id==='cdb')r=sm*1.05;else if(a.id==='poup')r=s.selic<.085?sm*.7:.005;
  else r=a.alpha+a.beta*M+(a.sector&&sh[a.sector]?sh[a.sector]:0)+a.sig*gauss();
  r=Math.max(r,a.id==='crpc'?-.5:-.4);
  s.prices[a.id]*=1+r;s.last[a.id]=r;
  var hs=s.hist[a.id];hs.push(s.prices[a.id]);if(hs.length>36)hs.shift();
  var h=s.port[a.id];
  if(h&&a.div){var d=h.q*s.prices[a.id]*a.div;s.cash+=d;s.stats.div+=d;}
  if(a.risk>=2)moves.push({a:a,r:r});
 });
 moves.sort(function(x,y){return Math.abs(y.r)-Math.abs(x.r);});
 s.whatHappened.push('📊 Maiores movimentos: '+moves.slice(0,3).map(function(m){return m.a.tk+' '+pct(m.r);}).join(' · '));
 var p=pv();
 if(p>1000){for(var id in s.port){if(hv(id)/p>.6&&s.last[id]<-.1)unlock('diversificar');}}
 if(distinct()>=3)unlock('diversificar');
 s.whatHappened.forEach(function(t){addLog(t);});
 genNews();
}
function yearTurn(){
 var s=S;
 s.inflRate=rnd(.035,.06);s.infl*=1+s.inflRate;unlock('inflacao');
 if(s.home==='aluguel'&&s.rent)s.rent.amt=Math.round(s.rent.amt*(1+s.inflRate));
 s.props.forEach(function(p){if(p.owned)p.V*=1+s.inflRate+rnd(-.03,.04);if(p.cons){p.cons.P*=1+s.inflRate;if(!p.owned)p.cons.C*=1+s.inflRate;}});
 if(s.job){
  var raise=s.inflRate*.9+(chance(.55)?rnd(0,.03):0),promo=.12+s.promoBonus+(s.happy>70?.06:0);
  if(chance(promo)){raise+=rnd(.10,.20);addLog('🚀 Promoção! Salário subiu '+(raise*100).toFixed(0)+'%.');}
  else addLog('📈 Reajuste anual de '+(raise*100).toFixed(1).replace('.',',')+'%.');
  s.job.salary=Math.round(s.job.salary*(1+raise)/10)*10;
 }
 addLog('🎂 Você fez '+age()+' anos. Preços subiram '+(s.inflRate*100).toFixed(1).replace('.',',')+'% no ano.');

function offerJobs(){
 var s=S,pool=[],seen={},min=s.job?s.job.salary*1.08:0;
 function add(j,t){var sal=Math.round(j.s*s.infl*rnd(.95,1.08)/10)*10;if(sal>min)pool.push({t:j.t,salary:sal,v:j.v||0,tier:t});}
 BASEJOBS.forEach(function(j){add(j,0);});
 (s.edu||[]).forEach(function(id){var c=COURSE[id];if(c)c.jobs.forEach(function(j){add(j,c.lv);add(j,c.lv);});});
 if(!pool.length)return;
 pool.sort(function(){return Math.random()-.5;});
 var offers=pool.filter(function(o){if(seen[o.t])return false;seen[o.t]=1;return true;}).slice(0,3);
 modalQ.push({type:'offers',offers:offers});
}
function drawEvent(soc){
 var s=S;if(!soc&&!chance(s.evProb))return false;
 var pool=EV.filter(function(e){return e.ok(s)&&e.id!==s.lastEv&&(!soc||e.soc);});
 if(!pool.length)return false;
 var e=pickW(pool.map(function(x){return [x,x.w];}));
 s.lastEv=e.id;
 var base=e.make?e.make(s):e;
 var ch=base.ch.map(function(c){var o={};for(var k in c)o[k]=c[k];o.cost=Math.round((c.c||0)*s.evMult*s.infl/10)*10;return o;});
 if(e.hit)s.happy=clamp(s.happy-e.hit,0,100);
 modalQ.push({type:'event',e:{t:base.t,d:base.d+(e.hit?' <span class="dn">(humor −'+e.hit+')</span>':'')},ch:ch});
 return true;
}

function tip(){

 if(s.happy<30)return 'Seu humor está baixo. Se chegar a zero, você perde a motivação e faz uma besteira cara. Padrão de vida melhor, bens e casa própria ajudam, mas custam.';
 if(s.won&&!s.submitted&&s.key!=='r')return 'Você bateu o milhão! Entre no ranking para comparar o seu tempo com o de outros jogadores.';
 if(s.neg)return 'Seu nome está negativado: sem financiamento nem parcelamento. Toque em Dívidas para pagar os atrasados ou renegociar.';
 if(s.debt>0)return 'Dívida no cartão custa cerca de 12% ao mês. Nenhum investimento rende isso. Se não der para quitar, renegocie em Dívidas.';
 if(s.home==='pais'&&(s.atHomeM||0)>=30)return 'Morar com os pais ajuda a juntar dinheiro, mas a pressão em casa cresce. Planeje a saída: caução, mudança e uma reserva.';
 if(!s.job&&s.key!=='sf')return 'Sem salário o dinheiro só sai. Toque em “Procurar emprego” e avance o mês.';
 if(!s.phone)return 'Foco no celular: é por ele que você investe e lê notícias.';
 if(!s.everInvested&&s.cash>ex*1.5)return 'Dinheiro parado perde para a inflação. Comece com algo seguro, como o Tesouro Selic.';
 if(safe()<ex*3)return 'Antes de arriscar, monte sua reserva: 3 meses de gastos em renda fixa.';
 if(distinct()<3)return 'Não ponha todos os ovos na mesma cesta. Distribua entre tipos de investimento.';
 if(s.cash>ex*6)return 'Seu caixa está alto. Mande o excedente para investir, mantendo a reserva.';
 return 'Constância vence talento. Invista todo mês, mesmo que seja pouco.';
}

function readAmt(){var el=document.getElementById('amt');if(!el)return 0;var v=parseFloat(String(el.value).replace(/\./g,'').replace(',','.'));return isFinite(v)?v:0;}

function tradePreview(){
 if(cur&&cur.type==='amort')return amortPreview();
 var m=cur,a=ASSET[m.id],amt=readAmt(),box=document.getElementById('prev');if(!box)return;
 if(amt<=0){box.innerHTML='Digite quanto quer '+(m.mode==='buy'?'investir':'vender')+'.';return;}
 if(m.mode==='buy'){box.innerHTML=amt>S.cash+.01?'<span class="dn">Você só tem '+fmt2(S.cash)+' no caixa.</span>':'Você compra <b>'+(amt/S.prices[a.id]).toFixed(3).replace('.',',')+'</b> cotas a '+fmt2(S.prices[a.id])+'.';}
 else{
  var h=S.port[m.id],val=hv(m.id),a2=Math.min(amt,val),f=a2/val,profit=a2-h.cost*f,tax=a.tf?0:Math.max(0,profit)*.15;
  box.innerHTML=(amt>val+.01?'<span class="dn">Você tem só '+fmt2(val)+' aqui.</span><br>':'')+'Lucro estimado: <b class="'+(profit>=0?'up':'dn')+'">'+fmt2(profit)+'</b>'+(a.tf?'':' · Imposto (15%): <b>'+fmt2(tax)+'</b>')+'<br>Cai no caixa: <b>'+fmt2(a2-tax)+'</b>';
 }
}
function doTrade(){
 var m=cur,a=ASSET[m.id],amt=readAmt(),price=S.prices[a.id];
 if(amt<=0){toast('Digite um valor.');return;}
 if(m.mode==='buy'){
  if(amt>S.cash+.01){toast('Caixa insuficiente.');return;}
  amt=Math.min(amt,S.cash);
  var h=S.port[a.id]||{q:0,cost:0};h.q+=amt/price;h.cost+=amt;S.port[a.id]=h;S.cash-=amt;S.everInvested=true;
  unlock('juros_compostos');
  if(a.id==='poup'||a.id==='selic')unlock('selic');else if(a.tipo==='Ação')unlock('acao');else if(a.tipo==='ETF')unlock('etf');else if(a.tipo==='Fundo imobiliário')unlock('fii');else if(a.tipo==='Cripto')unlock('risco');
  addLog('📈 Comprou '+fmt(amt)+' de '+a.tk+'.');toast('Comprou '+fmt(amt)+' de '+a.tk);
 }else{
  var val=hv(a.id);if(amt>val)amt=val;
  var hh=S.port[a.id],f=amt/val,profit=amt-hh.cost*f,tax=a.tf?0:Math.max(0,profit)*.15;
  hh.q*=1-f;hh.cost*=1-f;if(f>.9999||hh.q*price<.01)delete S.port[a.id];
  S.cash+=amt-tax;S.stats.taxes+=tax;
  if(profit>0&&!a.tf)unlock('imposto');
  addLog('💸 Vendeu '+fmt(amt)+' de '+a.tk+(tax>0?' (imposto '+fmt(tax)+')':'')+'.');toast('Vendeu '+fmt(amt)+' de '+a.tk);
 }
 closeModal();
}

function spark(arr){
 var w=84,h=28;if(arr.length<2)return '<svg class="spark"></svg>';
 var mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr),rg=mx-mn||1;
 var pts=arr.map(function(v,i){return ((i/(arr.length-1))*w).toFixed(1)+','+(h-3-((v-mn)/rg)*(h-6)).toFixed(1);}).join(' ');
 var up=arr[arr.length-1]>=arr[0];
 return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><polyline fill="none" stroke="var(--'+(up?'good':'bad')+')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts+'"/></svg>';
}
function nwChart(){
 var a=S.nw.slice(-180);if(a.length<3)return '<p class="muted sm">O gráfico aparece depois de alguns meses.</p>';
 var w=320,h=90,mn=Math.min.apply(null,a),mx=Math.max.apply(null,a),rg=mx-mn||1;
 var pts=a.map(function(v,i){return [(i/(a.length-1))*w,h-6-((v-mn)/rg)*(h-14)];});
 var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
 var zero=mn<0&&mx>0?'<line x1="0" x2="'+w+'" y1="'+(h-6-((0-mn)/rg)*(h-14)).toFixed(1)+'" y2="'+(h-6-((0-mn)/rg)*(h-14)).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="4 4"/>':'';
 return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:90px" aria-label="Patrimônio ao longo do tempo">'+zero+'<polygon points="0,'+h+' '+line+' '+w+','+h+'" fill="var(--brand-soft)"/><polyline points="'+line+'" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/></svg>';
}

function hExec(){

  H.cash-=tot;var P=H.pos[m.t]||{q:0,cost:0};P.q+=n;P.cost+=tot;H.pos[m.t]=P;toast('Comprou '+n+' '+hName(m.t));}
 else{var P2=H.pos[m.t];if(!P2||n>P2.q){toast('Quantidade maior que a sua posição.');return;}
  var avg=P2.cost/P2.q,tot2=n*px,profit=n*(px-avg),ym=hAdd(H.ym0,H.i);H.sold[ym]=(H.sold[ym]||0)+tot2;

  qa('shop','🛋️','Bens','+ humor')+(s.home==='pais'?qa('move','🚪','Sair de casa','pressão em casa',(s.atHomeM||0)>=36?'gold':''):qa('homes','🏠','Imóveis',hm?'casa própria':'morar/alugar'))+
  (s.debt+(s.arrears||0)>.5?qa('debts','🧾','Dívidas',fmt(s.debt+(s.arrears||0)),'gold'):qa('sub_life','🥂','Padrão',LS[s.life].n))+'</div>';
 h+=segBar('sub',homeSub,[['resumo','Resumo'],['gastos','Gastos'],['bens','Bens'],['diario','Diário']]);
 if(homeSub==='gastos'){
  var f=monthFlow();
  h+='<div class="card"><div class="flow"><div><span>Entra</span><b class="up">'+fmt(f.inc)+'</b></div><div><span>Sai</span><b class="dn">'+fmt(f.out)+'</b></div><div><span>Sobra</span><b>'+fmt(f.inc-f.out)+'</b></div></div>'+
   kvr('Comida, transporte e contas',fmt(livingNow()-housing()*(s.shared?.8:1)))+(housing()?kvr('Aluguel: '+RENTS[s.rent.t].n,fmt(housing()*(s.shared?.8:1))):'')+(kidsMonthly()?kvr('Filhos',fmt(kidsMonthly())):'');
  s.recur.forEach(function(r,i){h+='<div class="kv"><span>'+r.n+' <button class="chip" style="padding:2px 9px;font-size:12px" data-act="cancelrec" data-i="'+i+'">cancelar</button></span><b>'+fmt(r.amt)+'</b></div>';});
  s.inst.forEach(function(x){h+=kvr('Parcela: '+x.name+' <span class="muted sm">(faltam '+x.left+')</span>',fmt(x.amt));});
  if(s.study)h+=kvr('Curso: '+COURSE[s.study.id].n,fmt(s.study.per));
  s.items.forEach(function(it){var I=ITEM[it.id];if(I.m)h+=kvr('Custos: '+I.n,fmt(I.m*s.infl));});
  if(s.pet)h+=kvr('Cuidados com o pet',fmt(150*s.infl));
  if(s.shared)h+='<p class="muted sm">Vocês dividem a casa: os gastos de moradia já estão 20% menores.</p>';
  s.props.forEach(function(p){if(p.loan)h+=kvr('Financiamento: '+p.n,fmt(curPay(p.loan)));if(p.cons&&p.cons.left>0)h+=kvr('Consórcio: '+p.n,fmt(p.cons.P));if(p.owned)h+=kvr('Condomínio e IPTU: '+p.n,fmt(p.V*.0008));if(p.owned&&p.use==='alugar'&&!p.vac)h+=kvr('Aluguel recebido: '+p.n,'+'+fmt(rentOf(p)),'up');});
  h+='</div>';
 }else if(homeSub==='bens'){
  h+='<div class="card">'+kvr('Moradia',homeLabel())+'<button class="btn center sm" style="width:100%;margin:6px 0" data-act="move">'+(s.home==='pais'?'🚪 Sair de casa':s.home==='aluguel'?'🔁 Mudar de casa':'🔁 Moradia')+'</button>'+kvr('Humor tende a',Math.round(happyTarget())+'%'+(comfort()?' (conforto +'+comfort()+')':''))+
   (s.items.length?'<div class="goods">'+s.items.map(function(i){var I=ITEM[i.id];return '<span>'+I.e+' '+I.n+'</span>';}).join('')+'</div>':'<p class="muted sm">Nenhum bem ainda. Bens sobem o humor, mas quebram e custam.</p>')+
   s.props.map(function(p,i){var st=!p.owned?'Consórcio · aguardando':p.loan?'Financiado · faltam '+p.loan.left+' meses':p.cons?'Consórcio · contemplado':'Quitado';
    return '<button class="prow" data-act="prop" data-i="'+i+'"><span><b>'+HOMES[p.h].e+' '+p.n+'</b><small>'+(p.use==='morar'?'Morar':'Alugar')+' · '+st+'</small></span><b>'+(p.owned?fmtK(p.V):'')+'</b></button>';}).join('')+'</div>';
 }else if(homeSub==='diario'){
  h+='<div class="card log">'+s.log.slice(0,12).map(function(l){return '<p><small>Mês '+(l.m+1)+'</small><br>'+l.t+'</p>';}).join('')+'</div>';
 }else{
  h+='<div class="card">'+kvr('Emprego',s.job?s.job.t:'Desempregado')+
   (s.job?kvr('Salário líquido',fmt(s.job.salary)+(s.job.v?' (varia)':'')):'')+
   (s.allowance>0&&s.month<s.allowMonths?kvr('Mesada',fmt(s.allowance)+' · '+(s.allowMonths-s.month)+' meses'):'')+
   kvr('Vida pessoal',relLabel())+
   kvr('Formação',eduLabel()+(s.study?' · estudando':''))+(s.neg?kvr('Seu nome','🔴 negativado','dn'):'')+
   '<div class="lbl" style="margin-top:10px"><span>Padrão de vida</span><span class="muted sm">mais conforto, milhão mais longe</span></div><div class="chips">'+LS.map(function(l,i){return '<button class="chip '+(s.life===i?'on':'')+'" data-act="life" data-i="'+i+'">'+l.e+' '+l.n+'</button>';}).join('')+'</div>'+
   '<div class="lbl" style="margin-top:12px"><span>Patrimônio</span><b>'+fmt(netWorth())+'</b></div>'+nwChart()+'</div>';
 }
 return h;
}
function viewInvest(){
 var s=S;
 if(!s.phone)return '<div class="card lock"><div class="big">🔒</div><h3>Você ainda não tem celular</h3><p class="muted">As corretoras funcionam pelo aplicativo. Compre um celular na aba Vida para liberar os investimentos.</p><div class="stack"><button class="btn gold center" data-act="buyphone">Comprar celular</button></div></div>';
 var h='<div class="mini"><span>💵 '+fmt(s.cash)+'</span><span>Selic '+(s.selic*100).toFixed(2).replace('.',',')+'%</span><span>Inflação '+(s.inflRate*100).toFixed(1).replace('.',',')+'%</span></div>';
 var tot=pv(),cost=0;for(var id in s.port)cost+=s.port[id].cost;
 if(s.everInvested)h+='<button class="diff cta" style="margin-bottom:12px" data-act="bolsa_game"><div class="e">📡</div><div><b>Pronto para o mundo real?</b><span>Teste suas ideias com ações reais da B3 no simulador de carteira.</span></div></button>';
 if(tot>0){var pl=(tot/cost-1)*100;h+='<div class="card" style="padding:10px 14px">'+kvr('Sua carteira',fmt(tot)+' <span class="'+(pl>=0?'up':'dn')+'">('+(pl>=0?'+':'')+pl.toFixed(1).replace('.',',')+'%)</span>')+'</div>';}
 h+='<p class="muted sm" style="margin:0 4px 8px">Toque num ativo para ver detalhes, comprar ou vender.</p>';
 ASSETS.forEach(function(a){
  var hd=s.port[a.id],val=hv(a.id),pl=hd?(val/hd.cost-1)*100:0,r=s.last[a.id];
  h+='<button class="arow'+(hd?' held':'')+'" data-act="asset" data-id="'+a.id+'"><div class="an"><b>'+AINFO[a.id].e+' '+a.n+'</b><small>'+(hd?'Você tem '+fmt(val)+' <span class="'+(pl>=0?'up':'dn')+'">('+(pl>=0?'+':'')+pl.toFixed(1).replace('.',',')+'%)</span>':a.tipo+' · risco '+a.risk+'/5')+'</small></div>'+
   spark(s.hist[a.id])+'<div class="ap"><b>'+fmt2(s.prices[a.id])+'</b><span class="'+(r>=0?'up':'dn')+'">'+pct(r)+'</span></div></button>';
 });
 return h;
}
function viewNews(){
 var s=S;
 if(!s.phone)return '<div class="card lock"><div class="big">📰</div><h3>Sem celular, sem notícias</h3><p class="muted">Compre um celular para acompanhar o mercado.</p></div>';
 var h='';
 if(s.news){
  h+='<div class="card"><div class="lbl" style="margin:0 0 4px"><h3>Manchetes de hoje</h3></div><p class="muted sm">Podem antecipar o próximo mês, mas nem tudo se confirma.</p>';
  s.nextNews.forEach(function(n,i){var S2=SECT[n.sector];h+='<button class="prow" data-act="newsdeep" data-i="'+i+'"><span><b>'+S2.e+' '+n.text+'</b><small class="'+(n.dir>0?'up':'dn')+'">'+(n.dir>0?'📈 Pode subir: ':'📉 Pode cair: ')+newsTarget(n)+'</small></span><span aria-hidden="true">🔍</span></button>';});
  h+='</div>';
 }else{
  h+='<div class="card"><h3>Jornal financeiro</h3><p>Quem assina lê as manchetes antes do mercado se mexer, com a explicação de como cada notícia afeta a bolsa. Custa R$ 29,90 por mês.</p><p class="muted sm">Sem assinatura, você só descobre o que aconteceu depois que os preços já mudaram.</p><div class="stack"><button class="btn primary center" data-act="news">Assinar por R$ 29,90 / mês</button></div></div>';
 }
 h+='<div class="card"><h3>O que aconteceu no mês passado</h3>';
 if(!s.whatHappened.length)h+='<p class="muted">Ainda nada. Avance um mês.</p>';
 s.whatHappened.forEach(function(t){h+='<p style="font-size:15px">'+t+'</p>';});
 return h+'</div>';
}
function viewLearn(){
 var ids=Object.keys(LESSONS),h='<div class="card" style="padding:12px 14px"><div class="lbl" style="margin:0 0 8px"><span>Lições desbloqueadas</span><b>'+S.lessons.length+' de '+ids.length+'</b></div><div class="bar dark"><i style="width:'+(S.lessons.length/ids.length*100)+'%"></i></div></div>';
 h+=segBar('lsub',learnSub,[['licoes','Lições'],['guias','Guias']]);
 if(learnSub==='guias'){
  h+='<div class="card">'+ASSETS.map(function(a){return '<button class="prow" data-act="ainfo" data-id="'+a.id+'"><span><b>'+AINFO[a.id].e+' '+a.n+'</b><small>'+a.tipo+' · risco '+a.risk+' de 5</small></span><span class="qm" aria-hidden="true" style="display:inline-grid;place-items:center">?</span></button>';}).join('')+
   '<button class="prow" data-act="contracts"><span><b>📑 Como comprar um imóvel</b><small>À vista, financiamento, consórcio, SAC e Price</small></span><span class="qm" aria-hidden="true" style="display:inline-grid;place-items:center">?</span></button></div>';
 }else{
  h+='<div class="ltiles">'+ids.map(function(id){var L=LESSONS[id],ok=S.lessons.indexOf(id)>=0;
   return '<button class="ltile'+(ok?'':' locked')+'" data-act="lessonv" data-id="'+id+'"><span class="e">'+(ok?L.e:'🔒')+'</span><span>'+(ok?L.t:'Bloqueada')+'</span></button>';}).join('')+'</div>';
 }
 return h;
}
function render(){
 if(!S){
  $app.innerHTML=startView==='hist'?histScreen():startView==='bolsa'?bolsaScreen():startView==='rank'?rankStandalone():startView==='real'?realScreen():startView==='intro'?introScreen():startView==='mode'?modeScreen():startView==='nick'?nickScreen():startScreen();
  if(startView==='intro'){var tr=document.getElementById('obt');if(tr&&tr.addEventListener)tr.addEventListener('scroll',obSync,{passive:true});}
  if(startView==='nick'){var ni=document.getElementById('nick0');if(ni&&ni.addEventListener)ni.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();obStart();}});}
  return;
 }
 checkMissions();
 var v=tab==='invest'?viewInvest():tab==='news'?viewNews():tab==='learn'?viewLearn():tab==='rank'?rankBody():viewHome();
 var busy=S.over;
 var tabs=[['home','🏠','Vida'],['invest','📈','Investir'],['news','📰','Notícias'],['learn','💡','Aprender'],['rank','🏆','Ranking']];
 $app.innerHTML=header()+'<main>'+v+'</main><footer class="bar-bottom">'+
  '<div class="advance"><button class="btn primary center" '+(busy?'disabled':'')+' data-act="go" data-n="1">Próximo mês ▶</button><button class="btn center" '+(busy?'disabled':'')+' data-act="go" data-n="3">+3 meses</button><button class="btn center" '+(busy?'disabled':'')+' data-act="go" data-n="12">+1 ano</button></div>'+
  '<nav class="tabs">'+tabs.map(function(t){return '<button class="tab '+(tab===t[0]?'on':'')+'" data-act="tab" data-t="'+t[0]+'"><span>'+t[1]+'</span>'+t[2]+'</button>';}).join('')+'</nav></footer>';
 save();
}
function refresh(){render();flush();}
var tt=null;
function toast(t){$toast.textContent=t;$toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){$toast.classList.remove('show');},2600);}

document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 act(el.getAttribute('data-act'),el.dataset,$ov.contains(el));
});

/* botão voltar do Android (app) */
window.__vgBack=function(){
 if(cur&&cur.type==='bills'){S.auto=0;closeModal();return 'ok';}
 var closable=['htrade','hexpl','hend','hnews','hap','hmenu','btrade','bmenu','move','course','debts','reneg','ainfo','contracts','shop','homes','house','prop','amort','asset','lessonv','trade','phone','study','menu','newsbrief','newsdeep','lesson','info','story'];
 if(cur){
  if(cur.type==='submit'){if(!cur.busy)closeSubmit();return 'ok';}
  if(closable.indexOf(cur.type)>=0){if(cur.prev){cur=cur.prev;drawModal();}else closeModal();}
  return 'ok';
 }
 if(!S){if(startView!=='home'){startView='home';render();window.scrollTo(0,0);return 'ok';}return 'exit';}
 if(tab!=='home'){tab='home';refresh();window.scrollTo(0,0);return 'ok';}
 return 'exit';
};
function fitScreen(){try{var touch=IS_APP||(window.matchMedia&&matchMedia('(pointer: coarse)').matches),w=window.innerWidth||0,z=touch&&w>=680?Math.min(1.8,w/540):1;document.documentElement.style.zoom=z>1.01?z.toFixed(3):'';}catch(e){}}
fitScreen();try{window.addEventListener('resize',fitScreen);}catch(e){}
try{if(!localStorage.getItem(INTRO)){var sv0=load();if(!sv0||sv0.over)startView='intro';}}catch(e){}
try{document.addEventListener('change',function(e){var t=e.target;if(t&&(t.id==='hy'||t.id==='hm')){hKeep();HS.y=+document.getElementById('hy').value;HS.m=+document.getElementById('hm').value;render();}});}catch(e){}
render();
if(typeof window!=='undefined'&&window.__TEST__){window.__TEST__={cur:function(){return cur;},newGame:newGame,tick:tick,S:function(){return S;},modalQ:function(){return modalQ;},act:act,pv:pv,goal:goal,render:render};}
})();
