<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vida &amp; Grana · jogo de finanças</title>
<meta name="description" content="Viva uma vida inteira e aprenda a investir na prática. Jogo educativo de finanças com Tesouro, ações, fundos imobiliários, simulador de carteira com a bolsa de verdade e viagem no tempo com preços históricos da B3.">
<link rel="icon" href="img/icone.png">
<meta property="og:title" content="Vida &amp; Grana">
<meta property="og:description" content="Viva uma vida inteira e aprenda a investir na prática.">
<meta property="og:image" content="img/capa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* BASE: cores (modo claro e escuro), reset e tipografia */

:root {
  --bg: #f2f4fa;
  --surface: #ffffff;
  --surface2: #e9ecf8;
  --ink: #14193a;
  --muted: #5d6485;
  --line: #dde1f0;
  --brand: #2a3fd6;
  --brand-ink: #ffffff;
  --brand-soft: #e3e7ff;
  --gold: #f5b800;
  --gold-ink: #3b2b00;
  --gold-soft: #fff1c2;
  --good: #0f8a5f;
  --bad: #d33b3b;
  --warn-soft: #ffe3e0;
  --shadow: 0 10px 30px rgba(20, 25, 58, 0.14);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0d1024;
    --surface: #171b3a;
    --surface2: #1f2448;
    --ink: #eceffd;
    --muted: #9aa2cf;
    --line: #2b3160;
    --brand: #7d8cff;
    --brand-ink: #0d1024;
    --brand-soft: #232a5c;
    --gold: #ffcc33;
    --gold-ink: #2c2100;
    --gold-soft: #3a3010;
    --good: #46d39a;
    --bad: #ff7a7a;
    --warn-soft: #3b1d27;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0d1024;
  --surface: #171b3a;
  --surface2: #1f2448;
  --ink: #eceffd;
  --muted: #9aa2cf;
  --line: #2b3160;
  --brand: #7d8cff;
  --brand-ink: #0d1024;
  --brand-soft: #232a5c;
  --gold: #ffcc33;
  --gold-ink: #2c2100;
  --gold-soft: #3a3010;
  --good: #46d39a;
  --bad: #ff7a7a;
  --warn-soft: #3b1d27;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family:
    'Nunito',
    system-ui,
    -apple-system,
    'Segoe UI',
    Roboto,
    sans-serif;
  font-size: 16px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
  overflow-wrap: break-word;
  word-break: break-word;
}
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--brand);
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:focus-visible,
input:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}
.app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
}
.muted {
  color: var(--muted);
}
.sm {
  font-size: 13px;
}
.up {
  color: var(--good);
}
.dn {
  color: var(--bad);
}
h1,
h2,
h3 {
  margin: 0;
  line-height: 1.1;
  letter-spacing: -0.02em;
}
/* TOPO: cabeçalho fixo com idade, caixa e barra da meta */

/* topo */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--brand);
  color: var(--brand-ink);
  padding: 10px 16px 12px;
  border-radius: 0 0 24px 24px;
  box-shadow: var(--shadow);
}
.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
}
.top .muted {
  color: inherit;
  opacity: 0.75;
}
.icon {
  background: rgba(255, 255, 255, 0.18);
  border: 0;
  border-radius: 12px;
  width: 36px;
  height: 32px;
  font-size: 18px;
  color: inherit;
  line-height: 1;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin: 10px 0 10px;
}
.stat {
  background: rgba(255, 255, 255, 0.14);
  border-radius: 14px;
  padding: 7px 10px;
  min-width: 0;
}
.stat span {
  display: block;
  font-size: 12px;
  opacity: 0.85;
  white-space: nowrap;
}
.stat b {
  font-size: 16px;
  white-space: nowrap;
}
.stat.bad {
  background: #ffe3e0;
  color: #8a1d1d;
}
.goal small {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  opacity: 0.9;
}
.bar {
  height: 10px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.25);
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--gold);
  border-radius: 99px;
  transition: width 0.5s;
}
.bar.dark {
  background: var(--surface2);
}
.bar.dark i {
  background: var(--brand);
}
/* CONTEÚDO: cartões, missão, botões, chips e lista de gastos */

/* conteúdo */
main {
  padding: 16px 14px 170px;
}
.card {
  background: var(--surface);
  border-radius: 20px;
  padding: 14px 16px;
  margin-bottom: 12px;
  border: 1px solid var(--line);
}
.card h3 {
  font-size: 18px;
  margin-bottom: 6px;
}
.card p {
  margin: 4px 0;
}
.mission {
  background: var(--gold-soft);
  border-color: transparent;
  position: relative;
}
.mission .tag {
  font-size: 12px;
  font-weight: 600;
  color: var(--gold-ink);
  opacity: 0.75;
}
.mission h3 {
  color: var(--gold-ink);
  font-size: 21px;
  margin: 2px 0 4px;
}
.mission p {
  color: var(--gold-ink);
}
:root[data-theme='dark'] .mission h3,
:root[data-theme='dark'] .mission p,
:root[data-theme='dark'] .mission .tag {
  color: var(--gold);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .mission h3,
  :root:not([data-theme='light']) .mission p,
  :root:not([data-theme='light']) .mission .tag {
    color: var(--gold);
  }
}
.steps {
  display: flex;
  gap: 5px;
  margin-top: 10px;
}
.steps i {
  flex: 1;
  height: 6px;
  border-radius: 9px;
  background: rgba(0, 0, 0, 0.12);
}
.steps i.on {
  background: var(--gold-ink);
}
:root[data-theme='dark'] .steps i.on {
  background: var(--gold);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .steps i.on {
    background: var(--gold);
  }
}
.tip {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--brand-soft);
  border-radius: 18px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.tip .av {
  font-size: 26px;
  line-height: 1;
}
.tip p {
  margin: 0;
  font-size: 15px;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 14px;
  padding: 11px 12px;
  font-weight: 600;
  font-size: 15px;
  text-align: left;
  line-height: 1.2;
}
.btn.primary {
  background: var(--brand);
  color: var(--brand-ink);
  border-color: transparent;
}
.btn.gold {
  background: var(--gold);
  color: var(--gold-ink);
  border-color: transparent;
}
.btn.sm {
  padding: 8px 12px;
  font-size: 14px;
}
.btn.center {
  text-align: center;
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.btn small {
  display: block;
  font-weight: 400;
  opacity: 0.8;
  font-size: 12px;
  margin-top: 2px;
}
.btn.on {
  outline: 2px solid var(--brand);
  background: var(--brand-soft);
}
.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 99px;
  padding: 7px 12px;
  font-size: 14px;
  font-weight: 600;
}
.chip.on {
  background: var(--brand);
  color: var(--brand-ink);
  border-color: transparent;
}
.kv {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 15px;
}
.kv:last-child {
  border: 0;
}
.kv b {
  white-space: nowrap;
}
.log p {
  font-size: 14px;
  margin: 6px 0;
  padding-left: 10px;
  border-left: 3px solid var(--line);
}
.log p small {
  color: var(--muted);
}
.h-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 18px 4px 8px;
}
.h-row h2 {
  font-size: 20px;
}
/* INVESTIR: cartões de ativos e minigráficos */

/* investir */
.asset {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.a-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.a-top b {
  font-size: 17px;
}
.a-right {
  text-align: right;
}
.chg {
  display: block;
  font-size: 14px;
  font-weight: 600;
}
.a-mid {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 6px 0;
}
.risk {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--brand);
}
.spark {
  width: 84px;
  height: 28px;
}
.hold {
  background: var(--surface2);
  border-radius: 12px;
  padding: 7px 10px;
  margin: 8px 0;
  font-size: 14px;
}
.a-btns {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.a-btns .btn {
  flex: 1;
  text-align: center;
}
.lock {
  text-align: center;
  padding: 30px 20px;
}
.lock .big {
  font-size: 44px;
}
.news-item {
  display: flex;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.news-item:last-child {
  border: 0;
}
.news-item .e {
  font-size: 22px;
}
.news-item b {
  font-size: 15px;
  line-height: 1.25;
  display: block;
}
.lesson {
  display: flex;
  gap: 12px;
}
.lesson .e {
  font-size: 28px;
}
.lesson.locked {
  opacity: 0.55;
}
/* RODAPÉ: barra fixa de avançar mês e abas */

/* rodapé fixo */
.bar-bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 6;
  max-width: 520px;
  margin: 0 auto;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 8px 10px calc(6px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 24px rgba(20, 25, 58, 0.1);
}
.energia-bar {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 6px;
  padding: 0 2px;
}
.ep {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: var(--line);
  transition: background 0.2s;
}
.ep.on {
  background: var(--brand);
}
.ep-b {
  font-size: 11px;
  font-weight: 700;
  color: var(--brand);
  margin-left: 2px;
}
.advance {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
  gap: 8px;
}
.advance .btn {
  text-align: center;
  padding: 12px 8px;
}
.tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  margin-top: 8px;
}
.tab {
  background: none;
  border: 0;
  padding: 6px 0 2px;
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}
.tab span {
  display: block;
  font-size: 20px;
}
.tab.on {
  color: var(--brand);
}
/* JANELAS: bottom sheet, campos e avisos (toast) */

/* modal */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(10, 12, 35, 0.55);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
#overlay[hidden] {
  display: none;
}
.sheet {
  background: var(--surface);
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow: auto;
  border-radius: 26px 26px 0 0;
  padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  animation: up 0.22s ease-out;
}
@keyframes up {
  from {
    transform: translateY(40px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .sheet {
    animation: none;
  }
  .bar i {
    transition: none;
  }
}
.sheet h2 {
  font-size: 24px;
  margin-bottom: 8px;
}
.sheet .em {
  font-size: 40px;
  line-height: 1;
  margin-bottom: 6px;
}
.sheet p {
  margin: 8px 0;
}
.stack {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}
.warn {
  background: var(--warn-soft);
  border-radius: 12px;
  padding: 8px 10px;
  font-size: 13px;
  margin-top: 6px;
  color: var(--ink);
}
.input {
  width: 100%;
  font: inherit;
  font-size: 22px;
  font-weight: 600;
  padding: 12px 14px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--bg);
  color: var(--ink);
}
.preview {
  font-size: 14px;
  color: var(--muted);
  margin: 8px 0;
  min-height: 42px;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(150px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 14px;
  font-size: 14px;
  z-index: 30;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s;
  max-width: 90vw;
  text-align: center;
}
#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
/* INÍCIO E COMPLEMENTOS: tela inicial e componentes das outras telas */

/* início */
.hero {
  background: var(--brand);
  color: var(--brand-ink);
  padding: 34px 20px 40px;
  border-radius: 0 0 34px 34px;
}
.hero h1 {
  font-size: 54px;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 0.95;
}
.hero h1 em {
  font-style: normal;
  color: var(--gold);
}
.hero p {
  margin: 14px 0 0;
  font-size: 17px;
  opacity: 0.92;
  max-width: 30ch;
}
.diffs {
  padding: 18px 14px 30px;
  display: grid;
  gap: 10px;
}
.diff {
  display: flex;
  gap: 14px;
  align-items: center;
  text-align: left;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 14px 16px;
}
.diff .e {
  font-size: 34px;
}
.diff b {
  font-size: 19px;
  display: block;
}
.diff span {
  font-size: 14px;
  color: var(--muted);
}
.diff.hard {
  background: var(--ink);
  color: var(--bg);
  border-color: transparent;
}
.diff.hard span {
  color: var(--bg);
  opacity: 0.75;
}
.small-print {
  font-size: 12px;
  color: var(--muted);
  padding: 0 20px 30px;
  text-align: center;
}
.rk-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.rk-row:last-child {
  border: 0;
}
.rk-row.me {
  background: var(--brand-soft);
  border-radius: 14px;
  padding: 10px 8px;
  border-bottom-color: transparent;
}
.rk-pos {
  width: 38px;
  text-align: center;
  font-weight: 800;
  font-size: 17px;
  flex: none;
}
.rk-name {
  flex: 1;
  min-width: 0;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rk-time {
  text-align: right;
  font-weight: 800;
  flex: none;
}
.rk-time small {
  display: block;
  font-weight: 400;
  color: var(--muted);
  font-size: 12px;
}
.err {
  background: var(--warn-soft);
  border-radius: 12px;
  padding: 8px 10px;
  font-size: 14px;
  margin-top: 8px;
}
.qm {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--brand);
  background: transparent;
  color: var(--brand);
  font-weight: 800;
  font-size: 14px;
  line-height: 1;
  padding: 0;
  vertical-align: middle;
  margin-left: 6px;
  flex: none;
}
.sec {
  font-size: 16px;
  margin: 16px 0 2px;
}
.ex {
  background: var(--surface2);
  border-left: 4px solid var(--gold);
  border-radius: 12px;
  padding: 10px 12px;
  margin-top: 12px;
}
.ex p {
  margin: 4px 0 0;
}
.lbl {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  font-weight: 600;
  margin: 14px 0 6px;
}
input[type='range'] {
  width: 100%;
  accent-color: var(--brand);
  height: 28px;
}
.prow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: var(--surface2);
  border: 0;
  border-radius: 14px;
  padding: 10px 12px;
  margin-top: 8px;
}
.prow small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}
.field label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin: 12px 0 4px;
}
.field .input {
  font-size: 18px;
  padding: 10px 12px;
}
.field .hint {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
}
.goods {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 6px 0 2px;
}
.goods span {
  background: var(--surface2);
  border-radius: 99px;
  padding: 4px 10px;
  font-size: 13px;
}
.sheet.noanim {
  animation: none;
}
.ob {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  background: var(--brand);
  color: var(--brand-ink);
  padding: 8px 0 16px;
}
.ob-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 12px 4px 20px;
  font-size: 15px;
}
.ob-skip {
  background: none;
  border: 0;
  color: inherit;
  opacity: 0.8;
  font-weight: 600;
  padding: 10px 8px;
}
.ob-track {
  flex: 1;
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}
.ob-track::-webkit-scrollbar {
  display: none;
}
.ob-slide {
  flex: 0 0 100%;
  scroll-snap-align: center;
  scroll-snap-stop: always;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 16px 28px;
}
.ob-art {
  width: 120px;
  height: 120px;
  border-radius: 38px;
  background: rgba(255, 255, 255, 0.15);
  display: grid;
  place-items: center;
  font-size: 60px;
  margin-bottom: 28px;

/* ==========================================================================
 * 05 · PARTIDA E SAVE
 * --------------------------------------------------------------------------
 * newGame cria o estado S de uma partida nova a partir da dificuldade escolhida.
 * save/load gravam e leem S no localStorage do aparelho (chave SAVE).
 * S é um objeto simples com a partida inteira: month, cash, debt, job, port (carteira),
 * prices e hist (preços), kids, props (imóveis), items, stats, lessons, log...
 * ========================================================================== */

/* ---------- estado ---------- */
function newGame(key, R) {
  var D = key === 'r' ? realD(R) : DIFFS[key];
  S = {
    v: 1,
    key: key,
    month: 0,
    cash: D.cash,
    debt: 0,
    inst: [],
    job: null,
    everJob: false,
    searching: false,
    skill: D.skill,
    edu: eduFrom(D.skill, D.track || 'neg'),
    home: 'pais',
    rent: null,
    atHomeM: 0,
    pressN: 0,
    kids: [],
    arrears: 0,
    debtOrig: 0,
    debtChg: 0,
    study: null,
    phone: D.phone ? { id: 'b' } : null,
    news: false,
    happy: 70,
    life: 1,
    infl: 1,
    inflRate: 0.045,
    living: D.living,
    allowance: D.allowance,
    allowMonths: D.allowMonths,
    evMult: D.evMult,
    evProb: D.evProb,
    jobChance: D.jobChance,
    port: {},
    prices: {},
    hist: {},
    last: {},
    regime: 1,
    selic: 0.105,
    recur: [],
    nw: [],
    lessons: [],
    log: [],
    promoBonus: 0,
    everInvested: false,
    done: {},
    stats: { interest: 0, div: 0, taxes: 0, scam: 0, short: 0, finInt: 0, crisis: 0 },
    items: [],
    props: [],
    startAge: START_AGE,
    won: false,
    wonAge: null,
    wonMonth: null,
    submitted: false,
    over: false,
    auto: 0,
    nextNews: [],
    lastEv: '',
    lastMonth: { inc: 0, out: 0 },
    whatHappened: [],
  };
  ASSETS.forEach(function (a) {
    S.prices[a.id] = a.p0;
    S.hist[a.id] = [a.p0];
    S.last[a.id] = 0;
  });
  if (key === 'r') {
    S.startAge = R.age;
    S.happy = 60;
    S.edu = eduFrom(R.skill, R.track || 'neg');
    if (R.mora === 'aluguel') {
      S.home = 'aluguel';
      S.rent = { t: 1, amt: Math.round(R.gastos * 0.35) };
    } else {
      S.living = R.gastos / 0.533;
    }
    if (R.renda > 0) {
      S.job = { t: 'Seu trabalho atual', salary: R.renda, v: 0, months: 12 };
      S.everJob = true;
    }
    if (R.cartao > 0) {
      S.debt = R.cartao;
      S.debtOrig = R.cartao;
      S.lessons.push('juros_cartao');
    }
    if (R.parc > 0 && R.meses > 0)
      S.inst.push({
        name: 'Financiamento ou empréstimo atual',
        amt: R.parc,
        left: R.meses,
        total: R.parc * R.meses,
      });
  }
  genNews();
  S.nw.push(netWorth());
  addLog('Começou a jornada: ' + D.n + '.');
}
function save() {
  try {
    if (S && !S.over) localStorage.setItem(SAVE, JSON.stringify(S));
    else if (S && S.over) {
      cloudSave(S);
      localStorage.removeItem(SAVE);
    }
  } catch (e) {}
}
function load() {
  try {
    var r = localStorage.getItem(SAVE);
    return r ? JSON.parse(r) : null;
  } catch (e) {
    return null;
  }
}
/* ==========================================================================
 * 06 · CÁLCULOS E PATRIMÔNIO
 * --------------------------------------------------------------------------
 * Funções curtas sobre o estado S. Umas só leem e calculam (netWorth, pv, hv, age,
 * livingNow, monthlyExp, goal, houseQuote, amortCalc); outras alteram S (spend, addInst,
 * addItem, buyItem, unlock, addLog).
 * spend(a) é a regra central do dinheiro: tira do caixa e, se faltar, o resto vira dívida
 * do cartão (rotativo).
 * ========================================================================== */

/* ---------- cálculos ---------- */
function hv(id) {
  var h = S.port[id];
  return h ? h.q * S.prices[id] : 0;
}
function pv() {
  var t = 0;
  for (var id in S.port) t += hv(id);
  return t;
}
function age() {
  return (S.startAge || START_AGE) + Math.floor(S.month / 12);
}
function housing() {
  return S.home === 'aluguel' && S.rent ? S.rent.amt : 0;
}
function livingNow() {
  var b = S.living * S.infl * LS[S.life].m * 0.65;
  if (S.home === 'pais') b *= 0.82;
  return (b + housing()) * (S.shared ? 0.8 : 1);
}
function monthlyExp() {
  var t = livingNow() + itemsMonthly() + kidsMonthly();
  S.recur.forEach(function (r) {
    t += r.amt;
  });
  S.props.forEach(function (p) {
    if (p.owned) t += p.V * 0.0008;
  });
  return t;
}
function goal() {
  return GOAL;
}
function safe() {
  return S.cash + hv('poup') + hv('selic') - S.debt;
}
function distinct() {
  return Object.keys(S.port).length;
}
function netWorth() {
  var t = S.cash - S.debt;
  for (var id in S.port) {
    var h = S.port[id],
      v = hv(id),
      g = v - h.cost;
    t += v - (ASSET[id].tf ? 0 : Math.max(0, g) * 0.15);
  }
  (S.props || []).forEach(function (p) {
    if (p.owned) t += p.V;
    if (p.loan) t -= p.loan.bal;
    if (p.cons) {
      var f = 1 / (1 + p.cons.a);
      t += p.owned ? -p.cons.left * p.cons.P * f : p.cons.paid * f;
    }
  });
  return t;
}
function addLog(t) {
  S.log.unshift({ m: S.month, t: t });
  if (S.log.length > 60) S.log.length = 60;
}
function unlock(id) {
  if (S.lessons.indexOf(id) >= 0) return;
  S.lessons.push(id);
  modalQ.push({ type: 'lesson', id: id });
}
function spend(a) {
  if (a <= 0) return;
  if (S.cash >= a) {
    S.cash -= a;
  } else {
    var sh = a - S.cash;
    S.cash = 0;
    S.debt += sh;
    S.debtOrig = (S.debtOrig || 0) + sh;
    S.stats.short++;
    unlock('juros_cartao');
    unlock('reserva');
  }
}
function addInst(name, price, n, r) {
  var p = pmt(price, n, r);
  S.inst.push({ name: name, amt: p, left: n, total: p * n });
  unlock('parcelado');
}
function hasItem(id) {
  return (S.items || []).some(function (i) {
    return i.id === id;
  });
}
function getItem(id) {
  return (S.items || []).filter(function (i) {
    return i.id === id;
  })[0];
}
function addItem(id) {
  if (hasItem(id)) return;
  var I = ITEM[id];

/* ==========================================================================
 * 08 · VIRADA DO MÊS (o coração do jogo)
 * --------------------------------------------------------------------------
 * tick()     avança a vida em UM mês: renda, gastos, dívidas, humor, mercado, eventos.
 * market()   move os preços e aplica as notícias do mês.
 * yearTurn() a cada 12 meses: inflação, reajuste do salário, promoção.
 * offerJobs() e drawEvent() sorteiam propostas de emprego e eventos.
 * genNews()  sorteia as manchetes do mês seguinte.
 *
 * Comece lendo tick(): é o melhor mapa de como o jogo funciona.
 * ========================================================================== */

function genNews() {
  var keys = Object.keys(SECT),
    chosen = [],
    n = 2 + (chance(0.4) ? 1 : 0);
  while (chosen.length < n) {
    var k = pick(keys);
    if (chosen.indexOf(k) < 0) chosen.push(k);
  }
  S.nextNews = chosen.map(function (k) {
    var dir = chance(0.5) ? 1 : -1,
      m = SECT[k].mag;
    return {
      sector: k,
      dir: dir,
      mag: rnd(m[0], m[1]),
      real: chance(0.75),
      text: pick(HEAD[k][dir > 0 ? 'up' : 'dn']),
    };
  });
}

/* ---------- virada do mês ---------- */
/**
 * Avança a vida em UM mês. É a função mais importante do jogo. A ordem importa:
 *   1. entra o dinheiro (salário, 13º em dezembro, mesada, imóveis);
 *   2. saem as contas (moradia, vida, filhos, assinaturas, parcelas, curso);
 *   3. o caixa é ajustado e o que faltar vira dívida do cartão (spend);
 *   4. paga-se o cartão, cobram-se juros, atualiza-se o nome sujo e o humor;
 *   5. o mercado se mexe (market) e o relógio avança (month++);
 *   6. virada de ano, propostas de emprego, eventos, vitória e fim de jogo.
 * `inc` = tudo que entrou neste mês; `out` = tudo que saiu.
 */
function tick() {
  var s = S,
    cm = s.month % 12,
    inc = 0,
    out = 0,
    i;
  // zera o resumo do mês (aparece na aba Notícias)
  s.whatHappened = [];
  // humor no zero: crise de motivação (largar emprego ou curso, torrar investimentos, fazer compras)
  if (s.happy <= 0.5) crisis();
  // 1) ENTRADAS. Renda variável (v) sorteia ±v% todo mês; em dezembro (cm === 11) entra também o 13º
  if (s.job) {
    var p = s.job.salary;
    if (s.job.v) p *= 1 + rnd(-s.job.v, s.job.v);
    inc += p;
    s.job.months++;
    if (cm === 11) {
      inc += s.job.salary;
      unlock('decimo');
      addLog('🎁 O 13º salário caiu na conta.');
    }
  }
  // mesada dos pais, enquanto durar
  if (s.month < s.allowMonths) inc += s.allowance;
  if (s.allowance > 0 && s.month === s.allowMonths - 6)
    addLog('⚠️ Faltam 6 meses para a mesada acabar.');
  if (s.allowance > 0 && s.month === s.allowMonths) {
    unlock('mesada');
    addLog('⚠️ A mesada acabou. Agora a renda é sua.');
  }
  // escolhas da tela "Contas do mês" (s.plan): o que o jogador NÃO vai pagar e como pagar o cartão.
  // Sem escolha (avanço automático), paga tudo e só quita o cartão se o pagamento automático estiver ligado
  var P = s.plan || { skip: {}, card: s.autopay ? 'total' : 'none' },
    sk = P.skip || {};
  s.plan = null;
  // 2) SAÍDAS. A moradia (rp) é separada do custo de vida porque o jogador pode deixar de pagá-la; morar junto corta 20%
  var rp = housing() * (s.shared ? 0.8 : 1);
  out += livingNow() - rp + kidsMonthly();
  // aluguel não pago vira atraso com multa de 10%; no 3º mês seguido, despejo
  if (rp > 0) {
    if (sk.rent) {
      s.arrears = (s.arrears || 0) + rp * 1.1;
      s.rentLate = (s.rentLate || 0) + 1;
      addLog('⚠️ Aluguel atrasado (' + s.rentLate + 'º mês). Multa de 10%.');
      if (s.rentLate >= 3) evict();
    } else {
      out += rp;
      s.rentLate = 0;
    }
  }
  // assinaturas: as marcadas são canceladas, as demais entram nas saídas
  s.recur = s.recur.filter(function (r) {
    if (sk['sub:' + r.id]) {
      if (r.id === 'news') s.news = false;
      addLog('✂️ Cancelou: ' + r.n + '.');
      return false;
    }
    out += r.amt;
    return true;
  });
  // parcelas: se atrasar, entra nos atrasos com 2% de multa; com 3 atrasadas a dívida inteira vence
  s.inst.forEach(function (x, i) {
    if (sk['inst:' + i]) {
      x.late = (x.late || 0) + 1;
      s.arrears = (s.arrears || 0) + x.amt * 1.02;
      if (x.late >= 3) {
        s.arrears += x.amt * (x.left - 1);
        x.left = 0;
        addLog(
          '🚨 ' + x.name + ': 3 parcelas atrasadas. A dívida toda venceu e foi para cobrança.'
        );
      } else addLog('⚠️ Parcela atrasada: ' + x.name + '.');
    } else {
      out += x.amt;
      x.left--;
      x.late = 0;
    }
  });
  s.inst = s.inst.filter(function (x) {
    return x.left > 0;
  });
  // imóveis (propsMonth) e custos mensais de bens e pet (itemsMonthly)
  var pm = propsMonth(sk);
  inc += pm.inc;
  out += pm.out + itemsMonthly();
  // curso: mensalidade, humor -1,5 e, no último mês, entra na formação (s.edu)
  if (s.study) {
    if (sk.study) addLog('⏸️ Curso trancado neste mês.');
    else {
      out += s.study.per;
      s.happy -= 1.5;
      s.study.left--;
      if (s.study.left <= 0) {
        s.edu.push(s.study.id);
        addLog('🎓 Você concluiu: ' + COURSE[s.study.id].n + '. Há vagas novas à espera.');
        s.study = null;
      }
    }
  }
  // devoluções agendadas (consórcio) que chegaram na data
  (s.refunds || []).forEach(function (r) {
    if (s.month >= r.m && !r.done) {
      r.done = true;
      inc += r.amt;
      addLog('💸 O consórcio devolveu ' + fmt(r.amt) + '.');
    }
  });
  // contas em atraso crescem 1% ao mês
  if ((s.arrears || 0) > 0.5) s.arrears *= 1.01;
  // 3) FECHA O MÊS: soma as entradas e desconta as saídas. O que faltar vira dívida do cartão (spend, arquivo 06)
  s.cash += inc;
  spend(out);
  // 4) CARTÃO: paga tudo, o mínimo (15%) ou nada, conforme a escolha da tela de contas
  if (s.debt > 0.5) {
    var pay = P.card === 'total' ? s.debt : P.card === 'min' ? s.debt * 0.15 : 0;
    pay = Math.min(pay, s.cash);
    if (pay > 0) {
      s.cash -= pay;
      s.debt -= pay;
    }
  }
  // juros do rotativo: 12% ao mês, mas o total de juros nunca passa do valor original da dívida (teto legal de 100%)
  if (s.debt > 0.5) {
    var ji = Math.min(s.debt * 0.12, Math.max(0, (s.debtOrig || s.debt) - (s.debtChg || 0)));
    s.debt += ji;
    s.debtChg = (s.debtChg || 0) + ji;
    s.stats.interest += ji;
    if (ji > 0.5) addLog('🔥 Juros do cartão: ' + fmt(ji) + '.');
    else if (!s.capNoted) {
      s.capNoted = true;
      unlock('renegociar');
      addLog(
        '🛑 A dívida do cartão bateu o teto legal: juros e encargos já somam 100% do valor original.'
      );
    }
  }
  if (s.debt <= 0.5) {
    s.debt = 0;
    s.debtOrig = 0;
    s.debtChg = 0;
    s.capNoted = false;
  }
  // "nome sujo" = há contas em atraso
  s.neg = (s.arrears || 0) > 0.5;
  if (s.neg) unlock('nome_sujo');
  // guarda entradas e saídas do mês para as telas
  s.lastMonth = { inc: inc, out: out };
  // humor: anda 6% do caminho até o alvo (happyTarget = conforto + vida social), soma o efeito do padrão de vida e cai 1,2 sem emprego
  s.happy = clamp(
    s.happy + (happyTarget() - s.happy) * 0.06 + LS[s.life].h + (s.job ? 0 : -1.2),
    0,
    100
  );
  // 5) O MERCADO SE MEXE: preços, dividendos e as notícias que valiam para este mês
  market();
  // o relógio avança: daqui em diante, month já é o mês seguinte
  s.month++;
  // moradia (pressão dos pais, contrato) e filhos (gravidez, nascimento, idade)
  homeTick();
  kidsTick();
  // 6) a cada 12 meses: inflação, reajuste do salário e promoção
  if (s.month % 12 === 0) yearTurn();
  // procurando emprego: chance mensal de chegarem propostas (menor se já está empregado)
  if (s.searching && chance(s.jobChance * (s.job ? 0.6 : 1))) offerJobs();
  // humor zerado ao fim do mês também dispara a crise
  if (s.happy <= 0) crisis();
  // sorteia um evento da vida; se nenhum saiu, há 12% de chance de um evento social
  if (!drawEvent() && chance(0.12)) drawEvent(true);
  // assinante do jornal recebe o resumo (só no último mês de um avanço, para não interromper o avanço de vários meses)
  if (s.news && s.auto <= 1) modalQ.push({ type: 'newsbrief' });
  // vitória: patrimônio líquido chegou à meta (GOAL, R$ 1 milhão)
  if (!s.won && netWorth() >= GOAL) {
    s.won = true;
    s.wonMonth = s.month;
    s.wonAge = age();
    s.auto = 0;
    unlock('liberdade');
    modalQ.push({ type: 'win' });
  }
  // histórico do patrimônio para o gráfico (guarda os últimos 600 meses)
  s.nw.push(netWorth());
  if (s.nw.length > 600) s.nw.shift();
  // fim de jogo ao chegar à idade final (END_AGE)
  if (age() >= END_AGE && !s.over) {
    s.over = true;
    s.auto = 0;
    modalQ.push({ type: 'end' });
  }
}
/**
 * Move o mercado em um mês:
 *   1. de vez em quando troca o "regime" (baixa, normal ou alta);
 *   2. M = retorno do mercado geral = regime + ruído;
 *   3. aplica as notícias que eram verdadeiras (um setor, ou "macro", que mexe em todo o mercado);
 *   4. a Selic pode mudar um pouco;
 *   5. cada ativo rende  alpha + beta·M + choque do setor + ruído (sig·gauss).
 *      Selic, CDB e poupança seguem a Selic, não o mercado.
 */
function market() {
  var s = S,
    L = [];
  if (chance(0.06))
    s.regime = pickW([
      [0, 0.2],
      [1, 0.58],
      [2, 0.22],
    ]);
  var M = REG[s.regime].mu + 0.03 * gauss(),
    sh = {};
  s.nextNews.forEach(function (n) {
    if (n.real) {
      if (n.sector === 'macro') M += n.dir * n.mag;
      else sh[n.sector] = (sh[n.sector] || 0) + n.dir * n.mag;
      s.whatHappened.push('✅ Confirmou: ' + n.text);
    } else {
      s.whatHappened.push('❌ Era boato: ' + n.text);
      if (s.news) unlock('noticias');

function go(n) {

  if (energiaCarga() <= 0) {
    toast('Energia esgotada! Faça uma lição para ganhar +1 mês, ou volte amanhã. ⚡');
    return;
  }

  S.billsOk = false;

function runAuto() {
  while (S.auto > 0 && !cur && !modalQ.length && !S.over) {
    if (energiaCarga() <= 0) break;
    if (!S.billsOk && needBillsNow()) {
      modalQ.push({ type: 'bills', skip: {}, card: S.debt > 0.5 ? 'total' : 'none' });
      break;
    }
    tick();
    energiaUsar(1);
    S.billsOk = false;
    S.auto--;

}
function resolveEvent(i) {

  addLog(m.e.t + ': ' + c.l + (note ? '. ' + note : ''));

          fmt2(S.prices[a.id]) +

function doTrade() {

    amt = readAmt(),
    price = S.prices[a.id];

    toast('Digite um valor.');
    return;
  }
  if (m.mode === 'buy') {
    if (amt > S.cash + 0.01) {
      toast('Caixa insuficiente.');
      return;
    }
    amt = Math.min(amt, S.cash);
    var h = S.port[a.id] || { q: 0, cost: 0 };
    h.q += amt / price;
    h.cost += amt;
    S.port[a.id] = h;
    S.cash -= amt;

    unlock('juros_compostos');
    if (a.id === 'poup' || a.id === 'selic') unlock('selic');
    else if (a.tipo === 'Ação') unlock('acao');
    else if (a.tipo === 'ETF') unlock('etf');
    else if (a.tipo === 'Fundo imobiliário') unlock('fii');
    else if (a.tipo === 'Cripto') unlock('risco');
    addLog('📈 Comprou ' + fmt(amt) + ' de ' + a.tk + '.');
    toast('Comprou ' + fmt(amt) + ' de ' + a.tk);
  } else {
    var val = hv(a.id);
    if (amt > val) amt = val;
    var hh = S.port[a.id],
      f = amt / val,
      profit = amt - hh.cost * f,
      tax = a.tf ? 0 : Math.max(0, profit) * 0.15;
    hh.q *= 1 - f;
    hh.cost *= 1 - f;
    if (f > 0.9999 || hh.q * price < 0.01) delete S.port[a.id];
    S.cash += amt - tax;
    S.stats.taxes += tax;
    if (profit > 0 && !a.tf) unlock('imposto');
    addLog(
      '💸 Vendeu ' + fmt(amt) + ' de ' + a.tk + (tax > 0 ? ' (imposto ' + fmt(tax) + ')' : '') + '.'

    toast('Vendeu ' + fmt(amt) + ' de ' + a.tk);

  if (!L) {
    closeModal();
    return;
  }
  var x = Math.min(readAmt(), S.cash, L.bal);
  if (x <= 0) {
    toast('Digite um valor.');
    return;
  }
  var r = amortCalc(L, x);
  S.cash -= x;
  L.bal -= x;
  L.left = r.left;
  if (L.bal < 1 || L.left <= 0) {
    p.loan = null;
    addLog('🏁 Você quitou o financiamento: ' + p.n + '.');
  } else
    addLog(
      '✂️ Amortizou ' + fmt(x) + ' de ' + p.n + '. Economia de ~' + fmt(r.save) + ' em juros.'

  unlock('amortizacao');
  toast('Amortizou ' + fmt(x) + '. Juros evitados: ~' + fmt(r.save));
  closeModal();

function sellProp() {
  var p = S.props[cur.i];

    closeModal();
    return;
  }
  var v = sellValue(p);
  S.cash += v.net;
  S.stats.taxes += v.tax;
  if (v.net < 0) {
    S.debt += -S.cash > 0 ? -S.cash : 0;
    if (S.cash < 0) S.cash = 0;

  S.props.splice(cur.i, 1);
  if (p.use === 'morar') leaveOwned();
  addLog('🏷️ Vendeu ' + p.n + ' por ' + fmt(v.gross) + ' (líquido ' + fmt(v.net) + ').');

 * 14 · GRÁFICOS

/* ---------- telas ---------- */
function spark(arr) {
  var w = 84,
    h = 28;
  if (arr.length < 2) return '<svg class="spark"></svg>';
  var mn = Math.min.apply(null, arr),
    mx = Math.max.apply(null, arr),
    rg = mx - mn || 1;
  var pts = arr
    .map(function (v, i) {
      return (
        ((i / (arr.length - 1)) * w).toFixed(1) +
        ',' +
        (h - 3 - ((v - mn) / rg) * (h - 6)).toFixed(1)
      );
    })
    .join(' ');
  var up = arr[arr.length - 1] >= arr[0];
  return (
    '<svg class="spark" viewBox="0 0 ' +
    w +
    ' ' +
    h +
    '" aria-hidden="true"><polyline fill="none" stroke="var(--' +
    (up ? 'good' : 'bad') +
    ')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' +
    pts +
    '"/></svg>'
  );
}
function nwChart() {
  var a = S.nw.slice(-180);
  if (a.length < 3) return '<p class="muted sm">O gráfico aparece depois de alguns meses.</p>';
  var w = 320,
    h = 90,
    mn = Math.min.apply(null, a),
    mx = Math.max.apply(null, a),
    rg = mx - mn || 1;
  var pts = a.map(function (v, i) {
    return [(i / (a.length - 1)) * w, h - 6 - ((v - mn) / rg) * (h - 14)];
  });
  var line = pts
    .map(function (p) {
      return p[0].toFixed(1) + ',' + p[1].toFixed(1);
    })
    .join(' ');
  var zero =
    mn < 0 && mx > 0
      ? '<line x1="0" x2="' +
        w +
        '" y1="' +
        (h - 6 - ((0 - mn) / rg) * (h - 14)).toFixed(1) +
        '" y2="' +
        (h - 6 - ((0 - mn) / rg) * (h - 14)).toFixed(1) +
        '" stroke="var(--line)" stroke-dasharray="4 4"/>'
      : '';
  return (
    '<svg viewBox="0 0 ' +
    w +
    ' ' +
    h +
    '" style="width:100%;height:90px" aria-label="Patrimônio ao longo do tempo">' +
    zero +
    '<polygon points="0,' +
    h +
    ' ' +
    line +
    ' ' +
    w +
    ',' +
    h +
    '" fill="var(--brand-soft)"/><polyline points="' +
    line +
    '" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/></svg>'
  );
}

function bExec() {

    B = bLoad(),
    px = bPx(m.t),
    n = Math.floor(m.n || 0);

  if (m.side === 'buy') {
    var tot = n * px;
    if (tot > B.cash + 1e-6) {
      toast('Caixa insuficiente.');
      return;
    }
    B.cash -= tot;
    var P = B.pos[m.t] || { q: 0, cost: 0 };
    P.q += n;
    P.cost += tot;
    B.pos[m.t] = P;
    B.trades.unshift({ t: m.t, side: 'buy', q: n, px: px, ts: Date.now() });
    toast('Comprou ' + n + ' ' + m.t);
  } else {
    var P2 = B.pos[m.t];
    if (!P2 || n > P2.q) {
      toast('Quantidade maior que a sua posição.');
      return;
    }
    var avg = P2.cost / P2.q,
      tot2 = n * px,
      profit = n * (px - avg),
      k = bMonth();
    B.sold = B.sold || {};
    B.sold[k] = (B.sold[k] || 0) + tot2;
    var tax = profit > 0 && !bExempt(m.t, B.sold[k]) ? profit * bTaxRate(m.t) : 0;
    B.cash += tot2 - tax;
    B.taxes = (B.taxes || 0) + tax;
    P2.q -= n;
    P2.cost -= avg * n;
    if (P2.q <= 0) delete B.pos[m.t];
    B.trades.unshift({ t: m.t, side: 'sell', q: n, px: px, tax: tax, ts: Date.now() });
    toast('Vendeu ' + n + ' ' + m.t);
  }

  bSave(B);

function copyText(t, ok) {
  function done() {
    toast(ok);
  }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(t).then(done, fb);
      return;
    }
  } catch (e) {}
  fb();
  function fb() {
    try {
      var a = document.createElement('textarea');
      a.value = t;
      a.setAttribute('readonly', '');
      a.style.position = 'fixed';
      a.style.opacity = '0';
      document.body.appendChild(a);
      a.select();
      document.execCommand('copy');
      document.body.removeChild(a);
      done();
    } catch (e) {
      toast('Não deu para copiar. Selecione e copie o código manualmente.');
    }
  }
}

var LIC = [{"id":1,"modulo":1,"titulo":"Dinheiro é ferramenta, não placar","texto":"O que você gasta some; o que você guarda pode trabalhar por você. Ter uma boa mentalidade financeira é decidir antes para onde vai cada real, em vez de descobrir no fim do mês para onde ele foi. A riqueza que traz tranquilidade é a que não aparece: o dinheiro guardado.","exemplo":"Guardar R$ 400 por mês durante 5 anos soma R$ 24.000. Rendendo 0,8% ao mês, vira R$ 30.649,55.","perguntas":[{"pergunta":"Ana guarda R$ 300 assim que recebe o salário. Bia guarda o que sobra no fim do mês. Quem tende a acumular mais?","alternativas":["Ana, porque decide o valor antes de gastar.","Bia, porque assim não aperta o orçamento.","As duas, porque o salário é o mesmo.","Bia, porque guarda só o que não fez falta."],"correta":0,"explicacao":"Quem separa primeiro garante que o dinheiro seja guardado; o que \"sobra\" no fim do mês costuma ser zero."},{"pergunta":"No exemplo, por que o total passa de R$ 24.000?","alternativas":["Porque o salário sobe junto com o tempo.","Porque o dinheiro guardado também rende.","Porque o banco paga um bônus por fidelidade.","Porque a inflação aumenta o valor guardado."],"correta":1,"explicacao":"A inflação reduz o poder de compra; quem aumenta o valor é o rendimento sobre o que foi sendo guardado."}],"fonte":"A Psicologia Financeira (Morgan Housel)"},{"id":2,"modulo":1,"titulo":"Pague-se primeiro","texto":"Pagar-se primeiro é tratar o investimento como a primeira conta do mês: assim que o salário cai, uma parte vai para o investimento, e você vive com o resto. Começar com 5% ou 10% já cria o hábito. O valor importa menos que a constância.","exemplo":"Com salário de R$ 2.500, separar 10% significa investir R$ 250 no dia do pagamento. Em um ano, são R$ 3.000,00 guardados, antes do rendimento.","perguntas":[{"pergunta":"Qual atitude é \"pagar-se primeiro\"?","alternativas":["Investir uma parte do salário no dia em que ele cai.","Investir o que sobrar depois de pagar todas as contas.","Comprar algo para si antes de pagar as contas.","Investir só quando receber um aumento."],"correta":0,"explicacao":"A ideia é dar ao investimento a mesma prioridade de uma conta fixa."},{"pergunta":"Quem ganha R$ 3.200 e quer se pagar primeiro com 10% deve separar quanto por mês?","alternativas":["R$ 3.200","R$ 32","R$ 1.000","R$ 320"],"correta":3,"explicacao":"10% de R$ 3.200 = R$ 320."}],"fonte":"Quero Ficar Rico (Rafael Seabra)"},{"id":3,"modulo":1,"titulo":"Para onde vai o seu dinheiro?","texto":"Antes de cortar gastos, é preciso enxergá-los. Anote tudo por um mês, inclusive os pequenos. Depois, agrupe em categorias: moradia, comida, transporte, lazer. É comum descobrir que algo \"pequeno\" pesa muito no fim do mês.","exemplo":"Um café de R$ 8 em 22 dias úteis custa R$ 176 por mês, ou R$ 2.112 por ano. Delivery de R$ 45 duas vezes por semana passa de R$ 380 por mês.","perguntas":[{"pergunta":"Por que anotar até os gastos pequenos?","alternativas":["Porque gastos pequenos não entram na fatura do cartão.","Porque só os gastos grandes são de verdade.","Porque o banco exige esse controle.","Porque, somados no mês, eles podem pesar mais que um gasto grande."],"correta":3,"explicacao":"Gastos frequentes e baixos passam despercebidos, mas a soma no mês é alta."},{"pergunta":"Um gasto de R$ 15 por dia útil (22 dias) custa quanto por mês?","alternativas":["R$ 220","R$ 150","R$ 450","R$ 330"],"correta":3,"explicacao":"R$ 15 × 22 = R$ 330."}],"fonte":"Me Poupe! (Nathalia Arcuri)"},{"id":4,"modulo":1,"titulo":"O mapa das dívidas","texto":"Liste cada dívida com três números: quanto falta pagar, a taxa de juros e a parcela. Só com a taxa dá para saber qual é a mais cara. Uma dívida pequena com juros altos pode crescer mais rápido do que uma grande com juros baixos.","exemplo":"R$ 1.500 a 12% ao mês geram R$ 180,00 de juros no mês. R$ 6.000 a 1,5% ao mês geram R$ 90,00. A dívida menor custa o dobro.","perguntas":[{"pergunta":"Qual informação decide qual dívida é a mais cara?","alternativas":["O número de parcelas restantes.","O nome do banco.","O valor total devido.","A taxa de juros."],"correta":3,"explicacao":"É a taxa que diz quanto a dívida cresce a cada mês."},{"pergunta":"Qual dívida gera mais juros em um mês: R$ 2.000 a 10% ao mês ou R$ 8.000 a 2% ao mês?","alternativas":["As duas geram o mesmo valor.","A de R$ 8.000, porque é maior.","A de R$ 2.000, com R$ 200 de juros.","A de R$ 8.000, com R$ 160 de juros."],"correta":2,"explicacao":"R$ 2.000 × 10% = R$ 200; R$ 8.000 × 2% = R$ 160."}],"fonte":"Quero Ficar Rico (Rafael Seabra)"},{"id":5,"modulo":1,"titulo":"Avalanche ou bola de neve?","texto":"Há dois jeitos de quitar várias dívidas. Na avalanche, você paga primeiro a de juros mais altos: é o que mais economiza. Na bola de neve, paga primeiro a menor, para ganhar motivação com cada vitória. O pior é não escolher nenhum.","exemplo":"Dívidas: cartão de R$ 3.000 a 12% ao mês e empréstimo de R$ 800 a 4% ao mês. Na avalanche, o cartão vem primeiro; na bola de neve, o empréstimo.","perguntas":[{"pergunta":"Qual método economiza mais juros?","alternativas":["Avalanche: quitar primeiro a de juros mais altos.","Pagar todas um pouco por mês, igualmente.","Quitar primeiro a mais antiga.","Bola de neve: quitar primeiro a menor."],"correta":0,"explicacao":"Eliminar a dívida mais cara primeiro reduz o total de juros pagos."},{"pergunta":"Qual é a principal vantagem da bola de neve?","alternativas":["Ela aumenta o limite do cartão.","Ela limpa o nome mais cedo em todos os casos.","Ela sempre paga menos juros.","A motivação de ver dívidas sumirem rápido."],"correta":3,"explicacao":"Quitar uma dívida pequena dá sensação de progresso, o que ajuda a manter o plano."}],"fonte":"Quero Ficar Rico (Rafael Seabra)"},{"id":6,"modulo":1,"titulo":"O rotativo, a dívida mais cara","texto":"Pagar só o mínimo da fatura joga o resto no rotativo, com juros que passam de 10% ao mês. Desde 2024, a lei limita juros e encargos do rotativo a 100% do valor original: a dívida pode, no máximo, dobrar. Ainda assim, é a primeira a ser quitada.","exemplo":"R$ 2.000,00 no rotativo a 12% ao mês viram R$ 3.947,65 em 6 meses, perto do teto legal de R$ 4.000,00.","perguntas":[{"pergunta":"Você deve R$ 1.000 no rotativo desde janeiro. Pela regra em vigor, qual é o máximo que essa dívida pode chegar com juros e encargos?","alternativas":["Não há limite","R$ 3.900","R$ 1.120","R$ 2.000"],"correta":3,"explicacao":"Juros e encargos do rotativo não podem passar de 100% do valor original."},{"pergunta":"O que acontece quando você paga só o valor mínimo da fatura?","alternativas":["O restante é perdoado pelo banco.","Nada, o mínimo quita a fatura.","O restante entra no rotativo e passa a ter juros altos.","O restante é parcelado sem juros."],"correta":2,"explicacao":"O mínimo evita o atraso, mas o saldo vira dívida no rotativo."}],"fonte":"Banco Central — regras do rotativo: https://www.bcb.gov.br"},{"id":7,"modulo":1,"titulo":"Renegociar é trocar dívida cara por barata","texto":"Se não dá para quitar, negocie. Bancos e lojas costumam oferecer desconto à vista ou parcelas com juros menores, principalmente para dívidas atrasadas. Antes de aceitar, compare o total que vai pagar e confira se a parcela cabe no orçamento, para não atrasar de novo.","exemplo":"Uma dívida de R$ 4.000 renegociada em 12 vezes a 2,5% ao mês tem parcela de R$ 389,95 e total de R$ 4.679,38.","perguntas":[{"pergunta":"Qual cuidado é essencial antes de fechar um acordo?","alternativas":["Parar de pagar as outras contas para quitar essa.","Escolher sempre o maior número de parcelas.","Aceitar a primeira proposta para não perder a chance.","Conferir se a parcela cabe no orçamento."],"correta":3,"explicacao":"Um acordo que não cabe no orçamento tende a atrasar e piorar a situação."},{"pergunta":"Por que renegociar o rotativo costuma valer a pena?","alternativas":["Porque o banco devolve os juros já pagos.","Porque a dívida deixa de existir.","Porque renegociar sempre zera o valor devido.","Porque troca juros de mais de 10% ao mês por juros bem menores."],"correta":3,"explicacao":"A dívida continua, mas cresce muito mais devagar."}],"fonte":"https://www.bcb.gov.br/cidadaniafinanceira"},{"id":8,"modulo":1,"titulo":"As assinaturas esquecidas","texto":"Streaming, aplicativos, academia que você não usa: pequenas assinaturas mensais somam muito no ano. Revise a fatura a cada poucos meses e cancele o que não usa. É um dos cortes mais fáceis, porque não muda em nada a sua rotina.","exemplo":"Três assinaturas de R$ 39,90 somam R$ 119,70 por mês, ou R$ 1.436,40 por ano. Investido a 0,8% ao mês por 10 anos, esse valor mensal vira R$ 23.966,03.","perguntas":[{"pergunta":"Por que cortar assinaturas não usadas é um bom primeiro passo?","alternativas":["Porque economiza todo mês sem mudar sua rotina.","Porque é proibido ter mais de duas assinaturas.","Porque assinaturas têm juros como o cartão.","Porque o valor de cada uma é sempre alto."],"correta":0,"explicacao":"Se você não usa, o corte não faz falta e o ganho se repete todo mês."},{"pergunta":"Quanto custam por ano quatro assinaturas de R$ 25?","alternativas":["R$ 300","R$ 1.000","R$ 100","R$ 1.200"],"correta":3,"explicacao":"R$ 25 × 4 × 12 = R$ 1.200."}],"fonte":"Me Poupe! (Nathalia Arcuri)"},{"id":9,"modulo":1,"titulo":"O preço escondido de parecer rico","texto":"Muitas compras servem mais à imagem do que à utilidade. O status cobra duas vezes: no preço e no dinheiro que deixa de render. Comparar-se com os outros não tem fim, porque sempre haverá alguém com algo mais novo.","exemplo":"Um celular em 12× de R$ 350,00 custa R$ 4.200,00. Investindo os mesmos R$ 350,00 por mês a 1%, você junta R$ 4.438,88 e compra à vista com sobra.","perguntas":[{"pergunta":"No exemplo, por que investir antes de comprar deixa uma sobra?","alternativas":["Porque o dinheiro rende enquanto você junta.","Porque o celular fica mais barato em um ano.","Porque parcelar sempre tem juros escondidos.","Porque a loja dá desconto para quem espera."],"correta":0,"explicacao":"O rendimento das parcelas investidas cobre a compra e ainda sobra."},{"pergunta":"O que significa dizer que o status \"cobra duas vezes\"?","alternativas":["O cartão cobra juros duas vezes.","Você paga o preço e ainda perde o rendimento desse dinheiro.","Você precisa comprar dois para manter o status.","Produtos de marca têm imposto em dobro."],"correta":1,"explicacao":"Além do preço, há o custo de oportunidade: o que esse dinheiro renderia."}],"fonte":"A Psicologia Financeira (Morgan Housel)"},{"id":10,"modulo":1,"titulo":"A regra das 48 horas","texto":"Para compras não essenciais, espere dois dias antes de decidir. Promoções e anúncios são feitos para acelerar a decisão. Muitas vezes, depois de 48 horas, a vontade passa ou você encontra uma opção melhor.","exemplo":"Uma TV de R$ 2.400 \"só hoje\" com 20% de desconto ainda custa R$ 1.920. Se você não ia comprar uma TV, a economia real foi zero: o gasto foi de R$ 1.920.","perguntas":[{"pergunta":"Uma loja anuncia: \"desconto de R$ 500, só hoje\" em algo que você não planejava comprar. Qual é a economia real se comprar?","alternativas":["Depende da forma de pagamento.","Nenhuma: você gastou o preço com desconto.","Metade do desconto.","R$ 500, o valor do desconto."],"correta":1,"explicacao":"Desconto só é economia se você já ia comprar o produto."},{"pergunta":"Qual é o objetivo da regra das 48 horas?","alternativas":["Dar tempo para a vontade passar ou para comparar opções.","Esperar o preço cair pela metade.","Garantir que o produto chegue mais rápido.","Aproveitar o prazo de devolução."],"correta":0,"explicacao":"A espera tira a pressão da compra por impulso."}],"fonte":"A Psicologia Financeira (Morgan Housel)"},{"id":11,"modulo":1,"titulo":"Parcelado \"sem juros\" é mesmo sem juros?","texto":"Muitas lojas dão desconto à vista. Se o preço à vista é menor, o parcelado tem juros embutidos, mesmo que a loja diga que não. Compare sempre o total parcelado com o preço à vista. Se forem iguais, parcelar e deixar o dinheiro rendendo pode até compensar.","exemplo":"Uma geladeira custa R$ 2.000 em 10× ou R$ 1.800 à vista. O desconto de 10% à vista é bem mais do que o dinheiro renderia em 10 meses na renda fixa.","perguntas":[{"pergunta":"Um produto custa R$ 1.000 em 5× \"sem juros\" ou R$ 900 à vista. O que isso indica?","alternativas":["Que o preço à vista tem taxa escondida.","Que os dois custam o mesmo.","Que há juros embutidos no parcelado.","Que o parcelado é a melhor opção."],"correta":2,"explicacao":"Se à vista é mais barato, você paga mais por parcelar."},{"pergunta":"Quando parcelar sem juros pode compensar?","alternativas":["Quando você não tem reserva de emergência.","Quando o preço parcelado é igual ao à vista e o dinheiro fica rendendo.","Quando a parcela é pequena, mesmo que o total seja maior.","Sempre, porque não há juros."],"correta":1,"explicacao":"Sem desconto à vista, deixar o dinheiro rendendo enquanto paga as parcelas é vantagem."}],"fonte":"Me Poupe! (Nathalia Arcuri)"},{"id":12,"modulo":1,"titulo":"Para que serve a reserva","texto":"A reserva de emergência é dinheiro guardado só para imprevistos: perder o emprego, um problema de saúde, um conserto urgente. Ela evita que um susto vire dívida cara e que você venda investimentos de longo prazo na pior hora.","exemplo":"Um conserto de R$ 3.000,00 pago no rotativo a 12% ao mês vira R$ 4.214,78 em 3 meses. Com reserva, você paga e repõe aos poucos, sem juros.","perguntas":[{"pergunta":"Qual destes usos é adequado para a reserva de emergência?","alternativas":["Pagar o tratamento de um dente que quebrou.","Pagar a viagem de férias.","Aproveitar a promoção de um celular.","Comprar ações que caíram muito."],"correta":0,"explicacao":"A reserva é para imprevistos, não para oportunidades ou desejos."},{"pergunta":"No exemplo, quanto a falta de reserva custaria em juros?","alternativas":["R$ 1.080,00","R$ 360,00","R$ 1.214,78","Nada"],"correta":2,"explicacao":"A dívida chega a R$ 4.214,78: são R$ 1.214,78 só de juros."}],"fonte":"A Psicologia Financeira (Morgan Housel)"},{"id":13,"modulo":1,"titulo":"Do tamanho certo","texto":"O tamanho da reserva parte do custo de vida mensal. A recomendação comum vai de 6 a 12 meses desse custo. Quem tem renda estável fica mais perto de 6; quem é autônomo ou tem renda variável, mais perto de 12. O importante é começar, mesmo que devagar.","exemplo":"Custo de vida de R$ 3.000,00: reserva de 6 meses = R$ 18.000,00; de 12 meses = R$ 36.000,00. Guardando R$ 900 por mês, os 6 meses ficam prontos em 20 meses.","perguntas":[{"pergunta":"Carla é autônoma e sua renda varia muito. Seu custo de vida é R$ 2.500. Qual reserva faz mais sentido?","alternativas":["R$ 7.500 (3 meses).","R$ 2.500 (1 mês).","Perto de R$ 30.000 (12 meses).","Não precisa de reserva, porque ganha bem em alguns meses."],"correta":2,"explicacao":"Com renda instável, períodos sem ganhar são mais prováveis: 12 × R$ 2.500 = R$ 30.000."},{"pergunta":"A base para calcular a reserva é:","alternativas":["O valor que se quer ter em 10 anos.","O limite do cartão.","O custo de vida mensal.","O salário bruto."],"correta":2,"explicacao":"A reserva precisa cobrir os meses em que você ficaria sem renda."}],"fonte":"Quero Ficar Rico (Rafael Seabra)"},{"id":14,"modulo":1,"titulo":"Onde guardar a reserva","texto":"A reserva precisa de três coisas: segurança, resgate rápido e rendimento que acompanhe a inflação. Opções comuns são o Tesouro Selic e CDBs com liquidez diária de bancos sólidos. Ações e fundos imobiliários não servem: podem estar em queda justamente quando você precisar.","exemplo":"Em março de 2020, quem tinha a reserva em ações e precisou do dinheiro teve de vender com o Ibovespa mais de 30% abaixo do início do ano.","perguntas":[{"pergunta":"Por que ações não são adequadas para a reserva?","alternativas":["Porque ações pagam imposto todo mês.","Porque podem estar em queda justamente quando você precisar do dinheiro.","Porque ações sempre perdem para a inflação.","Porque ações não podem ser vendidas."],"correta":1,"explicacao":"Na crise, o imprevisto e a queda da bolsa costumam acontecer juntos."},{"pergunta":"Qual opção atende melhor aos requisitos de uma reserva?","alternativas":["Ações de uma única empresa.","Criptomoedas.","Um imóvel para alugar.","Tesouro Selic."],"correta":3,"explicacao":"O Tesouro Selic é seguro, tem resgate rápido e acompanha a taxa básica de juros."}],"fonte":"Tesouro Direto: https://www.tesourodireto.com.br"},{"id":15,"modulo":1,"titulo":"O que é liquidez","texto":"Liquidez é a facilidade de transformar um investimento em dinheiro, rápido e sem perder valor. Dinheiro na conta tem liquidez total. Um imóvel tem pouca: vender pode levar meses e exigir desconto. Liquidez diária significa poder resgatar em qualquer dia útil.","exemplo":"Para vender rápido um apartamento de R$ 400.000, o dono aceita R$ 360.000. Esse desconto de 10% é o custo da falta de liquidez.","perguntas":[{"pergunta":"Qual destes tem menos liquidez?","alternativas":["Dinheiro na conta corrente.","Tesouro Selic.","Um terreno.","CDB com liquidez diária."],"correta":2,"explicacao":"Vender um terreno pode levar meses e exigir desconto."},{"pergunta":"João precisa vender seu carro em 2 dias e só consegue fazer isso com um desconto grande. O que isso mostra?","alternativas":["Que o carro é um bom investimento.","Que o carro tem baixa liquidez.","Que o carro tem garantia do FGC.","Que o carro tem alta rentabilidade."],"correta":1,"explicacao":"Quando é preciso dar desconto para vender rápido, a liquidez é baixa."}],"fonte":"Me Poupe! (Nathalia Arcuri)"},{"id":16,"modulo":1,"titulo":"Rápido ou rentável?","texto":"Aplicações que prendem o dinheiro até uma data costumam pagar mais do que as de liquidez diária. Para a reserva, liquidez vem primeiro. Para um objetivo com data marcada, como uma viagem daqui a dois anos, dá para aceitar menos liquidez e ganhar mais.","exemplo":"R$ 10.000 por um ano com CDI de 12%: a 100% do CDI com liquidez diária rendem R$ 1.200,00; a 110% do CDI, sem resgate antes do vencimento, rendem R$ 1.320,00. Antes do IR.","perguntas":[{"pergunta":"Você vai trocar de carro daqui a 2 anos e não vai precisar desse dinheiro antes. Qual escolha faz mais sentido?","alternativas":["Ações de uma única empresa.","Deixar na conta corrente.","Um CDB que vence em 2 anos pagando mais.","Um CDB de liquidez diária pagando menos."],"correta":2,"explicacao":"Com data marcada e sem necessidade de saque, faz sentido trocar liquidez por rendimento."},{"pergunta":"No exemplo, o que você abre mão para ganhar R$ 120 a mais?","alternativas":["Do pagamento de imposto.","Da possibilidade de sacar antes do vencimento.","Do rendimento do CDI.","Da garantia do FGC."],"correta":1,"explicacao":"O rendimento maior vem em troca de deixar o dinheiro preso."}],"fonte":"Me Poupe! (Nathalia Arcuri)"},{"id":17,"modulo":1,"titulo":"O ladrão silencioso","texto":"Inflação é o aumento geral dos preços. Quando os preços sobem, o mesmo dinheiro compra menos: é a perda do poder de compra. Dinheiro parado perde valor todo ano, mesmo que o número na conta não mude.","exemplo":"Com inflação de 5% ao ano, R$ 100 guardados no colchão compram, depois de 10 anos, o equivalente a R$ 61,39 de hoje.","perguntas":[{"pergunta":"Você guardou R$ 1.000 em casa por 3 anos e a inflação foi de 5% ao ano. O que aconteceu?","alternativas":["O banco descontou a inflação.","O dinheiro aumentou para R$ 1.150.","Você continua com R$ 1.000, mas eles compram menos.","Você continua com R$ 1.000 e eles compram o mesmo."],"correta":2,"explicacao":"O valor nominal fica igual, mas os preços subiram: o poder de compra caiu."},{"pergunta":"Por que a inflação é chamada de \"ladrão silencioso\"?","alternativas":["Porque só atinge quem investe.","Porque aumenta o valor das dívidas antigas.","Porque o governo retira dinheiro das contas.","Porque reduz o poder de compra sem mudar o valor na conta."],"correta":3,"explicacao":"Você não vê o dinheiro sumir, mas ele passa a comprar menos."}],"fonte":"IBGE Explica — Inflação: https://www.ibge.gov.br/explica/inflacao.php"},{"id":18,"modulo":1,"titulo":"O IPCA e a cesta de compras","texto":"O IPCA, calculado pelo IBGE, é o índice oficial de inflação do Brasil. Ele acompanha os preços de uma cesta de produtos e serviços que as famílias consomem: comida, aluguel, transporte, saúde, educação. Sua inflação pessoal pode ser diferente, conforme o que você mais compra.","exemplo":"Se o IPCA do ano foi 4%, mas você gasta muito com alimentos, que subiram 8%, a sua inflação pessoal ficou acima do índice oficial.","perguntas":[{"pergunta":"Quem calcula o IPCA?","alternativas":["A B3.","O IBGE.","O Ministério da Economia.","O Banco Central."],"correta":1,"explicacao":"O IPCA é calculado e divulgado pelo IBGE."},{"pergunta":"O IPCA do ano foi 4%, mas o aluguel de Paula subiu 10%. O que é correto dizer?","alternativas":["O aluguel não entra no IPCA.","O IPCA está errado.","Paula não sente a inflação.","A inflação pessoal de Paula pode ter sido maior que o IPCA."],"correta":3,"explicacao":"O IPCA é uma média; cada pessoa tem a sua cesta de gastos."}],"fonte":"IBGE — IPCA: https://www.ibge.gov.br"},{"id":19,"modulo":1,"titulo":"Juro real","texto":"Juro real é quanto um investimento rende acima da inflação. Só ele aumenta o seu poder de compra. A conta exata é (1 + rendimento) ÷ (1 + inflação) − 1. Um investimento que rende menos que a inflação faz você perder poder de compra, mesmo com o saldo crescendo.","exemplo":"Rendimento de 10% e inflação de 4%: juro real = 1,10 ÷ 1,04 − 1 = 5,77%. Rendimento de 3% com inflação de 4%: juro real de -0,96%.","perguntas":[{"pergunta":"Um investimento rendeu 6% num ano em que a inflação foi 6%. Qual foi o ganho real?","alternativas":["3%.","6%.","Zero.","12%."],"correta":2,"explicacao":"Rendeu exatamente a inflação: o poder de compra ficou igual."},{"pergunta":"Rendimento de 8% e inflação de 3%. O juro real fica mais perto de:","alternativas":["4,9%","8%.","5,0% exatos.","11%."],"correta":0,"explicacao":"1,08 ÷ 1,03 − 1 ≈ 4,85%: um pouco menos que a simples subtração."}],"fonte":"Banco Central — Cidadania Financeira: https://www.bcb.gov.br/cidadaniafinanceira"},{"id":20,"modulo":1,"titulo":"A taxa que mexe em tudo","texto":"A Selic é a taxa básica de juros do Brasil. Ela é definida pelo Copom, do Banco Central, em oito reuniões por ano. Com inflação alta, o Copom costuma subir a Selic para frear o consumo e os preços. Com inflação controlada, pode baixá-la para estimular a economia.","exemplo":"R$ 10.000 por um ano rendendo a Selic: com a taxa em 15%, rendem R$ 1.500,00; com a taxa em 10%, rendem R$ 1.000,00. Antes do IR.","perguntas":[{"pergunta":"A inflação está subindo forte. O que o Copom tende a fazer?","alternativas":["Subir a Selic.","Congelar os preços.","Imprimir mais dinheiro.","Baixar a Selic."],"correta":0,"explicacao":"Juros mais altos encarecem o crédito e desaceleram a alta dos preços."},{"pergunta":"Quantas vezes por ano o Copom se reúne para decidir a Selic?","alternativas":["Doze.","Quatro.","Uma.","Oito."],"correta":3,"explicacao":"São oito reuniões por ano, cerca de uma a cada 45 dias."}],"fonte":"Banco Central — Copom: https://www.bcb.gov.br/controleinflacao/copom"},{"id":21,"modulo":1,"titulo":"Selic alta, Selic baixa","texto":"Selic alta deixa empréstimos e financiamentos mais caros e faz a renda fixa render mais. Selic baixa barateia o crédito e reduz o rendimento da renda fixa, o que leva muita gente a procurar a bolsa. Nenhum dos dois cenários dura para sempre.","exemplo":"Financiar R$ 50.000 a 1% ao mês em 48 meses dá parcela de R$ 1.316,69. A 2% ao mês, a parcela vai para R$ 1.630,09.","perguntas":[{"pergunta":"Com a Selic em alta, o que acontece com um CDB que paga 100% do CDI?","alternativas":["Ele deixa de ter garantia do FGC.","Ele vira um investimento de risco.","Ele passa a render mais.","Ele passa a render menos."],"correta":2,"explicacao":"O CDI acompanha a Selic, então o CDB rende mais."},{"pergunta":"Por que muita gente procura a bolsa quando a Selic está baixa?","alternativas":["Porque é proibido investir em renda fixa.","Porque a bolsa fica sem risco.","Porque a inflação some.","Porque a renda fixa passa a render pouco."],"correta":3,"explicacao":"Com a renda fixa pagando pouco, a busca por retorno maior leva investidores para a bolsa."}],"fonte":"Banco Central: https://www.bcb.gov.br/controleinflacao/taxaselic"},{"id":22,"modulo":1,"titulo":"A régua da renda fixa","texto":"O CDI é a taxa dos empréstimos de um dia entre bancos e anda quase colado na Selic. Ele virou a régua da renda fixa: em vez de dizer quanto um CDB rende em reais, os bancos dizem quantos por cento do CDI ele paga. Quanto maior a porcentagem, maior o rendimento.","exemplo":"Com CDI de 12% ao ano, R$ 5.000 a 110% do CDI rendem R$ 660,00 em um ano. Com IR de 17,5%, sobram R$ 544,50.","perguntas":[{"pergunta":"Um CDB paga 120% do CDI. Com o CDI em 10% ao ano, quanto ele rende antes do IR?","alternativas":["10% ao ano.","12% ao ano.","22% ao ano.","120% ao ano."],"correta":1,"explicacao":"10% × 1,2 = 12%."},{"pergunta":"Com qual taxa o CDI anda quase colado?","alternativas":["IPCA.","Selic.","Dólar.","Poupança."],"correta":1,"explicacao":"O CDI acompanha de perto a taxa básica, um pouco abaixo dela."}],"fonte":"B3: https://www.b3.com.br"},{"id":23,"modulo":1,"titulo":"Comparando taxas diferentes","texto":"Para comparar um CDB com uma LCI ou LCA, lembre do imposto: CDBs pagam IR, enquanto LCIs e LCAs são isentas para pessoas físicas. Por isso, uma LCI que paga menos do CDI pode render mais, no bolso, que um CDB que paga mais.","exemplo":"Em 2 anos, com IR de 15%, um CDB a 105% do CDI equivale a uma aplicação isenta de 89,25% do CDI. Uma LCI a 92% do CDI ganha dele.","perguntas":[{"pergunta":"CDB a 110% do CDI ou LCA isenta a 95% do CDI, os dois por mais de 2 anos (IR de 15%). Qual rende mais no bolso?","alternativas":["O CDB, porque a porcentagem é maior.","Os dois rendem exatamente igual.","A LCA, que equivale a mais que 110% × 0,85 = 93,5%.","Depende da data de vencimento só."],"correta":2,"explicacao":"110% × 0,85 = 93,5% do CDI líquido, menos que os 95% isentos da LCA."},{"pergunta":"Por que LCIs e LCAs costumam pagar porcentagens menores do CDI?","alternativas":["Porque não têm garantia.","Porque só podem ser vendidas por bancos pequenos.","Porque são isentas de IR para pessoas físicas.","Porque o risco delas é maior."],"correta":2,"explicacao":"Sem imposto, elas podem pagar menos e ainda entregar o mesmo no bolso."}],"fonte":"Receita Federal · B3: https://www.b3.com.br"},{"id":24,"modulo":1,"titulo":"Por que a poupança rende pouco","texto":"A poupança rende 0,5% ao mês mais a TR quando a Selic está acima de 8,5% ao ano. Quando a Selic está igual ou abaixo disso, rende 70% da Selic mais a TR. Ela é isenta de IR e tem garantia do FGC, mas costuma perder para o Tesouro Selic e para CDBs a 100% do CDI.","exemplo":"Com Selic de 12% ao ano, a poupança rende cerca de 0,5% ao mês (6,2% ao ano, sem a TR). Um CDB a 100% do CDI renderia perto de 12% antes do IR.","perguntas":[{"pergunta":"Com a Selic em 7% ao ano, quanto rende a poupança, sem contar a TR?","alternativas":["0,5% ao mês fixo.","70% da Selic, ou 4,9% ao ano.","100% do CDI.","7% ao ano."],"correta":1,"explicacao":"Com Selic até 8,5%, a regra é 70% da Selic: 0,7 × 7% = 4,9%."},{"pergunta":"Qual vantagem a poupança tem em relação a um CDB?","alternativas":["É isenta de imposto de renda.","Não tem nenhum risco, nem de inflação.","Sempre rende mais.","Rende 100% do CDI."],"correta":0,"explicacao":"A isenção é a principal vantagem, mas costuma não compensar o rendimento menor."}],"fonte":"Banco Central — poupança: https://www.bcb.gov.br"},{"id":25,"modulo":1,"titulo":"Tesouro Selic: o porto seguro","texto":"No Tesouro Selic você empresta dinheiro ao governo federal e recebe a taxa Selic. O preço do título varia muito pouco, então dá para resgatar a qualquer dia útil sem surpresas. Por isso é a opção clássica para a reserva de emergência e para objetivos de curto prazo.","exemplo":"R$ 5.000 no Tesouro Selic com taxa de 12% ao ano viram R$ 5.600,00 em um ano, antes do IR. Se precisar sacar em 3 meses, o valor estará perto de R$ 5.143,69.","perguntas":[{"pergunta":"Por que o Tesouro Selic é indicado para a reserva de emergência?","alternativas":["Porque o valor só pode ser sacado no vencimento.","Porque é o título que mais rende no longo prazo.","Porque o preço varia pouco e dá para resgatar a qualquer dia útil.","Porque é isento de imposto de renda."],"correta":2,"explicacao":"Segurança e resgate rápido são o que a reserva precisa."},{"pergunta":"No Tesouro Direto, para quem você empresta dinheiro?","alternativas":["Para o seu banco.","Para o governo federal.","Para empresas listadas na bolsa.","Para a B3."],"correta":1,"explicacao":"Os títulos do Tesouro são dívida do governo federal."}],"fonte":"Tesouro Direto: https://www.tesourodireto.com.br"},{"id":26,"modulo":1,"titulo":"Tesouro Prefixado: taxa travada","texto":"No Tesouro Prefixado, a taxa é definida no dia da compra. Se você levar o título até o vencimento, sabe exatamente quanto vai receber. É bom quando você acha que os juros vão cair. O risco é a inflação subir mais do que o esperado e comer parte do ganho.","exemplo":"R$ 1.000 num Prefixado a 11% ao ano por 3 anos viram R$ 1.367,63 no vencimento, antes do IR, aconteça o que acontecer com a Selic.","perguntas":[{"pergunta":"Você comprou um Prefixado a 11% ao ano. Depois, a Selic cai para 8%. O que acontece com o que você recebe no vencimento?","alternativas":["Continua o combinado: 11% ao ano.","O título é cancelado.","Cai para 8% ao ano.","Sobe para acompanhar a Selic."],"correta":0,"explicacao":"No Prefixado, a taxa fica travada desde a compra até o vencimento."},{"pergunta":"Qual é o principal risco de quem leva um Prefixado até o vencimento?","alternativas":["Receber menos reais do que o combinado.","A inflação ficar acima do esperado e reduzir o ganho real.","O título perder a garantia do FGC.","O governo não pagar os juros."],"correta":1,"explicacao":"O valor em reais é garantido no vencimento; o que pode piorar é o poder de compra."}],"fonte":"Tesouro Direto: https://www.tesourodireto.com.br"},{"id":27,"modulo":1,"titulo":"Tesouro IPCA+: protegido da inflação","texto":"O Tesouro IPCA+ paga a inflação do período mais uma taxa fixa. Por isso, seu poder de compra cresce sempre que você leva o título até o vencimento. É muito usado para objetivos longos, como a aposentadoria.","exemplo":"Com taxa de 6% ao ano e IPCA de 4%, o título rende (1,04 × 1,06) − 1 = 10,24% no ano. Em 10 anos, R$ 10.000 viram o equivalente a R$ 17.908,48 de hoje.","perguntas":[{"pergunta":"Num ano de inflação de 8%, um Tesouro IPCA+ 5% rende aproximadamente:","alternativas":["13,4% no ano.","3% no ano.","5% no ano.","8% no ano."],"correta":0,"explicacao":"(1,08 × 1,05) − 1 = 13,4%: ele repõe a inflação e soma a taxa fixa."},{"pergunta":"Por que o IPCA+ é indicado para a aposentadoria?","alternativas":["Porque nunca oscila de preço.","Porque tem o maior rendimento no curto prazo.","Porque é isento de imposto.","Porque garante ganho real, acima da inflação, até o vencimento."],"correta":3,"explicacao":"Ao proteger o poder de compra por décadas, ele combina com objetivos longos."}],"fonte":"Tesouro Direto: https://www.tesourodireto.com.br"},{"id":28,"modulo":1,"titulo":"Marcação a mercado","texto":"Os títulos do Tesouro têm preço todo dia. Quando os juros do mercado sobem, os títulos com taxa travada valem menos; quando caem, valem mais. Isso só importa se você vender antes do vencimento. No vencimento, você recebe o combinado.","exemplo":"Um Prefixado que paga R$ 1.000 em 5 anos vale R$ 620,92 com juros de mercado a 10%. Se os juros sobem para 12%, ele passa a valer R$ 567,43 hoje.","perguntas":[{"pergunta":"Os juros do mercado subiram muito. O que acontece com o preço de um Tesouro IPCA+ que você já tem?","alternativas":["Ele não muda, porque é do governo.","Ele cai, se você quiser vender hoje.","Ele sobe na mesma hora.","Ele sobe só no vencimento."],"correta":1,"explicacao":"Títulos com taxa travada perdem valor quando surgem taxas novas mais altas."},{"pergunta":"Quem leva um Prefixado até o vencimento é afetado pela marcação a mercado?","alternativas":["Sim, sempre recebe mais que o combinado.","Não, recebe o valor combinado no vencimento.","Sim, perde a garantia do Tesouro.","Sim, pode receber menos que o combinado."],"correta":1,"explicacao":"A oscilação do preço só se realiza se você vender antes."}],"fonte":"Tesouro Direto: https://www.tesourodireto.com.br"},{"id":29,"modulo":1,"titulo":"CDB: emprestando ao banco","texto":"Ao comprar um CDB, você empresta dinheiro a um banco e recebe juros, geralmente uma porcentagem do CDI. Bancos menores costumam pagar mais, porque precisam atrair dinheiro. Há CDBs com liquidez diária e outros que só pagam no vencimento.","exemplo":"R$ 2.000 num CDB a 105% do CDI, com CDI de 12% ao ano, viram R$ 2.535,75 em 2 anos. O rendimento de R$ 535,75 paga 15% de IR (R$ 80,36).","perguntas":[{"pergunta":"Por que um banco pequeno costuma pagar mais em seu CDB do que um grande?","alternativas":["Porque o CDB de banco pequeno não paga IR.","Porque bancos pequenos lucram mais.","Para atrair investidores, que veem mais risco nele.","Porque o Banco Central obriga."],"correta":2,"explicacao":"Mais risco percebido exige rendimento maior para atrair dinheiro."},{"pergunta":"Quem recebe o dinheiro quando você compra um CDB?","alternativas":["O banco que emitiu o CDB.","A B3.","Uma empresa da bolsa.","O governo federal."],"correta":0,"explicacao":"O CDB é uma dívida do banco com você."}],"fonte":"FGC: https://www.fgc.org.br"},{"id":30,"modulo":1,"titulo":"LCI e LCA: isentas de IR","texto":"LCIs e LCAs são emprestadas a bancos para financiar o setor imobiliário e o agronegócio. Para pessoa física, o rendimento é isento de imposto de renda. Em troca, costumam ter um prazo mínimo antes do resgate. Também contam com a garantia do FGC.","exemplo":"Uma LCA a 90% do CDI, com CDI de 12%, rende 10,8% ao ano livre de IR. Para empatar, um CDB de mais de 2 anos precisaria pagar 105,9% do CDI.","perguntas":[{"pergunta":"Uma LCI paga 88% do CDI. Um CDB, 100% do CDI, com IR de 15%. Qual rende mais no bolso?","alternativas":["Os dois rendem igual.","A LCI: o CDB líquido equivale a 85% do CDI.","Não dá para comparar.","O CDB, porque 100% é maior."],"correta":1,"explicacao":"100% × 0,85 = 85% do CDI líquido, menos que os 88% isentos da LCI."},{"pergunta":"Qual cuidado é importante antes de aplicar numa LCA?","alternativas":["Lembrar de pagar o IR todo mês.","Saber que ela não tem nenhuma garantia.","Verificar o prazo mínimo antes de poder resgatar.","Saber que ela só aceita valores acima de R$ 100 mil."],"correta":2,"explicacao":"Elas costumam ter carência, então o dinheiro fica preso por um tempo."}],"fonte":"Receita Federal · FGC: https://www.fgc.org.br"},{"id":31,"modulo":1,"titulo":"O FGC, a rede de proteção","texto":"O FGC protege investimentos como CDB, LCI, LCA e poupança se o banco quebrar. A garantia é de até R$ 250 mil por CPF em cada instituição, com um teto total de R$ 1 milhão a cada 4 anos. Tesouro Direto não usa o FGC: é garantido pelo governo.","exemplo":"Quem tem R$ 400 mil em CDBs de um único banco que quebra recebe R$ 250 mil do FGC. Os outros R$ 150 mil ficam descobertos.","perguntas":[{"pergunta":"Você tem R$ 300 mil em CDBs: R$ 150 mil no banco A e R$ 150 mil no banco B. Se os dois quebrarem, quanto o FGC cobre?","alternativas":["Nada, porque eram dois bancos.","R$ 250 mil.","R$ 150 mil.","Os R$ 300 mil."],"correta":3,"explicacao":"O limite é de R$ 250 mil por instituição; cada banco está dentro do limite."},{"pergunta":"O que garante o Tesouro Direto?","alternativas":["O governo federal.","A corretora.","A B3.","O FGC."],"correta":0,"explicacao":"Os títulos públicos são dívida do governo, não usam o FGC."}],"fonte":"FGC: https://www.fgc.org.br"},{"id":32,"modulo":1,"titulo":"IR na renda fixa: quanto mais tempo, menos imposto","texto":"Na renda fixa, o IR incide só sobre o rendimento e diminui com o tempo: 22,5% até 180 dias, 20% até 360, 17,5% até 720 e 15% depois disso. O imposto é descontado automaticamente no resgate. Poupança, LCI e LCA são isentas.","exemplo":"Rendimento de R$ 1.000: resgatando em 5 meses, o IR é de R$ 225; depois de 2 anos, cai para R$ 150.","perguntas":[{"pergunta":"Você resgatou um CDB depois de 400 dias, com R$ 2.000 de rendimento. Quanto de IR?","alternativas":["R$ 450 (22,5%).","R$ 300 (15%).","Nada, porque passou de um ano.","R$ 350 (17,5%)."],"correta":3,"explicacao":"Entre 361 e 720 dias, a alíquota é 17,5%: 0,175 × R$ 2.000 = R$ 350."},{"pergunta":"Sobre o que o IR da renda fixa é cobrado?","alternativas":["Sobre todo o valor resgatado.","Sobre o valor aplicado.","Apenas sobre o rendimento.","Sobre o saldo, todo mês."],"correta":2,"explicacao":"O valor que você aplicou não é tributado, só o que ele rendeu."}],"fonte":"Receita Federal: https://www.gov.br/receitafederal"},{"id":33,"modulo":1,"titulo":"O IOF dos primeiros 30 dias","texto":"Se você resgatar uma aplicação de renda fixa antes de 30 dias, paga IOF sobre o rendimento. Ele começa em 96% no primeiro dia e cai até zerar no 30º. Por isso, evite aplicar dinheiro que vai precisar em poucos dias.","exemplo":"Rendimento de R$ 30 resgatado no 15º dia: o IOF leva 50%, ou R$ 15. Esperando até o 30º dia, o IOF é zero.","perguntas":[{"pergunta":"Você aplicou num CDB e resgatou depois de 45 dias. Pagou IOF?","alternativas":["Sim, sobre todo o valor aplicado.","Não, o IOF só existe nos primeiros 30 dias.","Sim, 96% do rendimento.","Sim, 50% do rendimento."],"correta":1,"explicacao":"A partir do 30º dia o IOF zera; fica só o IR."},{"pergunta":"Sobre o que o IOF é cobrado?","alternativas":["Sobre todo resgate, sempre.","Sobre o rendimento, se o resgate for antes de 30 dias.","Sobre o valor aplicado.","Sobre os dividendos de ações."],"correta":1,"explicacao":"Ele incide sobre o ganho, numa porcentagem que cai dia a dia."}],"fonte":"Receita Federal: https://www.gov.br/receitafederal"},{"id":34,"modulo":1,"titulo":"Juros sobre juros","texto":"Nos juros compostos, o rendimento de cada mês passa a render também. No começo o efeito parece pequeno, mas ele acelera com o tempo. É o mesmo mecanismo que faz uma dívida crescer, só que agora a seu favor.","exemplo":"R$ 300 por mês a 1% ao mês por 20 anos somam R$ 72.000 de aportes, mas viram R$ 296.776,61. Mais de três quartos são juros.","perguntas":[{"pergunta":"Você investe R$ 10.000 a 10% ao ano. Quanto terá depois de 2 anos, com juros compostos?","alternativas":["R$ 12.100","R$ 12.000","R$ 20.000","R$ 11.000"],"correta":0,"explicacao":"10.000 × 1,1 × 1,1 = 12.100: no segundo ano, os juros incidem também sobre os R$ 1.000 do primeiro."},{"pergunta":"Por que os juros compostos parecem fracos no começo?","alternativas":["Porque o banco paga menos no começo.","Porque o efeito acelera com o tempo, conforme os juros se acumulam.","Porque só funcionam acima de R$ 100 mil.","Porque a inflação anula os primeiros anos."],"correta":1,"explicacao":"O crescimento é exponencial: devagar no início, rápido depois."}],"fonte":"Quero Ficar Rico (Rafael Seabra)"},{"id":35,"modulo":1,"titulo":"O tempo vale mais que o valor","texto":"Começar cedo pesa mais do que investir muito. Quem começa jovem dá décadas para os juros compostos trabalharem. Quem adia precisa aportar bem mais para chegar ao mesmo lugar. O melhor momento para começar é o mais cedo possível.","exemplo":"Ana investe R$ 300 por mês dos 25 aos 35 anos e para. Bia investe R$ 300 por mês dos 35 aos 65. A 0,7% ao mês, aos 65 Ana tem R$ 691.465,86 e Bia, R$ 485.141,27.","perguntas":[{"pergunta":"No exemplo, Ana aportou R$ 36.000 e Bia R$ 108.000. Por que Ana termina com mais?","alternativas":["Porque Ana investiu em ações.","Porque Bia pagou mais imposto.","P
