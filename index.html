orque Ana teve um rendimento maior.","Porque o dinheiro dela teve 30 anos a mais para render."],"correta":3,"explicacao":"A taxa era a mesma; a diferença foi o tempo de juros compostos."},{"pergunta":"Qual é a principal lição do exemplo?","alternativas":["Só vale investir depois dos 35.","Quem investe mais sempre termina com mais.","Investir por 10 anos é suficiente para todos.","Começar cedo pode valer mais que aportar muito."],"correta":3,"explicacao":"O tempo multiplica cada real investido."}],"fonte":"Investindo em Ações no Longo Prazo (Jeremy Siegel)"},{"id":36,"modulo":1,"titulo":"Coloque no automático","texto":"A disciplina fica mais fácil quando não depende de força de vontade. Programe uma transferência automática para o dia do salário ou uma aplicação mensal na corretora. Assim, investir vira um hábito que acontece sozinho.","exemplo":"Uma aplicação automática de R$ 200 todo dia 5, rendendo 0,8% ao mês, junta R$ 15.324,77 em 5 anos sem que você precise lembrar.","perguntas":[{"pergunta":"Qual hábito ajuda mais a manter os aportes por anos?","alternativas":["Agendar uma aplicação automática no dia do salário.","Esperar o melhor momento do mercado.","Investir uma vez por ano, com o 13º.","Investir só quando sobrar dinheiro."],"correta":0,"explicacao":"No automático, o investimento acontece antes que o dinheiro seja gasto."},{"pergunta":"Por que depender da força de vontade é um problema?","alternativas":["Porque força de vontade custa caro.","Porque em meses difíceis é fácil adiar e perder o hábito.","Porque os bancos não aceitam aportes manuais.","Porque aportes manuais pagam mais imposto."],"correta":1,"explicacao":"Automatizar tira a decisão do caminho."}],"fonte":"Quero Ficar Rico (Rafael Seabra)"},{"id":37,"modulo":1,"titulo":"Margem de segurança emocional","texto":"Planos financeiros falham quando contam com tudo dando certo. Deixe folga: invista contando com um rendimento menor, guarde mais do que o mínimo e não aposte tudo numa única ideia. A folga é o que permite não desistir quando a vida sai do roteiro.","exemplo":"Quem planeja juntar R$ 500 mil contando com 0,8% ao mês e só consegue 0,6% chega a R$ 533.762,34 em 20 anos, aportando R$ 1.000 por mês, em vez de R$ 721.131,22.","perguntas":[{"pergunta":"Qual atitude cria margem de segurança num plano financeiro?","alternativas":["Contar com o melhor rendimento possível.","Investir tudo no ativo que mais subiu.","Planejar com uma estimativa de rendimento mais conservadora.","Não ter reserva para não perder rendimento."],"correta":2,"explicacao":"Se o resultado vier melhor, ótimo; se vier pior, o plano não quebra."},{"pergunta":"Segundo essa ideia, o que mais faz as pessoas desistirem dos planos?","alternativas":["Ter metas de longo prazo.","Ganhar pouco dinheiro.","Planos sem folga, que quebram no primeiro imprevisto.","Investir em renda fixa."],"correta":2,"explicacao":"Sem folga, qualquer imprevisto vira motivo para abandonar o plano."}],"fonte":"A Psicologia Financeira (Morgan Housel)"},{"id":38,"modulo":1,"titulo":"Sorte e risco","texto":"Nem todo resultado bom vem de uma boa decisão, nem todo resultado ruim vem de uma decisão ruim. Sorte e risco existem dos dois lados. Por isso, cuidado ao copiar quem ficou rico com uma aposta: você vê os que deram certo, não os muitos que perderam.","exemplo":"Se mil pessoas apostam tudo numa ação e ela sobe 300%, as que ganharam viram exemplo. Quem perdeu numa ação parecida não dá entrevista.","perguntas":[{"pergunta":"Um amigo ficou rico apostando tudo em uma criptomoeda. O que essa história mostra?","alternativas":["Que diversificar é perda de tempo.","Que a sorte não existe.","Pouco: você não vê os muitos que fizeram o mesmo e perderam.","Que essa é a melhor estratégia."],"correta":2,"explicacao":"Olhar só os casos de sucesso esconde o risco que todos correram."},{"pergunta":"Como avaliar se uma decisão financeira foi boa?","alternativas":["Apenas pelo lucro obtido.","Pelo que aconteceu no mês seguinte.","Pelo raciocínio e pelos riscos na hora da decisão, não só pelo resultado.","Pela opinião de quem ganhou mais."],"correta":2,"explicacao":"Uma boa decisão pode dar errado por azar, e uma ruim pode dar certo por sorte."}],"fonte":"A Psicologia Financeira (Morgan Housel)"},{"id":39,"modulo":1,"titulo":"Cada objetivo pede um investimento","texto":"Separe os objetivos pelo prazo. Curto prazo (até 2 anos): renda fixa com liquidez, sem sustos. Médio prazo (2 a 5 anos): títulos com vencimento perto da data, como CDBs ou Tesouro. Longo prazo (mais de 5 anos): dá para incluir ações, que oscilam mas tendem a render mais.","exemplo":"Para trocar de carro em 1 ano, use um CDB de liquidez diária. Para a aposentadoria em 30 anos, um Tesouro IPCA+ e ações podem fazer parte.","perguntas":[{"pergunta":"Você vai dar a entrada de um apartamento em 8 meses. Onde faz mais sentido deixar o dinheiro?","alternativas":["Num CDB ou Tesouro Selic, com liquidez.","Num Tesouro IPCA+ que vence em 2045.","Em ações de uma única empresa.","Em criptomoedas."],"correta":0,"explicacao":"Prazo curto pede segurança e liquidez, não ativos que podem cair."},{"pergunta":"Por que ações combinam mais com objetivos longos?","alternativas":["Porque não têm risco no longo prazo.","Porque são isentas de imposto.","Porque rendem igual à renda fixa.","Porque há tempo para se recuperar das quedas."],"correta":3,"explicacao":"No longo prazo as oscilações se diluem; no curto, uma queda pode estragar o plano."}],"fonte":"Me Poupe! (Nathalia Arcuri)"},{"id":40,"modulo":1,"titulo":"A ordem certa das coisas","texto":"Um bom plano segue uma ordem: primeiro, quitar dívidas caras; depois, montar a reserva de emergência; em seguida, investir para os objetivos de curto e médio prazo; por fim, o longo prazo, como a aposentadoria. Pular etapas costuma sair caro.","exemplo":"Investir R$ 5.000 a 1% ao mês enquanto deve R$ 5.000 no rotativo a 12% ao mês faz você perder cerca de R$ 550 por mês.","perguntas":[{"pergunta":"Paula tem R$ 3.000 guardados e deve R$ 3.000 no rotativo. O que fazer primeiro?","alternativas":["Comprar Tesouro IPCA+.","Montar a reserva e deixar a dívida.","Investir em ações para ganhar mais.","Quitar a dívida do rotativo."],"correta":3,"explicacao":"Nenhum investimento seguro rende os juros do rotativo."},{"pergunta":"Qual etapa vem logo depois de quitar as dívidas caras?","alternativas":["Investir em ações.","Montar a reserva de emergência.","Planejar a aposentadoria.","Comprar um imóvel."],"correta":1,"explicacao":"Sem reserva, o próximo imprevisto vira dívida de novo."}],"fonte":"Quero Ficar Rico (Rafael Seabra)"},{"id":41,"modulo":2,"titulo":"Investir ou especular?","texto":"Benjamin Graham definiu: investir é, após análise cuidadosa, buscar segurança do dinheiro e um retorno adequado. Tudo que foge disso é especulação. Comprar uma ação porque \"vai subir amanhã\" é especular; comprar porque a empresa é boa e o preço é justo é investir.","exemplo":"Quem compra uma ação só porque ela subiu 30% na semana está especulando. Quem compra porque estudou o lucro da empresa e achou o preço razoável está investindo.","perguntas":[{"pergunta":"Qual atitude é investir, segundo Graham?","alternativas":["Seguir a dica de um grupo de mensagens.","Comprar para vender no dia seguinte.","Comprar após analisar a empresa e o preço.","Comprar porque a ação subiu muito na semana."],"correta":2,"explicacao":"Investir exige análise, foco em segurança e retorno adequado."},{"pergunta":"Especular é sempre errado?","alternativas":["Não, é igual a investir.","Sim, é proibido por lei.","Não, mas é preciso saber que se está especulando e limitar o risco.","Sim, sempre dá prejuízo."],"correta":2,"explicacao":"O problema é especular achando que está investindo."}],"fonte":"O Investidor Inteligente (Benjamin Graham)"},{"id":42,"modulo":2,"titulo":"Comprar uma ação é virar sócio","texto":"Uma ação é um pedaço de uma empresa. Ao comprá-la, você vira sócio, com direito a uma parte dos lucros. Se a empresa cresce, sua parte tende a valer mais. Pensar como sócio, e não como apostador, muda o jeito de escolher ações.","exemplo":"Uma empresa com 1 bilhão de ações lucrou R$ 2 bilhões no ano. Cada ação tem direito a R$ 2 desse lucro. Quem tem 500 ações é sócio de R$ 1.000 do lucro.","perguntas":[{"pergunta":"Uma empresa tem 500 milhões de ações e lucrou R$ 1 bilhão. Qual é o lucro por ação?","alternativas":["R$ 0,50","R$ 5","R$ 2","R$ 1"],"correta":2,"explicacao":"R$ 1 bilhão ÷ 500 milhões de ações = R$ 2 por ação."},{"pergunta":"O que significa ter \"visão de sócio\"?","alternativas":["Escolher ações pela qualidade do negócio, como quem compra parte de uma empresa.","Escolher ações pelo preço mais baixo.","Só investir em empresas famosas.","Comprar e vender ações todos os dias."],"correta":0,"explicacao":"O sócio se importa com lucros e futuro do negócio, não com a variação do dia."}],"fonte":"O Rei dos Dividendos (Luiz Barsi)"},{"id":43,"modulo":2,"titulo":"Como funciona a bolsa","texto":"A bolsa brasileira é a B3. Você compra ações por meio de uma corretora. Cada ação tem um código, como PETR4. O lote padrão é de 100 ações, mas dá para comprar unidades no mercado fracionário, acrescentando F ao código.","exemplo":"Uma ação a R$ 38 no lote padrão exige R$ 3.800 (100 × R$ 38). No fracionário (PETR4F), dá para comprar 3 ações por R$ 114.","perguntas":[{"pergunta":"Você quer investir R$ 200 numa ação que custa R$ 40. Como fazer?","alternativas":["Comprar meia ação no lote padrão.","Não é possível, o mínimo é um lote de 100.","Comprar 5 ações no mercado fracionário.","Pedir à empresa para vender direto."],"correta":2,"explicacao":"No fracionário, você compra a partir de uma ação: 5 × R$ 40 = R$ 200."},{"pergunta":"Qual é o papel da corretora?","alternativas":["Definir o preço das ações.","Garantir que as ações vão subir.","Intermediar suas compras e vendas na B3.","Emitir as ações das empresas."],"correta":2,"explicacao":"A corretora dá acesso à bolsa; o preço vem da oferta e procura."}],"fonte":"B3: https://www.b3.com.br"},{"id":44,"modulo":2,"titulo":"ON ou PN?","texto":"Ações ordinárias (ON), com final 3, dão direito a voto nas assembleias. Ações preferenciais (PN), com final 4, em geral não votam, mas têm preferência no recebimento de dividendos. Algumas empresas têm as duas; outras, só ON.","exemplo":"PETR3 é a ação ordinária da Petrobras; PETR4, a preferencial. Quem tem PETR3 pode votar nas assembleias; quem tem PETR4 tem prioridade nos proventos.","perguntas":[{"pergunta":"Você quer participar das decisões da empresa nas assembleias. Qual tipo de ação comprar?","alternativas":["Qualquer uma, as duas votam.","A ordinária (ON), com final 3.","A preferencial (PN), com final 4.","Nenhuma, acionista não vota."],"correta":1,"explicacao":"O direito a voto é das ações ordinárias."},{"pergunta":"O que costuma ser a vantagem da ação preferencial?","alternativas":["Isenção total de imposto.","Prioridade no recebimento de dividendos.","Direito a voto em dobro.","Garantia de que não cai."],"correta":1,"explicacao":"Em troca de não votar, a PN costuma ter preferência nos proventos."}],"fonte":"B3: https://www.b3.com.br"},{"id":45,"modulo":2,"titulo":"Units: o pacote de ações","texto":"Algumas empresas negociam units, com código terminado em 11. Uma unit é um pacote de ações ON e PN da mesma empresa, vendido junto. Atenção: fundos imobiliários e ETFs também usam final 11, então o código sozinho não diz o que é o ativo.","exemplo":"Uma unit pode ser formada por 1 ação ON e 2 PN, por exemplo. Comprar a unit equivale a comprar as três ações juntas.","perguntas":[{"pergunta":"Você viu um código terminado em 11. O que dá para concluir?","alternativas":["É uma ação sem direito a dividendos.","É sempre uma unit.","É sempre um fundo imobiliário.","Pode ser uma unit, um fundo imobiliário ou um ETF."],"correta":3,"explicacao":"O final 11 é usado por vários tipos de ativo; é preciso conferir."},{"pergunta":"O que é uma unit?","alternativas":["Um título do Tesouro.","Uma cota de vários fundos.","Uma ação com voto em dobro.","Um pacote com ações ON e PN da mesma empresa."],"correta":3,"explicacao":"A unit junta ações de tipos diferentes da mesma empresa num só papel."}],"fonte":"B3: https://www.b3.com.br"},{"id":46,"modulo":2,"titulo":"Governança: confiar em quem manda","texto":"Governança é o conjunto de regras que protege o acionista minoritário. A B3 tem segmentos com exigências diferentes. No Novo Mercado, o mais exigente, a empresa só pode ter ações ON e, se for vendida, o comprador deve pagar a todos os acionistas o mesmo preço pago ao controlador.","exemplo":"Se o controlador de uma empresa do Novo Mercado vende sua parte por R$ 30 por ação, os minoritários têm direito de vender pelo mesmo R$ 30.","perguntas":[{"pergunta":"Qual característica é exigida no Novo Mercado da B3?","alternativas":["Ter só ações preferenciais.","Pagar dividendos todo mês.","Ter apenas ações ordinárias (ON).","Ter lucro todos os anos."],"correta":2,"explicacao":"No Novo Mercado, todos os acionistas têm ações com voto."},{"pergunta":"Por que a governança importa para quem tem poucas ações?","alternativas":["Porque protege o minoritário de decisões que favorecem só o controlador.","Porque obriga a empresa a recomprar as ações.","Porque isenta o investidor de imposto.","Porque garante que a ação vai subir."],"correta":0,"explicacao":"Boas regras evitam que o pequeno acionista seja prejudicado."}],"fonte":"B3: https://www.b3.com.br"},{"id":47,"modulo":2,"titulo":"Renda passiva: dinheiro que trabalha","texto":"Renda passiva é o dinheiro que entra sem que você troque seu tempo por ele: dividendos de ações, rendimentos de fundos imobiliários, juros da renda fixa. Construí-la leva anos de aportes e reinvestimentos, mas é o caminho para viver dos investimentos.","exemplo":"Uma carteira de R$ 200 mil que paga 6% ao ano em proventos gera R$ 12.000,00 por ano, ou R$ 1.000,00 por mês.","perguntas":[{"pergunta":"Quanto precisa estar investido para receber R$ 2.000 por mês com uma carteira que paga 6% ao ano?","alternativas":["R$ 400 mil.","R$ 24 mil.","R$ 2 milhões.","R$ 120 mil."],"correta":0,"explicacao":"R$ 2.000 × 12 = R$ 24.000 por ano; R$ 24.000 ÷ 0,06 = R$ 400.000."},{"pergunta":"Qual destes é exemplo de renda passiva?","alternativas":["Salário de um emprego.","Venda de um carro usado.","Rendimentos mensais de um fundo imobiliário.","Horas extras."],"correta":2,"explicacao":"Renda passiva vem dos investimentos, não do seu trabalho direto."}],"fonte":"O Rei dos Dividendos (Luiz Barsi)"},{"id":48,"modulo":2,"titulo":"Dividendos: sua parte do lucro","texto":"Dividendos são a parte do lucro que a empresa distribui aos acionistas. Para a maioria dos investidores pessoa física, são isentos de IR. Desde 2026, quem recebe mais de R$ 50 mil num mês da mesma empresa tem 10% retidos na fonte.","exemplo":"Uma empresa paga R$ 1,50 por ação em dividendos. Quem tem 400 ações recebe R$ 600, sem desconto de IR.","perguntas":[{"pergunta":"Você tem 1.000 ações e a empresa paga R$ 0,80 por ação em dividendos. Quanto recebe?","alternativas":["R$ 800, isentos de IR.","R$ 720, com 10% de IR.","R$ 680, com 15% de IR.","R$ 80."],"correta":0,"explicacao":"1.000 × R$ 0,80 = R$ 800; abaixo de R$ 50 mil no mês, continua isento."},{"pergunta":"Desde 2026, quando há retenção de 10% sobre dividendos?","alternativas":["Nunca, dividendos são sempre isentos.","Quando a pessoa recebe mais de R$ 50 mil num mês da mesma empresa.","Só para ações preferenciais.","Sempre, sobre qualquer dividendo."],"correta":1,"explicacao":"A regra atinge quem recebe valores altos de uma única empresa num mesmo mês."}],"fonte":"Receita Federal · Lei 15.270/2025"},{"id":49,"modulo":2,"titulo":"JCP: o primo do dividendo","texto":"Os juros sobre capital próprio (JCP) também distribuem lucro ao acionista, mas têm imposto retido na fonte: 17,5% desde 2026. A empresa paga menos imposto ao usar o JCP, por isso muitas preferem essa forma. O valor anunciado costuma ser o bruto.","exemplo":"Uma empresa anuncia JCP de R$ 1,00 por ação. Com 17,5% retidos, você recebe R$ 0,82 por ação. Com 200 ações, recebe R$ 165,00.","perguntas":[{"pergunta":"Você tem 500 ações e a empresa anuncia JCP bruto de R$ 0,40 por ação. Quanto cai na conta?","alternativas":["R$ 180,00","R$ 165,00","R$ 200,00","R$ 170,00"],"correta":1,"explicacao":"500 × R$ 0,40 = R$ 200 brutos; menos 17,5% (R$ 35) = R$ 165."},{"pergunta":"Qual é a principal diferença entre JCP e dividendos para o acionista pessoa física comum?","alternativas":["O dividendo paga mais imposto.","Só o JCP é parte do lucro.","O JCP tem imposto retido na fonte; o dividendo, em geral, não.","O JCP é pago só para quem tem ações ON."],"correta":2,"explicacao":"O JCP tem retenção de 17,5%; dividendos são isentos abaixo de R$ 50 mil por mês da mesma empresa."}],"fonte":"Lei Complementar 224/2025 · Guia Suno Dividendos (Tiago Reis)"},{"id":50,"modulo":2,"titulo":"Data-com e data-ex","texto":"Para receber um provento, você precisa ter a ação no fim do pregão da data-com. No dia seguinte, a data-ex, a ação passa a ser negociada sem direito ao provento e o preço costuma cair perto do valor pago. O pagamento cai na conta numa data posterior.","exemplo":"Data-com: dia 10. Quem compra até o dia 10 recebe; quem compra no dia 11 (data-ex), não. Com dividendo de R$ 1, a ação tende a abrir cerca de R$ 1 mais barata no dia 11.","perguntas":[{"pergunta":"A data-com de um dividendo é sexta-feira. Você compra a ação na segunda seguinte. Recebe o dividendo?","alternativas":["Sim, se mantiver a ação por um mês.","Sim, porque comprou antes do pagamento.","Só metade do valor.","Não, precisava ter a ação até o fim da data-com."],"correta":3,"explicacao":"O direito fica com quem tinha a ação no fim do pregão da data-com."},{"pergunta":"Por que comprar uma ação na data-com só para pegar o dividendo não é um ganho garantido?","alternativas":["Porque o preço tende a cair perto do valor do dividendo na data-ex.","Porque o dividendo nunca é pago.","Porque a corretora cobra o dividendo de volta.","Porque o dividendo só é pago para ações ON."],"correta":0,"explicacao":"O valor sai do preço da ação e vai para o seu bolso: o patrimônio fica parecido."}],"fonte":"Guia Suno Dividendos (Tiago Reis)"},{"id":51,"modulo":2,"titulo":"Dividend yield: o rendimento em dividendos","texto":"O dividend yield (DY) mostra quanto uma ação pagou em proventos nos últimos 12 meses em relação ao preço. A conta é: proventos por ação ÷ preço × 100. Ele ajuda a comparar ações pagadoras, mas fala do passado, não garante o futuro.","exemplo":"Uma ação de R$ 25 pagou R$ 1,75 em proventos em 12 meses: DY = 1,75 ÷ 25 = 7,0%.","perguntas":[{"pergunta":"Uma ação custa R$ 40 e pagou R$ 2,40 em 12 meses. Qual é o dividend yield?","alternativas":["4%","6%","2,4%","16,7%"],"correta":1,"explicacao":"2,40 ÷ 40 = 0,06, ou 6%."},{"pergunta":"Se o preço da ação cair e os dividendos continuarem iguais, o DY:","alternativas":["Cai.","Fica igual.","Sobe.","Zera."],"correta":2,"explicacao":"O dividendo fica igual, mas o preço do denominador diminui."}],"fonte":"Guia Suno Dividendos (Tiago Reis)"},{"id":52,"modulo":2,"titulo":"A armadilha do yield alto","texto":"Um DY muito alto pode ser um alerta. Às vezes ele vem de um lucro que não vai se repetir, como a venda de um imóvel, ou de uma queda forte no preço porque o mercado vê problemas na empresa. Antes de comprar, entenda de onde veio o dividendo.","exemplo":"Uma empresa que costumava pagar 5% passa a mostrar DY de 20% porque vendeu uma fábrica e distribuiu o dinheiro. No ano seguinte, sem a venda, o DY volta para perto de 5%.","perguntas":[{"pergunta":"Uma ação aparece com DY de 25% no último ano. Qual é a atitude mais prudente?","alternativas":["Comprar o máximo possível.","Concluir que é a melhor ação da bolsa.","Investigar se esse dividendo vai se repetir.","Ignorar a empresa e olhar só o DY."],"correta":2,"explicacao":"Yield muito acima do normal costuma ter uma explicação que não se repete."},{"pergunta":"Qual destas situações pode inflar o DY de forma enganosa?","alternativas":["Um aumento constante dos lucros.","A queda forte do preço por problemas na empresa.","Um negócio estável há décadas.","Uma empresa sem dívidas."],"correta":1,"explicacao":"Com o preço desabando, o DY sobe mesmo que a empresa esteja piorando."}],"fonte":"Guia Suno Dividendos (Tiago Reis)"},{"id":53,"modulo":2,"titulo":"Payout: quanto do lucro vira dividendo","texto":"Payout é a porcentagem do lucro que a empresa distribui aos acionistas. Um payout de 40% significa que 40% do lucro virou proventos e 60% ficou para reinvestir. Payout alto pode ser ótimo para quem quer renda, mas acima de 100% a empresa está pagando mais do que lucra, o que não se sustenta.","exemplo":"Uma empresa lucrou R$ 10 milhões e distribuiu R$ 6 milhões: payout de 60%. Os outros R$ 4 milhões ficam para crescer.","perguntas":[{"pergunta":"Uma empresa lucrou R$ 50 milhões e pagou R$ 60 milhões em dividendos. O que isso indica?","alternativas":["Payout de 120%, que não se sustenta por muito tempo.","Payout de 60%, saudável.","Que a empresa está crescendo muito.","Payout de 10%."],"correta":0,"explicacao":"Pagar mais do que lucra exige usar caixa ou dívida."},{"pergunta":"Uma empresa com payout de 25% faz o quê com o resto do lucro?","alternativas":["Devolve ao governo.","Paga como JCP obrigatoriamente.","Perde esse valor.","Reinveste no próprio negócio."],"correta":3,"explicacao":"O lucro retido financia expansão, pagamento de dívidas ou reservas."}],"fonte":"Guia Suno Dividendos (Tiago Reis)"},{"id":54,"modulo":2,"titulo":"A bola de neve dos proventos","texto":"Reinvestir os proventos acelera o crescimento da carteira: os dividendos compram mais ações, que pagam mais dividendos, e assim por diante. É o mesmo princípio dos juros compostos. Quem gasta os proventos recebe renda, mas a carteira cresce mais devagar.","exemplo":"R$ 100 mil numa carteira que paga 6% ao ano: reinvestindo tudo por 20 anos, vira R$ 320.713,55. Gastando os proventos, fica em R$ 100 mil, com R$ 120 mil gastos no caminho.","perguntas":[{"pergunta":"No exemplo, por que reinvestir gera muito mais do que gastar os proventos?","alternativas":["Porque os proventos reinvestidos passam a gerar novos proventos.","Porque reinvestir não paga corretagem.","Porque as ações sobem mais quando há reinvestimento.","Porque o governo dá bônus a quem reinveste."],"correta":0,"explicacao":"É o efeito dos juros compostos aplicado aos dividendos."},{"pergunta":"Em qual fase da vida faz mais sentido reinvestir os proventos?","alternativas":["Só quando a bolsa está em alta.","Só depois de se aposentar.","Nunca, o certo é sempre gastar.","Enquanto ainda se está construindo a carteira."],"correta":3,"explicacao":"Na fase de acumulação, reinvestir acelera o crescimento; na de usufruto, a renda é usada."}],"fonte":"O Rei dos Dividendos (Luiz Barsi)"},{"id":55,"modulo":2,"titulo":"A lógica de Luiz Barsi","texto":"Luiz Barsi ficou conhecido por montar, ao longo de décadas, uma carteira de empresas que pagam bons dividendos, reinvestindo os proventos. A ideia central é comprar ações como quem compra um negócio para ter renda, sem se preocupar com as oscilações do dia.","exemplo":"Para um investidor que pensa como Barsi, uma queda de 20% numa boa pagadora de dividendos é chance de comprar mais ações pelo mesmo dinheiro, e não motivo para vender.","perguntas":[{"pergunta":"Uma boa empresa pagadora de dividendos cai 20% sem mudança no negócio. O que um investidor na linha de Barsi tende a fazer?","alternativas":["Vender tudo para evitar mais queda.","Trocar por uma ação que subiu muito.","Ver a chance de comprar mais ações com o mesmo dinheiro.","Esperar a ação voltar ao preço antigo para comprar."],"correta":2,"explicacao":"Com o negócio intacto, o preço menor aumenta a renda que cada real compra."},{"pergunta":"Qual é o foco principal desse método?","alternativas":["Comprar só ações que estão subindo.","Lucrar com operações rápidas.","Construir renda com dividendos ao longo de décadas.","Prever o mercado todo mês."],"correta":2,"explicacao":"A estratégia é de longo prazo, focada na renda passiva."}],"fonte":"O Rei dos Dividendos (Luiz Barsi)"},{"id":56,"modulo":2,"titulo":"BESST: os setores perenes","texto":"BESST é uma sigla para setores que, segundo a lógica de Barsi, oferecem serviços que as pessoas usam em qualquer cenário: Bancos, Energia, Saneamento, Seguros e Telecomunicações. Por terem demanda estável, essas empresas tendem a ter lucros e dividendos mais previsíveis.","exemplo":"Numa crise, as famílias cortam viagens e roupas novas, mas continuam pagando conta de luz, água e celular. É essa estabilidade que o BESST busca.","perguntas":[{"pergunta":"Qual destas empresas se encaixa no BESST?","alternativas":["Uma companhia aérea.","Uma companhia de saneamento.","Uma rede de lojas de roupa.","Uma mineradora."],"correta":1,"explicacao":"Saneamento é o S de BESST: serviço essencial com demanda estável."},{"pergunta":"Por que esses setores são chamados de perenes?","alternativas":["Porque seus serviços continuam sendo usados mesmo em crises.","Porque nunca têm prejuízo.","Porque suas ações nunca caem.","Porque o governo garante os lucros."],"correta":0,"explicacao":"A demanda estável não elimina o risco, mas torna os resultados mais previsíveis."}],"fonte":"O Rei dos Dividendos (Luiz Barsi)"},{"id":57,"modulo":2,"titulo":"Perenes e cíclicos","texto":"Empresas cíclicas acompanham os altos e baixos da economia, como mineração, siderurgia e varejo: lucram muito na alta e sofrem na baixa. Empresas perenes têm resultados mais estáveis. As cíclicas podem render bem, mas exigem atenção ao momento do ciclo.","exemplo":"Uma mineradora pode lucrar o dobro num ano de minério caro e ter prejuízo quando o preço cai. Uma distribuidora de energia tem receitas bem mais parecidas ano a ano.","perguntas":[{"pergunta":"Qual empresa tende a ser mais cíclica?","alternativas":["Uma siderúrgica.","Uma empresa de saneamento.","Uma distribuidora de energia.","Uma seguradora."],"correta":0,"explicacao":"A demanda por aço sobe e desce com a construção e a indústria."},{"pergunta":"Qual cuidado extra pedem as empresas cíclicas?","alternativas":["Evitar qualquer análise de lucros.","Entender em que momento do ciclo a empresa está.","Comprar só em anos de crise econômica.","Nenhum, são iguais às perenes."],"correta":1,"explicacao":"Comprar no auge do ciclo pode significar pagar caro por lucros que vão cair."}],"fonte":"O Rei dos Dividendos (Luiz Barsi)"},{"id":58,"modulo":2,"titulo":"A regra de Bazin","texto":"Décio Bazin propôs um filtro simples: só comprar ações que paguem, de forma consistente, pelo menos 6% ao ano em dividendos. A ideia é exigir uma renda mínima e evitar pagar caro. Ele também recomendava fugir de empresas muito endividadas.","exemplo":"Uma ação que paga R$ 1,20 por ano em dividendos e custa R$ 15 tem DY de 8,0%: passa no filtro. A R$ 25, o DY cai para 4,8% e não passa.","perguntas":[{"pergunta":"Uma ação paga R$ 0,90 por ano e custa R$ 18. Ela passa na regra de Bazin?","alternativas":["Não dá para saber sem o lucro.","Não: o DY é de 5%.","Sim: o DY é de 20%.","Sim: qualquer ação com dividendo passa."],"correta":1,"explicacao":"0,90 ÷ 18 = 5%, abaixo dos 6% exigidos."},{"pergunta":"Além do yield de 6%, o que Bazin recomendava evitar?","alternativas":["Empresas muito endividadas.","Empresas com ações ordinárias.","Empresas que pagam dividendos.","Empresas de energia."],"correta":0,"explicacao":"Dívida alta pode cortar os dividendos no futuro."}],"fonte":"Faça Fortuna com Ações (Décio Bazin)"},{"id":59,"modulo":2,"titulo":"O preço-teto de Bazin","texto":"Do filtro de Bazin sai o preço-teto: o máximo que vale a pena pagar por uma ação para que ela renda 6% ao ano em dividendos. A conta é: dividendo anual por ação ÷ 0,06. Acima desse preço, a ação está cara para essa estratégia.","exemplo":"Uma empresa paga, em média, R$ 1,80 por ação ao ano. Preço-teto = 1,80 ÷ 0,06 = R$ 30,00. A R$ 26 vale a compra; a R$ 35, não.","perguntas":[{"pergunta":"Uma ação paga em média R$ 2,10 por ano em dividendos. Qual é o preço-teto de Bazin?","alternativas":["R$ 35,00","R$ 12,60","R$ 30,00","R$ 21,00"],"correta":0,"explicacao":"2,10 ÷ 0,06 = 35."},{"pergunta":"O preço-teto de uma ação é R$ 20 e ela está cotada a R$ 24. Segundo Bazin:","alternativas":["Ela está cara: o yield ficaria abaixo de 6%.","É uma ótima compra.","O preço-teto não serve para nada.","Ela vai cair para R$ 20 em breve."],"correta":0,"explicacao":"Acima do teto, o dividendo representa menos de 6% do preço."}],"fonte":"Faça Fortuna com Ações (Décio Bazin)"},{"id":60,"modulo":2,"titulo":"Os limites do método Bazin","texto":"O método Bazin usa dividendos passados, e o passado não garante o futuro. Uma empresa em declínio pode ter pago muito e cortar os proventos depois. Por isso, o preço-teto funciona melhor combinado com uma análise do negócio: lucros, dívidas e perspectivas.","exemplo":"Com dividendo médio de R$ 3, o preço-teto é R$ 50. Se a empresa perde um contrato e o dividendo cai para R$ 1,50, o teto vira R$ 25,00: quem pagou R$ 45 pagou caro.","perguntas":[{"pergunta":"Qual é a principal fraqueza do preço-teto de Bazin?","alternativas":["Ele é difícil de calcular.","Ele só funciona para bancos.","Ele exige prever a Selic.","Ele se baseia em dividendos passados, que podem não se repetir."],"correta":3,"explicacao":"Se os dividendos caírem, o preço-teto calculado antes perde validade."},{"pergunta":"Como deixar o uso do preço-teto mais seguro?","alternativas":["Trocar 6% por 2%.","Combinar com a análise de lucros, dívidas e perspectivas da empresa.","Comprar sempre que estiver abaixo do teto, sem olhar mais nada.","Usar só o dividendo do último mês."],"correta":1,"explicacao":"Entender o negócio ajuda a saber se o dividendo é sustentável."}],"fonte":"Faça Fortuna com Ações (Décio Bazin)"},{"id":61,"modulo":2,"titulo":"Não ponha todos os ovos na mesma cesta","texto":"Diversificar é espalhar o dinheiro em ativos que não sobem e descem juntos: renda fixa, ações de setores diferentes, fundos imobiliários, investimentos no exterior. O objetivo não é ganhar mais, e sim evitar que um único problema leve boa parte do patrimônio.","exemplo":"Uma carteira 100% em uma ação que cai 50% perde metade do valor. Uma carteira com 10% nessa ação e o resto em ativos que ficaram estáveis perde só 5%.","perguntas":[{"pergunta":"Qual carteira é mais diversificada?","alternativas":["Três criptomoedas diferentes.","Todo o dinheiro numa empresa muito sólida.","Cinco ações de bancos diferentes.","Renda fixa, ações de vários setores e fundos imobiliários."],"correta":3,"explicacao":"Ativos de tipos diferentes reagem de forma diferente aos mesmos acontecimentos."},{"pergunta":"Qual é o principal objetivo da diversificação?","alternativas":["Pagar menos imposto.","Garantir o maior retorno possível.","Eliminar todo o risco.","Reduzir o estrago de um problema isolado."],"correta":3,"explicacao":"Diversificar não elimina o risco, mas evita que um único tombo seja desastroso."}],"fonte":"O Investidor Inteligente (Benjamin Graham)"},{"id":62,"modulo":2,"titulo":"Oscilar não é perder","texto":"Volatilidade é o quanto um ativo sobe e desce no caminho. Ações são voláteis: podem cair 30% num ano e subir 40% no seguinte. A perda só se torna real quando você vende na baixa. Por isso, o prazo e o estômago do investidor importam tanto quanto o ativo.","exemplo":"Quem investiu R$ 10.000 numa ação que caiu para R$ 7.000 e não vendeu ainda não perdeu R$ 3.000 de fato. Se vender nesse momento, a perda vira real.","perguntas":[{"pergunta":"Sua ação caiu 25%, mas a empresa segue lucrando bem. Quando o prejuízo vira real?","alternativas":["Imediatamente, no extrato.","Quando a empresa anunciar o próximo lucro.","No fim do ano, automaticamente.","Só se você vender a ação."],"correta":3,"explicacao":"Enquanto você não vende, é uma oscilação de preço."},{"pergunta":"Para quem a alta volatilidade é um problema maior?","alternativas":["Para quem nunca olha o saldo.","Para quem investe por 30 anos.","Para quem vai precisar do dinheiro em pouco tempo.","Para quem reinveste os dividendos."],"correta":2,"explicacao":"No curto prazo, pode não dar tempo de esperar a recuperação."}],"fonte":"Investindo em Ações no Longo Prazo (Jeremy Siegel)"},{"id":63,"modulo":2,"titulo":"ETF: a cesta pronta","texto":"Um ETF é um fundo negociado na bolsa que replica um índice. Com uma única compra, você leva uma cesta com dezenas de empresas. É uma forma barata e simples de diversificar, sem precisar escolher ação por ação.","exemplo":"Comprar uma cota de um ETF que segue o Ibovespa equivale a ter um pedacinho de dezenas das maiores empresas da bolsa, na proporção do índice.","perguntas":[{"pergunta":"Qual é a principal vantagem de um ETF de índice?","alternativas":["Diversificar com uma única compra.","Ser isento de qualquer imposto.","Não ter oscilação de preço.","Garantir lucro acima do índice."],"correta":0,"explicacao":"O ETF já traz a cesta de empresas do índice."},{"pergunta":"Você quer investir no conjunto das maiores empresas brasileiras sem escolher ações. O que comprar?","alternativas":["Um título do Tesouro Prefixado.","Um ETF que replica o Ibovespa.","Uma LCA.","Ações de uma única grande empresa."],"correta":1,"explicacao":"O ETF de Ibovespa entrega exatamente essa exposição."}],"fonte":"B3: https://www.b3.com.br"},{"id":64,"modulo":2,"titulo":"O que é o Ibovespa","texto":"O Ibovespa é o principal índice da bolsa brasileira. Ele mostra o desempenho de uma carteira com as ações mais negociadas da B3, cada uma com um peso. Quando o noticiário diz que \"a bolsa subiu 2%\", geralmente está falando do Ibovespa.","exemplo":"Se o Ibovespa sai de 120 mil para 132 mil pontos em um ano, a alta é de (132 − 120) ÷ 120 = 10%.","perguntas":[{"pergunta":"O Ibovespa foi de 125 mil para 100 mil pontos. Qual foi a variação?","alternativas":["Queda de 25 mil por cento.","Queda de 20%.","Queda de 25%.","Alta de 20%."],"correta":1,"explicacao":"(100 − 125) ÷ 125 = −20%."},{"pergunta":"O que o Ibovespa representa?","alternativas":["O preço do dólar.","A inflação do mês.","A taxa de juros do país.","O desempenho das ações mais negociadas da B3."],"correta":3,"explicacao":"É um índice que funciona como termômetro da bolsa brasileira."}],"fonte":"B3: https://www.b3.com.br"},{"id":65,"modulo":2,"titulo":"Fundo imobiliário: ser dono de imóveis em pedaços","texto":"Um fundo imobiliário (FII) junta o dinheiro de muitos investidores para aplicar em imóveis ou em títulos do setor. Você compra cotas na bolsa e recebe, em geral todo mês, parte dos aluguéis ou juros. É uma forma de investir em imóveis com pouco dinheiro.","exemplo":"Um FII com cota de R$ 100 paga R$ 0,85 por mês. Com 200 cotas (R$ 20 mil), você recebe R$ 170,00 por mês, ou R$ 2.040,00 por ano.","perguntas":[{"pergunta":"Você tem 300 cotas de um FII que paga R$ 0,70 por cota no mês. Quanto recebe?","alternativas":["R$ 2.100 por mês.","R$ 210 por mês.","R$ 21 por mês.","R$ 70 por mês."],"correta":1,"explicacao":"300 × R$ 0,70 = R$ 210."},{"pergunta":"Qual é uma vantagem do FII em relação a comprar um imóvel?","alternativas":["Não ter nenhum risco.","Ter o aluguel garantido pelo governo.","Nunca oscilar de preço.","Investir com pouco dinheiro e vender cotas com facilidade na bolsa."],"correta":3,"explicacao":"As cotas custam pouco e são negociadas na bolsa, ao contrário de um imóvel inteiro."}],"fonte":"Guia Suno Dividendos (Tiago Reis) · B3: https://www.b3.com.br"},{"id":66,"modulo":2,"titulo":"Tijolo ou papel?","texto":"FIIs de tijolo são donos de imóveis físicos, como shoppings, galpões e escritórios, e vivem de aluguéis. FIIs de papel investem em títulos de dívida do setor imobiliário, como CRIs, e vivem de juros. Os de papel tendem a acompanhar mais os juros e a inflação.","exemplo":"Um FII de galpões recebe aluguel das empresas que usam os galpões. Um FII de papel recebe juros de CRIs, muitas vezes corrigidos pela inflação.","perguntas":[{"pergunta":"Um FII investe principalmente em CRIs. Que tipo de FII ele é?","alternativas":["De títulos do Tesouro.","De ações.","De papel.","De tijolo."],"correta":2,"explicacao":"CRIs são títulos de dívida imobiliária, a base dos FIIs de papel."},{"pergunta":"De onde vem a renda de um FII de shoppings?","alternativas":["Dos aluguéis pagos pelas lojas.","Do Tesouro Selic.","Dos juros de títulos públicos.","Da venda de ações."],"correta":0,"explicacao":"FIIs de tijolo vivem dos aluguéis dos imóveis que possuem."}],"fonte":"Guia Suno Dividendos (Tiago Reis)"},{"id":67,"modulo":2,"titulo":"Os rendimentos isentos dos FIIs","texto":"Os rendimentos mensais de FIIs negociados na bolsa são isentos de IR para pessoa física, desde que o fundo e o investidor cumpram algumas condições previstas em lei. Já o lucro na venda das cotas paga 20% de IR, sem a isenção de R$ 20 mil que existe para ações.","exemplo":"Você comprou cotas por R$ 10.000 e vendeu por R$ 12.000: o lucro de R$ 2.000 paga R$ 400 de IR (20%). Os rendimentos recebidos no caminho foram isentos.","perguntas":[{"pergunta":"Você vendeu cotas de FII com R$ 1.500 de lucro, num mês em que suas vendas somaram R$ 9.000. Paga IR?","alternativas":["Não, vendas abaixo de R$ 20 mil são isentas.","Sim, R$ 300 (20% do lucro).","Não, FIIs são sempre isentos.","Sim, R$ 225 (15%)."],"correta":1,"explicacao":"A isenção de R$ 20 mil vale para ações, não para FIIs: 20% × R$ 1.500 = R$ 300."},{"pergunta":"O que é isento de IR para a pessoa física que investe em FIIs na bolsa, cumpridas as condições?","alternativas":["Qualquer valor acima de R$ 20 mil.","Os rendimentos mensais distribuídos.","O lucro na venda das cotas.","Nada, tudo é tributado."],"correta":1,"explicacao":"Os rendimentos são isentos; o ganho na venda paga 20%."}],"fonte":"Receita Federal: https://www.gov.br/receitafederal"},{"id":68,"modulo":2,"titulo":"Vacância: o imóvel vazio","texto":"Vacância é a parte dos imóveis de um FII que está sem inquilino. Imóvel vazio não paga aluguel, então vacância alta reduz os rendimentos. Ao analisar um FII de tijolo, observe a vacância e se ela está subindo ou caindo.","exemplo":"Um FII tem 10 imóveis iguais e 2 estão vazios: vacância de 20%. Se cada imóvel rende R$ 100 mil por mês, a receita cai de R$ 1 milhão para R$ 800 mil.","perguntas":[{"pergunta":"Um FII de lajes corporativas viu a vacância subir de 5% para 25%. O que tende a acontecer?","alternativas":["Os rendimentos tendem a subir.","Os rendimentos mensais tendem a cair.","O fundo passa a ser de papel.","Nada, a vacância não afeta a renda."],"correta":1,"explicacao":"Mais imóveis vazios significam menos aluguel entrando."},{"pergunta":"O que significa vacância de 0%?","alternativas":["O fundo não paga rendimentos.","Os imóveis estão à venda.","Todos os imóveis estão alugados.","O fundo não tem imóveis."],"correta":2,"explicacao":"Sem área vazia, todo o espaço está gerando aluguel."}],"fonte":"Guia Suno Dividendos (Tiago Reis)"},{"id":69,"modulo":2,"titulo":"P/VP: a cota está cara ou barata?","texto":"O P/VP compara o preço da cota com o valor patrimonial, que é o valor dos ativos do fundo dividido pelo número de cotas. P/VP abaixo de 1 indica que a cota custa menos que o patrimônio que representa; acima de 1, mais. É um ponto de partida, não uma conclusão.","exemplo":"Cota a R$ 90 e valor patrimonial de R$ 100 por cota: P/VP = 90 ÷ 100 = 0,90. Você paga R$ 90 por R$ 100 em imóveis, segundo a avaliação.","perguntas":[{"pergunta":"Uma cota custa R$ 115 e o valor patrimonial por cota é R$ 100. Qual é o P/VP?","alternativas":["1: preço justo.","15.","0,87: a cota está com desconto.","1,15: você paga mais do que o patrimônio avaliado."],"correta":3,"explicacao":"115 ÷ 100 = 1,15."},{"pergunta":"Por que um P/VP baixo não garante uma boa compra?","alternativas":["Porque o desconto pode refletir problemas, como vacância alta.","Porque P/VP baixo significa imposto maior.","Porque o P/VP é sempre igual a 1.","Porque o P/VP só serve para ações."],"correta":0,"explicacao":"O mercado pode estar descontando riscos que a avaliação não mostra."}],"fonte":"Guia Suno Dividendos (Tiago Reis)"},{"id":70,"modulo":2,"titulo":"IR na venda de ações","texto":"Lucro na venda de ações paga 15% de IR. Mas se a soma das suas vendas de ações no mês ficar em até R$ 20 mil, o lucro é isento. Essa isenção não vale para ETFs nem FIIs. O imposto, quando devido, é pago por você até o fim do mês seguinte, com o DARF.","exemplo":"Você vendeu R$ 15 mil em ações no mês, com R$ 3 mil de lucro: isento. Se tivesse vendido R$ 25 mil com o mesmo lucro, pagaria R$ 450 (15%).","perguntas":[{"pergunta":"Em março, você vendeu R$ 18 mil em ações com lucro de R$ 4 mil. Quanto de IR?","alternativas":["R$ 600 (15%).","Nada: as vendas ficaram abaixo de R$ 20 mil.","R$ 2.700 (15% das vendas).","R$ 800 (20%)."],"correta":1,"explicacao":"Com vendas de até R$ 20 mil no mês, o lucro em ações é isento."},{"pergunta":"A isenção de R$ 20 mil por mês vale para quais ativos?","alternativas":["Para todos os ativos da bolsa.","Só para ETFs.","Só para FIIs.","Para ações, mas não para ETFs nem FIIs."],"correta":3,"explicacao":"ETFs e FIIs pagam IR sobre o lucro em qualquer valor de venda."}],"fonte":"Receita Federal: https://www.gov.br/receitafederal"},{"id":71,"modulo":2,"titulo":"Day trade: mais imposto, mais risco","texto":"Day trade é comprar e vender o mesmo ativo no mesmo dia. O lucro paga 20% de IR, sem isenção de R$ 20 mil. Além do imposto maior, operações rápidas dependem de prever movimentos de curtíssimo prazo, o que é muito difícil, e somam custos a cada operação.","exemplo":"Lucro de R$ 1.000 numa operação de day trade paga R$ 200 de IR. O mesmo lucro numa venda comum de ações, abaixo de R$ 20 mil no mês, seria isento.","perguntas":[{"pergunta":"Você comprou e vendeu ações no mesmo dia com R$ 500 de lucro. Qual é o IR?","alternativas":["R$ 75 (15%).","R$ 100 (20%), sem isenção.","Isento, porque o valor é pequeno.","R$ 50 (10%)."],"correta":1,"explicacao":"No day trade, a alíquota é de 20% e não há isenção."},{"pergunta":"Por que o day trade costuma ser arriscado para iniciantes?","alternativas":["Porque é proibido para pessoa física.","Porque as ações não oscilam no mesmo dia.","Porque não tem imposto.","Porque depende de prever movimentos de curtíssimo prazo e soma custos."],"correta":3,"explicacao":"Prever o curto prazo é difícil e cada operação tem custo."}],"fonte":"Receita Federal: https://www.gov.br/receitafederal"},{"id":72,"modulo":2,"titulo":"Prejuízo também conta","texto":"Prejuízos em vendas de ações podem ser descontados de lucros futuros, reduzindo o IR. Para isso, é preciso declarar o prejuízo. Prejuízos de day trade só compensam lucros de day trade, e os de operações comuns, lucros de operações comuns.","exemplo":"Em maio você teve R$ 2.000 de prejuízo. Em junho, R$ 5.000 de lucro tributável. O IR de junho é sobre R$ 3.000: R$ 450 em vez de R$ 750.","perguntas":[{"pergunta":"Você teve R$ 1.000 de prejuízo num mês e R$ 4.000 de lucro tributável no seguinte. Sobre quanto paga IR?","alternativas":["R$ 4.000","R$ 5.000","R$ 3.000","R$ 1.000"],"correta":2,"explicacao":"O prejuízo de R$ 1.000 é descontado do lucro de R$ 4.000."},{"pergunta":"Um prejuízo de day trade pode ser usado para reduzir o IR de quais lucros?","alternativas":["Dos rendimentos de FIIs.","Apenas de lucros de day trade.","De qualquer lucro.","Apenas de operações comuns."],"correta":1,"explicacao":"Day trade e operações comuns têm compensações separadas."}],"fonte":"Receita Federal: https://www.gov.br/receitafederal"},{"id":73,"modulo":2,"titulo":"Os custos que comem o rendimento","texto":"Investir tem custos: corretagem (muitas corretoras zeraram), emolumentos da B3, taxa de administração de fundos e ETFs e, em alguns casos, taxa de custódia. Custos pequenos parecem inofensivos, mas, como os juros compostos, pesam muito ao longo de décadas.","exemplo":"R$ 100 mil rendendo 10% ao ano por 30 anos viram R$ 1.744.940,23. Com 2% de taxa ao ano (rendendo 8%), viram R$ 1.006.265,69.","perguntas":[{"pergunta":"Dois ETFs replicam o mesmo índice. Um cobra 0,1% ao ano e o outro 0,6%. No longo prazo:","alternativas":["O de 0,1% tende a render mais, pela diferença de custo.","Os dois rendem exatamente igual.","Não faz diferença em 30 anos.","O de 0,6% rende mais, porque é melhor gerido."],"correta":0,"explicacao":"Com a mesma carteira, a taxa menor deixa mais rendimento para você."},{"pergunta":"No exemplo, quanto a taxa de 2% ao ano custou em 30 anos?","alternativas":["Mais de R$ 700 mil.","R$ 60 mil.","R$ 2 mil.","Nada, porque a taxa é pequena."],"correta":0,"explicacao":"A diferença entre os dois resultados passa de R$ 700 mil."}],"fonte":"Investindo em Ações no Longo Prazo (Jeremy Siegel)"},{"id":74,"modulo":2,"titulo":"Rebalancear a carteira","texto":"Com o tempo, os ativos que sobem passam a pesar mais na carteira, e ela fica mais arriscada do que você planejou. Rebalancear é voltar às proporções escolhidas, usando os novos aportes no que ficou para trás ou vendendo um pouco do que subiu.","exemplo":"Você definiu 50% em renda fixa e 50% em ações. As ações subiram e foram para 65%. Rebalancear é direcionar os próximos aportes para a renda fixa até voltar a 50%.","perguntas":[{"pergunta":"Sua carteira ideal é 70% renda fixa e 30% ações, mas virou 55% e 45%. O que fazer?","alternativas":["Aportar mais em renda fixa até voltar às proporções.","Comprar mais ações, porque estão subindo.","Vender toda a renda fixa.","Nada, a carteira se ajusta sozinha."],"correta":0,"explicacao":"Rebalancear devolve a carteira ao nível de risco que você escolheu."},{"pergunta":"Qual efeito o rebalanceamento costuma ter?","alternativas":["Eliminar todo o risco.","Aumentar sempre a parte em ações.","Vender um pouco do que subiu e comprar o que ficou para trás.","Comprar só o que está subindo."],"correta":2,"explicacao":"Na prática, isso leva a vender caro e comprar barato."}],"fonte":"O Investidor Inteligente (Benjamin Graham)"},{"id":75,"modulo":2,"titulo":"A paciência como estratégia","texto":"Os estudos de longo prazo, como os de Jeremy Siegel, mostram que, ao longo de décadas, ações bem diversificadas tendem a superar a renda fixa, apesar de quedas fortes no caminho. Quem vende no pânico costuma realizar perdas que teriam sido recuperadas.","exemplo":"No Brasil, o Ibovespa caiu cerca de 30% em março de 2020. Quem vendeu ali realizou a perda; quem manteve viu o índice voltar ao nível anterior à pandemia em menos de um ano.","perguntas":[{"pergunta":"A bolsa caiu 30% num mês e seu plano é de 20 anos. Qual atitude combina com a estratégia de longo prazo?","alternativas":["Vender tudo para não perder mais.","Trocar tudo por cripto.","Parar de investir para sempre.","Manter o plano e, se possível, seguir aportando."],"correta":3,"explicacao":"No longo prazo, quedas costumam ser temporárias; vender transforma a oscilação em perda."},{"pergunta":"O que os estudos de longo prazo de Siegel sugerem sobre ações?","alternativas":["Que só funcionam nos Estados Unidos.","Que nunca têm quedas fortes.","Que rendem menos que a poupança.","Que, em décadas, tendem a superar a renda fixa, apesar das quedas."],"correta":3,"explicacao":"O retorno maior vem junto com mais oscilação no caminho."}],"fonte":"Investindo em Ações no Longo Prazo (Jeremy Siegel)"},{"id":76,"modulo":3,"titulo":"Preço é o que você paga","texto":"Preço é quanto uma ação custa hoje na bolsa. Valor é quanto a empresa realmente vale, pelo que ela consegue gerar de lucro no futuro. Os dois podem ficar muito distantes. Investir bem é procurar situações em que o preço está abaixo do valor.","exemplo":"Uma empresa que deve gerar o equivalente a R$ 50 por ação em lucros futuros, trazidos a valor de hoje, está sendo vendida a R$ 35. O preço está abaixo do valor estimado.","perguntas":[{"pergunta":"Uma ação subiu 40% no ano, mas os lucros da empresa caíram. O que é mais provável?","alternativas":["O valor da empresa subiu 40%.","O preço e o valor sempre andam juntos.","A empresa ficou mais barata.","O preço se distanciou do valor, ficando mais caro."],"correta":3,"explicacao":"Preço sobe por expectativa ou euforia; valor depende do que o negócio gera."},{"pergunta":"Por que preço e valor podem ficar distantes?","alternativas":["Porque o valor muda todo dia.","Porque a bolsa calcula o valor errado de propósito.","Porque só o governo define o valor.","Porque o preço reflete emoções e expectativas do mercado no curto prazo."],"correta":3,"explicacao":"No curto prazo, o mercado reage a medo e euforia; no longo, o valor tende a pesar."}],"fonte":"O Investidor Inteligente (Benjamin Graham)"},{"id":77,"modulo":3,"titulo":"O Senhor Mercado","texto":"Graham comparou o mercado a um sócio de humor instável, o Senhor Mercado, que todo dia oferece comprar sua parte ou vender a dele. Às vezes está eufórico e pede caro; às vezes, deprimido, e vende barato. Você não é obrigado a aceitar: pode aproveitar quando ele exagera.","exemplo":"Numa crise, o Senhor Mercado oferece por R$ 20 ações de uma empresa sólida que valiam R$ 35 meses antes, sem que o negócio tenha piorado tanto.","perguntas":[{"pergunta":"Segundo a metáfora do Senhor Mercado, como agir quando ele está em pânico e vende barato?","alternativas":["Avaliar se é uma boa oportunidade de compra.","Parar de olhar a bolsa para sempre.","Aceitar qualquer preço que ele ofereça.","Vender junto com ele para não perder mais."],"correta":0,"explicacao":"O pânico do mercado pode criar preços abaixo do valor."},{"pergunta":"Qual é a principal lição da metáfora?","alternativas":["O mercado está sempre certo.","O preço do dia é o valor da empresa.","O mercado oferece preços; cabe a você decidir se aceita.","É preciso negociar todos os dias."],"correta":2,"explicacao":"Você não precisa seguir o humor do mercado, só aproveitar seus exageros."}],"fonte":"O Investidor Inteligente (Benjamin Graham)"},{"id":78,"modulo":3,"titulo":"Fundamentalista ou técnica?","texto":"A análise fundamentalista estuda o negócio: lucros, dívidas, setor, gestão, para estimar quanto a empresa vale. A análise técnica estuda gráficos de preço e volume para tentar prever movimentos de curto prazo. Para quem investe pensando em anos, a fundamentalista é a base.","exemplo":"Um analista fundamentalista olha o lucro crescendo 15% ao ano e a dívida controlada. Um analista técnico olha se o preço rompeu uma linha no gráfico da semana.","perguntas":[{"pergunta":"Você quer escolher empresas para manter por 10 anos. Qual análise é a base?","alternativas":["A que olha só a variação do dia.","Nenhuma, basta sorte.","A técnica, que estuda gráficos.","A fundamentalista, que estuda o negócio."],"correta":3,"explicacao":"No longo prazo, o que sustenta o preço são os resultados da empresa."},{"pergunta":"O que a análise técnica tenta fazer?","alternativas":["Calcular o valor justo da empresa.","Medir a dívida da empresa.","Ler o balanço patrimonial.","Prever movimentos de preço a partir de gráficos."],"correta":3,"explicacao":"Ela trabalha com padrões de preço e volume, não com os resultados do negócio."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":79,"modulo":3,"titulo":"O balanço patrimonial","texto":"O balanço mostra, numa data, o que a empresa tem (ativos), o que deve (passivos) e o que sobra para os sócios (patrimônio líquido). A regra que sempre fecha é: ativo = passivo + patrimônio líquido.","exemplo":"Uma empresa tem R$ 500 milhões em ativos e deve R$ 300 milhões. O patrimônio líquido é R$ 500 − R$ 300 = R$ 200 milhões.","perguntas":[{"pergunta":"Uma empresa tem R$ 800 milhões em ativos e R$ 500 milhões em passivos. Qual é o patrimônio líquido?","alternativas":["R$ 800 milhões.","R$ 300 milhões.","R$ 500 milhões.","R$ 1,3 bilhão."],"correta":1,"explicacao":"PL = ativo − passivo = 800 − 500 = 300."},{"pergunta":"O que representa o patrimônio líquido?","alternativas":["O que pertence aos sócios depois de pagar todas as dívidas.","O dinheiro em caixa.","O lucro do ano.","O valor de mercado das ações."],"correta":0,"explicacao":"É a diferença entre tudo que a empresa tem e tudo que ela deve."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":80,"modulo":3,"titulo":"Valor patrimonial por ação (VPA)","texto":"O VPA divide o patrimônio líquido pelo número de ações. Ele mostra quanto do patrimônio contábil cabe a cada ação. É a base do indicador P/VP e da fórmula de Graham.","exemplo":"Patrimônio líquido de R$ 2 bilhões e 500 milhões de ações: VPA = 2.000 ÷ 500 = R$ 4,00 por ação.","perguntas":[{"pergunta":"PL de R$ 3 bilhões e 1,5 bilhão de ações. Qual é o VPA?","alternativas":["R$ 0,50","R$ 1,50","R$ 4,50","R$ 2,00"],"correta":3,"explicacao":"3.000 ÷ 1.500 = 2."},{"pergunta":"O que o VPA representa?","alternativas":["A parte do patrimônio líquido que cabe a cada ação.","O dividendo anual por ação.","O preço justo da ação.","O lucro de cada ação."],"correta":0,"explicacao":"É o patrimônio contábil dividido pelo número de ações."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":81,"modulo":3,"titulo":"A DRE: do faturamento ao lucro","texto":"A Demonstração do Resultado (DRE) mostra o caminho do dinheiro num período: começa na receita, desconta os custos e chega ao lucro bruto; desconta as despesas e chega ao lucro operacional; desconta juros e impostos e chega ao lucro líquido.","exemplo":"Receita de R$ 1.000 − custos de R$ 600 = lucro bruto de R$ 400. − despesas de R$ 250 = lucro operacional de R$ 150. − juros e IR de R$ 50 = lucro líquido de R$ 100.","perguntas":[{"pergunta":"Receita de R$ 2.000, custos de R$ 1.200 e despesas de R$ 500. Qual é o lucro operacional?","alternativas":["R$ 1.500","R$ 300","R$ 800","R$ 700"],"correta":1,"explicacao":"Lucro bruto = 2.000 − 1.200 = 800; operacional = 800 − 500 = 300."},{"pergunta":"Qual linha da DRE vem por último?","alternativas":["Os custos.","O lucro líquido.","O lucro bruto.","A receita."],"correta":1,"explicacao":"Depois de todos os custos, despesas, juros e impostos, sobra o lucro líquido."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":82,"modulo":3,"titulo":"EBITDA: o lucro operacional antes dos ajustes","texto":"O EBITDA é o lucro antes de juros, impostos, depreciação e amortização. Ele aproxima o caixa que a operação gera, sem a influência da dívida e dos impostos. É útil para comparar empresas, mas ignora que máquinas precisam ser trocadas: depreciação é custo real no longo prazo.","exemplo":"Lucro operacional de R$ 150 milhões mais R$ 50 milhões de depreciação: EBITDA de R$ 200 milhões.","perguntas":[{"pergunta":"Lucro operacional de R$ 80 milhões e depreciação de R$ 30 milhões. Qual é o EBITDA?","alternativas":["R$ 50 milhões.","R$ 2,4 bilhões.","R$ 80 milhões.","R$ 110 milhões."],"correta":3,"explicacao":"EBITDA = lucro operacional + depreciação e amortização = 80 + 30."},{"pergunta":"Qual é uma limitação do EBITDA?","alternativas":["Ser igual ao lucro líquido.","Incluir os juros da dívida.","Não poder ser comparado entre empresas.","Ignorar que equipamentos se desgastam e precisam ser repostos."],"correta":3,"explicacao":"Depreciação parece só contábil, mas representa investimentos que voltarão a ser necessários."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":83,"modulo":3,"titulo":"Margens: quanto sobra de cada real","texto":"As margens mostram quanto sobra de cada real vendido. Margem bruta = lucro bruto ÷ receita; margem operacional = lucro operacional ÷ receita; margem líquida = lucro líquido ÷ receita. Margens altas e estáveis costumam indicar vantagem competitiva.","exemplo":"Receita de R$ 1.000, lucro bruto de R$ 400, operacional de R$ 150 e líquido de R$ 100: margens de 40%, 15% e 10%.","perguntas":[{"pergunta":"Uma empresa faturou R$ 500 milhões e teve lucro líquido de R$ 40 milhões. Qual é a margem líquida?","alternativas":["4%","12,5%","8%","40%"],"correta":2,"explicacao":"40 ÷ 500 = 0,08."},{"pergunta":"Duas empresas do mesmo setor: uma tem margem líquida de 20% e a outra, 5%. O que isso sugere?","alternativas":["A primeira transforma vendas em lucro com mais eficiência.","As duas são iguais.","A segunda é mais lucrativa.","A primeira vende menos."],"correta":0,"explicacao":"De cada R$ 100 vendidos, uma fica com R$ 20 e a outra com R$ 5."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":84,"modulo":3,"titulo":"ROE: o retorno do sócio","texto":"O ROE mede o retorno sobre o patrimônio líquido: lucro líquido ÷ patrimônio líquido. Ele responde: quanto a empresa lucra para cada real dos sócios? ROE alto e consistente é bom sinal, mas confira se não vem de dívida excessiva.","exemplo":"Lucro líquido de R$ 100 milhões e patrimônio líquido de R$ 500 milhões: ROE = 100 ÷ 500 = 20% ao ano.","perguntas":[{"pergunta":"Lucro líquido de R$ 60 milhões e patrimônio líquido de R$ 400 milhões. Qual é o ROE?","alternativas":["40%","15%","24%","6,7%"],"correta":1,"explicacao":"60 ÷ 400 = 0,15."},{"pergunta":"Por que um ROE muito alto merece atenção?","alternativas":["Porque é sempre um erro contábil.","Porque significa prejuízo.","Porque pode vir de dívida alta, que reduz o patrimônio.","Porque é proibido acima de 20%."],"correta":2,"explicacao":"Com pouco patrimônio e muita dívida, o ROE sobe, mas o risco também."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":85,"modulo":3,"titulo":"ROA e ROIC","texto":"O ROA divide o lucro pelo total de ativos e mostra quão bem a empresa usa tudo o que tem. O ROIC compara o lucro operacional com todo o capital investido, de sócios e credores. Empresas boas têm ROIC acima do seu custo de capital: criam valor.","exemplo":"Lucro líquido de R$ 100 milhões e ativos de R$ 1 bilhão: ROA de 10%. Se o ROIC é de 18% e o capital custa 12%, a empresa cria valor.","perguntas":[{"pergunta":"Uma empresa tem ROIC de 8% e custo de capital de 12%. O que isso indica?","alternativas":["Ela destrói valor: rende menos do que o capital custa.","Ela cria muito valor.","Ela paga muitos dividendos.","Ela não tem dívidas."],"correta":0,"explicacao":"Investir capital que custa 12% para obter 8% reduz valor."},{"pergunta":"Lucro líquido de R$ 30 milhões e ativos de R$ 600 milhões. Qual é o ROA?","alternativas":["3%","20%","5%","50%"],"correta":2,"explicacao":"30 ÷ 600 = 0,05."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":86,"modulo":3,"titulo":"Quanto a empresa deve?","texto":"Um indicador comum de endividamento é dívida líquida ÷ EBITDA. Dívida líquida é a dívida menos o caixa. O resultado mostra quantos anos de EBITDA seriam necessários para pagar a dívida. Acima de 3 vezes, costuma acender um alerta, dependendo do setor.","exemplo":"Dívida de R$ 800 milhões, caixa de R$ 200 milhões e EBITDA de R$ 200 milhões: dívida líquida de R$ 600 milhões ÷ 200 = 3 vezes.","perguntas":[{"pergunta":"Dívida de R$ 1 bilhão, caixa de R$ 400 milhões e EBITDA de R$ 300 milhões. Qual é a dívida líquida/EBITDA?","alternativas":["0,5 vez.","4,7 vezes.","3,3 vezes.","2 vezes."],"correta":3,"explicacao":"(1.000 − 400) ÷ 300 = 2."},{"pergunta":"Por que dívida alta preocupa quem investe em dividendos?","alternativas":["Porque o lucro vai para os juros e pode faltar para os acionistas.","Porque empresas endividadas não podem ter ações.","Porque dívida aumenta os dividendos.","Porque a dívida é paga pelos acionistas."],"correta":0,"explicacao":"Quanto mais juros, menos lucro sobra para distribuir."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":87,"modulo":3,"titulo":"Lucro por ação (LPA)","texto":"O LPA divide o lucro líquido pelo número de ações. Ele mostra quanto do lucro cabe a cada ação. Acompanhar o LPA ao longo dos anos revela se a empresa está crescendo de verdade para o acionista, inclusive quando emite novas ações.","exemplo":"Lucro líquido de R$ 100 milhões e 50 milhões de ações: LPA = R$ 2,00. Se a empresa emitir mais 50 milhões de ações e o lucro não mudar, o LPA cai para R$ 1,00.","perguntas":[{"pergunta":"O lucro de uma empresa subiu 20%, mas ela dobrou o número de ações. O que aconteceu com o LPA?","alternativas":["Ficou igual.","Caiu 40%.","Subiu 20%.","Dobrou."],"correta":1,"explicacao":"LPA novo = 1,2 ÷ 2 = 0,6 do anterior: queda de 40%."},{"pergunta":"Lucro líquido de R$ 45 milhões e 30 milhões de ações. Qual é o LPA?","alternativas":["R$ 75,00","R$ 0,67","R$ 1,50","R$ 15,00"],"correta":2,"explicacao":"45 ÷ 30 = 1,5."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":88,"modulo":3,"titulo":"P/L: quantos anos de lucro","texto":"O P/L divide o preço da ação pelo lucro por ação. Ele indica quantos anos de lucro, mantido o nível atual, seriam necessários para \"pagar\" o preço. P/L baixo pode indicar ação barata ou problemas; P/L alto, expectativa de crescimento ou ação cara.","exemplo":"Ação a R$ 20 e LPA de R$ 2: P/L = 10. Você paga 10 anos do lucro atual por cada ação.","perguntas":[{"pergunta":"Ação a R$ 36 e lucro por ação de R$ 3. Qual é o P/L?","alternativas":["12","33","108","0,08"],"correta":0,"explicacao":"36 ÷ 3 = 12."},{"pergunta":"Uma empresa tem P/L de 4, muito abaixo do setor. O que é prudente concluir?","alternativas":["Pode estar barata ou ter problemas: é preciso investigar.","Está certamente barata.","O P/L não diz nada.","Está certamente cara."],"correta":0,"explicacao":"P/L muito baixo às vezes reflete riscos que o mercado já enxerga."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":89,"modulo":3,"titulo":"PEG: o P/L ajustado ao crescimento","texto":"O PEG divide o P/L pela taxa de crescimento anual do lucro. Ele ajusta o P/L ao crescimento: um P/L alto pode ser razoável se o lucro cresce rápido. PEG perto de 1 costuma ser visto como equilibrado; abaixo de 1, atraente.","exemplo":"Empresa A: P/L 15 e crescimento de 10% ao ano, PEG = 1,5. Empresa B: P/L 20 e crescimento de 25%, PEG = 0,8. A B parece mais atraente, apesar do P/L maior.","perguntas":[{"pergunta":"P/L de 18 e lucro crescendo 12% ao ano. Qual é o PEG?","alternativas":["6","1,5","216","0,67"],"correta":1,"explicacao":"18 ÷ 12 = 1,5."},{"pergunta":"Por que uma ação com P/L alto pode ter PEG baixo?","alternativas":["Porque a empresa não tem dívidas.","Porque o lucro está crescendo muito rápido.","Porque o PEG ignora o preço.","Porque o lucro está caindo."],"correta":1,"explicacao":"Crescimento alto no denominador reduz o PEG."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":90,"modulo":3,"titulo":"P/VP nas ações","texto":"O P/VP divide o preço da ação pelo valor patrimonial por ação. P/VP de 1,2 significa pagar R$ 1,20 por cada R$ 1 de patrimônio contábil. Para bancos e empresas com muitos ativos físicos ele é muito usado; para empresas de tecnologia, diz menos.","exemplo":"Ação a R$ 12 e VPA de R$ 10: P/VP = 1,2. Ação a R$ 8 com o mesmo VPA: P/VP = 0,8, abaixo do patrimônio contábil.","perguntas":[{"pergunta":"Ação a R$ 30 e VPA de R$ 20. Qual é o P/VP?","alternativas":["50","0,67","1,5","10"],"correta":2,"explicacao":"30 ÷ 20 = 1,5."},{"pergunta":"Por que o P/VP diz pouco sobre uma empresa de software?","alternativas":["Porque empresas de software não têm ações.","Porque grande parte do valor está em ativos que não aparecem no patrimônio, como marca e tecnologia.","Porque o preço dessas ações nunca varia.","Porque o P/VP só vale para FIIs."],"correta":1,"explicacao":"O patrimônio contábil não captura bem o valor de ativos intangíveis."}],"fonte":"Avaliando Empresas, Investindo em Ações (Carlos Alberto Debastiani)"},{"id":91,"modulo":3,"titulo":"O valor justo de Graham","texto":"Graham propôs uma fórmula simples para estimar o valor de uma ação: √(22,5 × LPA × VPA). O 22,5 vem de seus limites para uma compra defensiva: P/L de no máximo 15 e P/VP de no máximo 1,5 (15 × 1,5 = 22,5).","exemplo":"LPA de R$ 2 e VPA de R$ 15: √(22,5 × 2 × 15) = √675 = R$ 25,98. Se a ação custa R$ 20, está abaixo do valor estimado.","perguntas":[{"pergunta":"LPA de R$ 4 e VPA de R$ 10. Qual é o valor de Graham?","alternativas":["R$ 30,00","R$ 900,00","R$ 22,50","R$ 14,00"],"correta":0,"explicacao":"√(22,5 × 4 × 10) = √900 = 30."},{"pergunta":"De onde vem o número 22,5 da fórmula?","alternativas":["Da inflação americana.","Da taxa Selic média.","Do P/L máximo de 15 vezes o P/VP máximo de 1,5.","Do dividend yield mínimo de Bazin."],"correta":2,"explicacao":"15 × 1,5 = 22,5, os limites de Graham para o investidor defensivo."}],"fonte":"O Investidor Inteligente (Benjamin Graham)"},{"id":92,"modulo":3,"titulo":"Margem de segurança","texto":"Como toda estimativa de valor pode errar, Graham recomendava comprar só com uma boa diferença entre o valor estimado e o preço: a margem de segurança. Se você errar a conta, essa folga protege o seu dinheiro. É a ideia mais importante do investimento em valor.","exemplo":"Você estima que a ação vale R$ 30 e ela custa R$ 20. A margem de segurança é 1 − 20 ÷ 30 = 33,3%.","perguntas":[{"pergunta":"Valor estimado de R$ 50 e preço de R$ 40. Qual é a margem de segurança?","alternativas":["25%","20%","80%","10%"],"correta":1,"explicacao":"1 − 40 ÷ 50 = 0,20."},{"pergunta":"Para que serve a margem de segurança?","alternativas":["Para definir o dividendo.","Para garantir lucro rápido.","Para calcular o imposto.","Para proteger o investidor de erros nas próprias estimativas."],"correta":3,"explicacao":"Se o valor real for menor do que você estimou, a folga absorve o erro."}],"fonte":"O Investidor Inteligente (Benjamin Graham)"},{"id":93,"modulo":3,"titulo":"Um real hoje vale mais que amanhã","texto":"Dinheiro hoje vale mais que a mesma quantia no futuro, porque pode ser investido. Para comparar valores em datas diferentes, trazemos o futuro para hoje dividindo pela taxa: valor presente = valor futuro ÷ (1 + taxa) elevado ao número de anos.","exemplo":"Receber R$ 1.100 daqui a 1 ano, com taxa de 10%, vale R$ 1.000 hoje. Receber R$ 1.000 daqui a 3 anos vale R$ 751,31 hoje.","perguntas":[{"pergunta":"Quanto valem hoje R$ 1.210 recebidos daqui a 2 anos, com taxa de 10% ao ano?","alternativas":["R$ 968,00","R$ 1.210,00","R$ 1.100,00","R$ 1.000,00"],"correta":3,"explicacao":"1.210 ÷ 1,1² = 1.210 ÷ 1,21 = 1.000."},{"pergunta":"Se a taxa de desconto aumenta, o valor presente de um pagamento futuro:","alternativas":["Diminui.","Dobra.","Fica igual.","Aumenta."],"correta":0,"explicacao":"Uma taxa maior divide o valor futuro por um número maior."}],"fonte":"Valuation (Aswath Damodaran)"},{"id":94,"modulo":3,"titulo":"Fluxo de caixa descontado","texto":"No fluxo de caixa descontado, você estima o dinheiro que a empresa vai gerar nos próximos anos e traz cada valor para hoje com uma taxa de desconto. A soma é o valor estimado do negócio. É o método mais completo, mas depende muito das premissas.","exemplo":"Caixa de R$ 100, R$ 110 e R$ 121 nos próximos 3 anos, descontados a 10%: 90,91 + 90,91 + 90,91 = R$ 272,73.","perguntas":[{"pergunta":"Uma empresa vai gerar R$ 220 daqui a 1 ano e R$ 242 daqui a 2 anos. Com taxa de 10%, qual é o valor presente total?","alternativas":["R$ 380,00","R$ 400,00","R$ 462,00","R$ 420,00"],"correta":1,"explicacao":"220 ÷ 1,1 = 200; 242 ÷ 1,21 = 200; total de R$ 400."},{"pergunta":"Qual é o ponto fraco do fluxo de caixa descontado?","alternativas":["Ele não considera o tempo.","Ele só funciona para bancos.","Ele ignora o lucro da empresa.","O resultado depende muito das premissas usadas."],"correta":3,"explicacao":"Pequenas mudanças em crescimento ou taxa mudam bastante o valor final."}],"fonte":"Valuation (Aswath Damodaran)"},{"id":95,"modulo":3,"titulo":"A taxa de desconto e o WACC","texto":"A taxa de desconto representa o retorno mínimo que justifica o risco. Para a empresa toda, usa-se o WACC: a média ponderada do custo do capital dos sócios e do custo da dívida. Quanto maior o risco, maior a taxa e menor o valor presente.","exemplo":"Empresa financiada com 60% de capital próprio (custo de 15%) e 40% de dívida (custo de 10% após IR): WACC = 0,6 × 15% + 0,4 × 10% = 13%.","perguntas":[{"pergunta":"50% de capital próprio a 16% e 50% de dívida a 8%. Qual é o WACC?","alternativas":["8%","24%","16%","12%"],"correta":3,"explicacao":"0,5 × 16% + 0,5 × 8% = 12%."},{"pergunta":"Se o risco de uma empresa aumenta, o que acontece com o valor estimado pelo fluxo de caixa descontado?","alternativas":["Fica igual.","Sobe, porque risco gera retorno.","Cai, porque a taxa de desconto sobe.","Dobra."],"correta":2,"explicacao":"Uma taxa maior reduz o valor presente dos fluxos futuros."}],"fonte":"Valuation (Aswath Damodaran)"},{"id":96,"modulo":3,"titulo":"O crescimento na perpetuidade","texto":"Como não dá para projetar ano a ano para sempre, os modelos usam a perpetuidade: supõem que, a partir de certo ano, o caixa cresce a uma taxa g constante. O valor é: caixa do ano seguinte ÷ (taxa de desconto − g). O g precisa ser modesto, perto do crescimento da economia.","exemplo":"Caixa de R$ 100 no próximo ano, taxa de 12% e g de 4%: valor = 100 ÷ (0,12 − 0,04) = R$ 1.250,00.","perguntas":[{"pergunta":"Caixa de R$ 50 no próximo ano, taxa de 10% e crescimento perpétuo de 5%. Qual é o valor?","alternativas":["R$ 1.000,00","R$ 500,00","R$ 333,33","R$ 250,00"],"correta":0,"explicacao":"50 ÷ (0,10 − 0,05) = 50 ÷ 0,05 = 1.000."},{"pergunta":"Por que o g da perpetuidade deve ser modesto?","alternativas":["Porque a lei limita o g.","Porque nenhuma empresa cresce para sempre mais rápido que a economia.","Porque g alto reduz o valor da empresa.","Porque o g precisa ser igual à Selic."],"correta":1,"explicacao":"Um g alto demais faz a empresa \"valer\" absurdamente no modelo."}],"fonte":"Valuation (Aswath Damodaran)"},{"id":97,"modulo":3,"titulo":"Cuidado com as premissas","texto":"Pequenas mudanças nas premissas mudam muito o valor calculado. Por isso, analistas testam cenários: otimista, base e pessimista. Se a ação só parece barata no cenário otimista, ela provavelmente não é uma boa compra.","exemplo":"Caixa de R$ 100 e taxa de 12%: com g de 4%, o valor é R$ 1.250,00; com g de 6%, vira R$ 1.666,67. Dois pontos de g mudaram o valor em 33%.","perguntas":[{"pergunta":"No exemplo, o g subiu de 4% para 6%. Quanto o valor mudou?","alternativas":["Não mudou.","Subiu cerca de 33%.","Subiu 2%.","Subiu 50%."],"correta":1,"explicacao":"De R$ 1.250 para R$ 1.666,67: alta de cerca de 33%."},{"pergunta":"Uma ação só parece barata no cenário mais otimista. O que fazer?","alternativas":["Comprar o máximo possível.","Desconfiar: sem folga nos cenários prudentes, falta margem de segurança.","Ignorar os outros cenários.","Concluir que o cenário otimista vai acontecer."],"correta":1,"explicacao":"Uma boa compra deve fazer sentido também no cenário base."}],"fonte":"Valuation (Aswath Damodaran)"},{"id":98,"modulo":3,"titulo":"O que dois séculos de dados mostram","texto":"Jeremy Siegel reuniu dados de mais de 200 anos do mercado americano. Neles, as ações renderam em média entre 6% e 7% ao ano acima da inflação, mais que títulos e ouro. Mas houve décadas inteiras de perdas: o resultado só aparece no longo prazo.","exemplo":"Um retorno real de 6,5% ao ano transforma R$ 10.000 em R$ 66.143,66 de poder de compra em 30 anos.","perguntas":[{"pergunta":"Segundo os dados de Siegel, qual ativo rendeu mais acima da inflação no longo prazo nos EUA?","alternativas":["O ouro.","O dinheiro guardado em casa.","As ações.","Os títulos de curto prazo."],"correta":2,"explicacao":"No longo prazo, as ações lideraram o retorno real."},{"pergunta":"Qual cuidado esses dados exigem?","alternativas":["Concluir que ações nunca caem.","Lembrar que houve décadas de perdas antes da recuperação.","Investir só por um ano.","Ignorar a diversificação."],"correta":1,"explicacao":"O retorno médio vem junto com períodos longos e difíceis."}],"fonte":"Investindo em Ações no Longo Prazo (Jeremy Siegel)"},{"id":99,"modulo":3,"titulo":"Retorno real e risco juntos","texto":"Para avaliar um investimento, olhe o retorno acima da inflação e o risco que foi preciso correr. Duas carteiras com o mesmo retorno não são iguais se uma caiu 50% no caminho e a outra, 10%. Quedas grandes testam a paciência e exigem altas maiores para recuperar.","exemplo":"Depois de uma queda de 50%, é preciso subir 100% para voltar ao ponto inicial: R$ 100 viram R$ 50 e precisam dobrar para voltar a R$ 100.","perguntas":[{"pergunta":"Sua carteira caiu 20%. Quanto ela precisa subir para voltar ao valor inicial?","alternativas":["20%","40%","10%","25%"],"correta":3,"explicacao":"R$ 100 viram R$ 80; para voltar a 100, é preciso subir 20 ÷ 80 = 25%."},{"pergunta":"Rendimento de 12% num ano de inflação de 5%. Qual é o retorno real aproximado?","alternativas":["12%.","17%.","6,7%","7% exatos."],"correta":2,"explicacao":"1,12 ÷ 1,05 − 1 ≈ 6,67%."}],"fonte":"Investindo em Ações no Longo Prazo (Jeremy Siegel)"},{"id":100,"modulo":3,"titulo":"Juntando tudo","texto":"Um caminho que reúne as lições: quite dívidas caras, monte a reserva, invista com objetivo e prazo, diversifique, prefira bons negócios a apostas, pague preços razoáveis com margem de segurança, controle os custos e tenha paciência. Simples de dizer, difícil de seguir.","exemplo":"Uma pessoa que investe R$ 500 por mês por 30 anos, com retorno real de 0,5% ao mês, termina com R$ 502.258 em poder de compra de hoje.","perguntas":[{"pergunta":"Qual destas ordens segue o que você aprendeu?","alternativas":["Fazer day trade para quitar as dívidas.","Investir em ações, depois pensar na reserva.","Quitar dívidas caras, montar a reserva e depois investir no longo prazo.","Comprar o ativo que mais subiu, depois quitar dívidas."],"correta":2,"explicacao":"Cada etapa protege a seguinte."},{"pergunta":"Qual atitude resume o investimento em valor?","alternativas":["Concentrar tudo numa única aposta.","Comprar o que está na moda.","Vender toda vez que a bolsa cai.","Comprar bons negócios abaixo do valor estimado, com margem de segurança."],"correta":3,"explicacao":"Bons negócios, preço razoável e folga para errar."}],"fonte":"O Investidor Inteligente (Benjamin Graham)"}];
var LKEY = 'vidagrana-licoes';
function lGet() {
  var o = {};
  try {
    o = JSON.parse(localStorage.getItem(LKEY)) || {};
  } catch (e) {}
  o.done = o.done || [];
  o.streak = o.streak || 0;
  o.best = o.best || 0;
  if (o.rem == null) o.rem = -1;
  return o;
}
function lPut(o) {
  try {
    localStorage.setItem(LKEY, JSON.stringify(o));
  } catch (e) {}
}
function dstr(d) {
  return (
    d.getFullYear() +
    '-' +
    ('0' + (d.getMonth() + 1)).slice(-2) +
    '-' +
    ('0' + d.getDate()).slice(-2)
  );
}
function hoje() {
  return dstr(new Date());
}
function ontem() {
  var d = new Date();
  d.setDate(d.getDate() - 1);
  return dstr(d);
}
function lStreak(o) {
  return o.last === hoje() || o.last === ontem() ? o.streak : 0;
}
function lNextId(o) {
  for (var i = 0; i < LIC.length; i++) if (o.done.indexOf(LIC[i].id) < 0) return LIC[i].id;
  return LIC[o.done.length % LIC.length].id;
}
function lById(id) {
  for (var i = 0; i < LIC.length; i++) if (LIC[i].id === id) return LIC[i];
  return LIC[0];
}
function lCard() {
  var o = lGet(),
    st = lStreak(o),
    fez = o.last === hoje(),
    x = lById(lNextId(o));
  var dd = st === 1 ? ' dia seguido' : ' dias seguidos',
    sub = fez
      ? '🔥 ' + st + dd + ' · amanhã tem mais'
      : st
        ? '🔥 ' + st + dd + ' · não perca a sequência'
        : 'Leva 2 minutos · comece sua sequência';
  return (
    '<button class="diff licard' +
    (fez ? ' feita' : '') +
    '" data-act="licao"><div class="e">' +
    (fez ? '✅' : '📚') +
    '</div><div><b>' +
    (fez ? 'Lição de hoje feita!' : 'Lição do dia · ' + esc(x.titulo)) +
    '</b><span>' +
    sub +
    '</span></div></button>'
  );
}
function lRemChips(o) {
  if (!(window.VGNative && VGNative.setReminder)) return '';
  var hs = [
    [-1, 'Desligado'],
    [8, '8h'],
    [12, '12h'],
    [19, '19h'],
    [21, '21h'],
  ];
  return (
    '<p class="muted sm" style="margin:14px 0 6px">🔔 Lembrete diário da lição</p><div class="chips">' +
    hs
      .map(function (h) {
        return (
          '<button class="chip' +
          (o.rem === h[0] ? ' on' : '') +
          '" data-act="l_rem" data-h="' +
          h[0] +
          '">' +
          h[1] +
          '</button>'
        );
      })
      .join('') +
    '</div>'
  );
}
function lOpen(id, rev) {
  cur = { type: 'licao', id: id, step: 'ler', q: 0, pick: null, hits: 0, rev: !!rev };
  drawModal();
}
function lFinish() {
  var o = lGet(),
    x = lById(cur.id),
    primeira = o.last !== hoje();
  if (!cur.rev) {
    if (o.done.indexOf(x.id) < 0) o.done.push(x.id);
    if (primeira) {
      o.streak = (o.last === ontem() ? o.streak : 0) + 1;
      o.last = hoje();
      o.best = Math.max(o.best, o.streak);
      try {
        var sv = load();
        if (sv && !sv.over) {
          sv.happy = Math.min(100, (sv.happy || 60) + 2);
          localStorage.setItem(SAVE, JSON.stringify(sv));
          cur.bonus = true;
        }
      } catch (e) {}
    }
    if (primeira) energiaRecarregar();
    lPut(o);
    if (window.VGNative && VGNative.lessonDone) {
      try {
        VGNative.lessonDone(hoje(), o.streak);
      } catch (e) {}
    }
  }
  cur.step = 'fim';
  cur.primeira = primeira && !cur.rev;
  drawModal();
}
function lHTML(m) {
  var x = lById(m.id),

/* ENERGIA: limita a 6 meses avançados por dia; lição dá +1 carga extra */

var ENERGIA_KEY = 'vidagrana-energia';

function energiaGet() {
  try {
    var e = JSON.parse(localStorage.getItem(ENERGIA_KEY) || 'null');
    if (!e || e.dia !== hoje()) return { carga: 6, dia: hoje() };
    return e;
  } catch (x) {
    return { carga: 6, dia: hoje() };
  }
}

function energiaPut(e) {
  try { localStorage.setItem(ENERGIA_KEY, JSON.stringify(e)); } catch (x) {}
}

function energiaCarga() {
  return energiaGet().carga;
}

function energiaUsar(n) {
  var e = energiaGet();
  e.carga = Math.max(0, e.carga - (n || 1));
  energiaPut(e);
}

function energiaRecarregar() {
  var e = energiaGet();
  e.carga += 1;
  energiaPut(e);
}

function energiaBarHtml() {
  var e = energiaGet();
  var c = e.carga, base = 6, pips = '';
  for (var i = 0; i < base; i++) {
    pips += '<span class="ep' + (i < c ? ' on' : '') + '"></span>';
  }
  var extra = c > base ? '<span class="ep-b">+' + (c - base) + '</span>' : '';
  return '<div class="energia-bar" title="' + c + ' meses disponíveis hoje">' + pips + extra + '</div>';
}

function monthFlow() {
  var s = S,
    inc = income(),
    out = livingNow() + itemsMonthly() + kidsMonthly();
  s.recur.forEach(function (r) {
    out += r.amt;
  });
  s.inst.forEach(function (x) {
    out += x.amt;
  });
  if (s.study) out += s.study.per;
  s.props.forEach(function (p) {
    if (p.loan) out += curPay(p.loan);
    if (p.cons && p.cons.left > 0) out += p.cons.P;
    if (p.owned) {
      out += p.V * 0.0008;
      if (p.use === 'alugar' && !p.vac) inc += rentOf(p);
    }
  });
  return { inc: inc, out: out };

/* AUTH: Google Sign-In via VGNative + Supabase Auth + cloud save/load */

var AUTH_KEY = 'vidagrana-auth';

function authGet() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (x) { return null; }
}
function authPut(s) {
  try { localStorage.setItem(AUTH_KEY, JSON.stringify(s)); } catch (x) {}
}
function authClear() {
  try { localStorage.removeItem(AUTH_KEY); } catch (x) {}
}
function authUser()   { var s = authGet(); return s ? s.user_id : null; }
function authToken()  { var s = authGet(); return s ? s.access_token : null; }
function authName()   { var s = authGet(); return s ? s.name : ''; }
function authLogged() { return !!authToken(); }

/* Chamado pelo Android nativo após o fluxo do Google */
window.vgGoogleLoginResult = function (json) {
  var r;
  try { r = JSON.parse(json); } catch (x) { r = { error: 'parse' }; }
  if (!r || !r.idToken) {
    if (!r || r.error !== 'cancelled') toast('Erro ao entrar. Tente novamente.');
    render();
    return;
  }
  fetch(SB_URL.replace(/\/$/, '') + '/auth/v1/token?grant_type=id_token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
    body: JSON.stringify({ provider: 'google', id_token: r.idToken }),
  })
    .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
    .then(function (session) {
      authPut({
        access_token: session.access_token,
        user_id: session.user.id,
        name: (session.user.user_metadata || {}).full_name || session.user.email || 'Usuário',
      });
      toast('✅ Conectado: ' + authName());
      cloudSync();
    })
    .catch(function () {
      toast('Erro ao conectar conta. Tente novamente.');
      render();
    });
};

function sbAuth(path, opt) {
  opt = opt || {};
  var h = { apikey: SB_KEY, Authorization: 'Bearer ' + authToken() };
  if (opt.body) {
    h['Content-Type'] = 'application/json';
    h['Prefer'] = 'resolution=merge-duplicates';
  }
  return fetch(SB_URL.replace(/\/$/, '') + '/rest/v1/' + path, {
    method: opt.method || 'GET',
    headers: h,
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  }).then(function (r) {
    return r.ok ? (r.status === 204 ? null : r.json()) : Promise.reject(r.status);
  });
}

function cloudSave(state) {
  if (!authLogged() || !useSB()) return;
  var s = state || load();
  if (!s) return;
  sbAuth('saves', {
    method: 'POST',
    body: {
      user_id: authUser(),
      data: JSON.stringify(s),
      updated_at: new Date().toISOString(),
    },
  }).catch(function () {});
}

function cloudLoad(cb) {
  if (!authLogged() || !useSB()) { cb(null); return; }
  sbAuth('saves?user_id=eq.' + authUser() + '&select=data,updated_at&limit=1')
    .then(function (rows) {
      var row = rows && rows[0];
      cb(row ? { data: JSON.parse(row.data), at: row.updated_at } : null);
    })
    .catch(function () { cb(null); });
}

function cloudSync() {
  cloudLoad(function (remote) {
    if (!remote) { cloudSave(); render(); return; }
    var local = load();
    if (!local) {
      try { localStorage.setItem(SAVE, JSON.stringify(remote.data)); } catch (e) {}
      toast('☁️ Progresso restaurado da nuvem!');
      render();
      return;
    }
    window._cloudRemote = remote;
    startView = 'cloud_sync';
    render();
  });
}

function cloudSyncChoose(useRemote) {
  if (useRemote && window._cloudRemote) {
    try { localStorage.setItem(SAVE, JSON.stringify(window._cloudRemote.data)); } catch (e) {}
    toast('☁️ Progresso da nuvem restaurado!');
  } else {
    cloudSave();
    toast('💾 Save local enviado para a nuvem.');
  }
  window._cloudRemote = null;
  startView = 'home';
  render();
}

function googleSignIn() {
  if (window.VGNative && VGNative.googleSignIn) {
    VGNative.googleSignIn();
  } else {
    toast('Login disponível apenas no app instalado.');
  }
}

function authLogout() {
  authClear();
  startView = 'home';
  render();
  toast('Conta desconectada.');
}
